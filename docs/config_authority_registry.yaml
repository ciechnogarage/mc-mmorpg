    evidence: docs/pvp-foundation-v0.0.1.md

  - id: professions
    domain: economy
    authority: unresolved
    current_adapter: none
    target_persistence: mariadb
    consumers: [MMOProfiles, MMOItems, CMI_Vault, MythicDungeons, MCPets]
    status: blocker_no_dedicated_profession_authority
    evidence: docs/professions-foundation-v0.0.1.md

  - id: quests_and_objectives
    domain: world_pve
    authority: unresolved
    current_adapter: none
    target_persistence: mariadb
    consumers: [MMOProfiles, MythicDungeons, MythicMobs, Guilds]
    status: blocker_no_dedicated_quest_authority
    evidence: docs/quest-contract-objective-foundation-v0.0.1.md

  - id: seasons_prestige_cosmetics
    domain: meta
    authority: unresolved
    current_adapter: none
    target_persistence: mariadb_persistent_and_seasonal_split
    consumers: [MMOProfiles, PvP_Season, Guilds, MCPets]
    status: blocker_reset_boundary_not_implemented
    evidence: docs/seasons-prestige-cosmetics-foundation-v0.0.1.md
