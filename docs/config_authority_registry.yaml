version: 1
registry_scope: observed_and_proposed_technical_implementation_authority
authority_layers:
  product_semantic_authority:
    canonical_source: docs/product/00-domain-ownership.yaml
    approved_decisions_source: docs/product/00-decision-registry.yaml
    rule: Product ownership wins for product semantics and is never inferred from a plugin or adapter name in this registry.
  technical_implementation_authority:
    field: contracts[].authority
    rule: An unresolved value means no technical implementation authority is selected or proven; it does not mean the product domain lacks an approved owner.
status_vocabulary:
  contract_status:
  - draft
  - proposed
  - accepted
  - superseded
  - rejected
  runtime_status:
  - not_tested
  - blocked
  - partial
  - verified
  - failed
  release_status:
  - blocked
  - conditional
  - approved
contract_status: accepted
runtime_status: partial
release_status: blocked
last_reviewed: '2026-08-12'
design_index: docs/foundation-index.md
runtime_manifest: docs/plugin_manifest.yaml
product_governance:
  master_bible: docs/product/00-master-product-bible.md
  ownership_registry: docs/product/00-domain-ownership.yaml
  decision_registry: docs/product/00-decision-registry.yaml
  open_questions: docs/product/00-open-questions.yaml
  intake_registry: docs/product/00-current-state-intake.yaml
  conflict_registry: docs/product/00-conflict-registry.yaml
  release_roadmap: docs/product/00-release-roadmap.md
rules:
- shared one durable authority
- plugin configs adapters stable contract IDs
- seasonal state isolated persistent character cosmetic state
- unresolved authority blocker cross-domain implementation
- registry statuses remain observed source metadata
- product semantic ownership comes only from Domain 00 ownership and decision registries
- unresolved implementation authority does not reopen approved product ownership
