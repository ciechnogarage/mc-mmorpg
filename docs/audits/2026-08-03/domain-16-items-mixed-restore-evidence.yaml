summary: |
  A full mixed local-file plus MariaDB restore drill was completed for one named backend slice: `srv-items`. During one observation
  window, local store files from `CoreTools` and `LuckPerms` were snapshotted from the live backend, restored into an isolated temp
  tree, and hash-verified against the source. In the same window, the active `mcmmorpg` MariaDB schema was dumped, restored into a
  temporary probe database, and verified to contain the expected table and row count. This is enough to move the `items` slice from
  hypothetical mixed restore to tested mixed restore. It is not enough to upgrade full Domain 16 recoverability on its own.

notes:
  - "The temporary probe database was dropped after verification."
  - "Temporary local restore artifacts were kept only for the duration of the drill and will be removed after evidence capture."
  - "This artifact intentionally proves one slice-level mixed restore path without claiming a complete historical backup/restore workflow for the whole domain."
  - "This artifact narrows the earlier `mixed_local_file_plus_db_restore: BLOCKED` conclusion in `docs/audits/2026-08-03/domain-16-restore-test-evidence.yaml`, but only for the named `srv-items` slice."
