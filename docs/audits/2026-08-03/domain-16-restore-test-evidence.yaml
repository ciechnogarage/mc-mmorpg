summary: |
  Two real restore drills were completed on 2026-08-03 without damaging the healthy staging baseline. First, the archived
  `level_1_template_20260705_184530.tgz` world/template backup was restored into an isolated temp directory and validated
  structurally, including Iris datapack contents. Second, the live `mcmmorpg` MariaDB schema was dumped and restored into
  a temporary database, verified, and dropped cleanly. Those probes are enough to upgrade restore evidence from purely
  hypothetical to partially tested, but they do not prove full recoverability for the Domain 16 runtime because the active
  stack still includes untested local `sqlite`/`h2` stores and lacks a complete mixed-scope restore walkthrough.

