  - "The active runtime currently has no `MCMMORPG/recovery` directory, which matches the blocker already named in `docs/technical/backup-and-recovery.md`."
  - "A later artifact from the same day, `docs/audits/2026-08-03/domain-16-items-mixed-restore-evidence.yaml`, narrows the mixed-slice portion of `BLK-RECOVERY-001` and `BLK-RECOVERY-002` for `srv-items` only."
