summary: |
  A real deployment/rollback control drill was executed on the running staging baseline using the currently observed legacy helper path
  `MCMMORPG/docker/mc`. The `hub` slice was healthy before the drill, then was intentionally stopped, observed in a degraded state while
  `velocity` and MariaDB stayed healthy, and finally brought back to `running|healthy` with the same startup footprint as before. This is
  enough to prove that Domain 16 can perform and recover from a targeted backend lifecycle operation on the legacy path. It is not enough
  to upgrade release status, because the tested path is not yet the canonical `mcenv` selector model and the drill did not revert an actual
  jar/config change.

notes:
  - "This artifact proves legacy-path deployment control for one slice, not the target-state `mcenv` rollout model."
  - "Hub restart reached `healthy` again at 2026-08-03T15:16:09+02:00 with `velocity` and `mcmmorpg-mariadb` still healthy."
  - "The observed warning classes after restart matched the prior baseline and were treated as known compatibility/security caveats, not new deployment regressions."
