    owner: domain-16
    scope: modelengine-runtime-surface

summary: |
  The currently running staging compose baseline proves that the plugin stack is broadly boot-compatible at the runtime level: the required backends stay
  healthy, the MMO chain on `srv-items` hooks together, the CMI/CMILib/LuckPerms/Vault hub stack loads, and the world-facing Mythic/ModelEngine stack
  completes startup. However, the boot logs are not clean enough for a release-safe compatibility claim. The live evidence still contains economy-provider
  warnings on the items slice plus world-slice MythicMobs and ModelEngine warning classes, so the overall compatibility evidence is useful but remains
  `BLOCKED` for release-facing claims.

notes:
  - "This artifact is intentionally narrower than gameplay validation: it proves boot-time compatibility surfaces, not full player-visible behavior."
  - "The stale host-level `MCMMORPG/logs/latest.log` from 2026-07-05 was not used as a success signal; compose-backed live logs were primary."
  - "Velocity offline-mode warnings remain a security caveat tracked elsewhere and were not reclassified here as plugin-load failures."
