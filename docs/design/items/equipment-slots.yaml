schema_version: 1
status: draft
updated_at: "2026-07-31"
owner_domain: "05-itemization"

notes:
  - "Draft planning file. Not runtime truth."
  - "Relic slot semantics beyond slot identity live in docs/design/items/relic-contract.yaml."
  - "Budget multipliers are unresolved until domain 03 publishes symbolic budget rules."
  - "No concrete slot coefficient is authoritative here before domain-03 budget authority is published."
  - "Affix-eligibility booleans below are slot-registry placeholders only; the authoritative slot-to-affix contract remains blocked on affix-taxonomy work."
  - "Relic is modeled as a dedicated slot, not as a generic accessory alias."
  - "Approved domain-05 v1 scope is conservative and excludes gloves, bracelet, and artifact1-3."
  - "artifact1-3 remain legacy runtime slots only and are non-authoritative for domain-05 v1 rules."

slots:
  main_hand:
    category: "weapon"
    budget_multiplier_contract: "pending_domain_03_symbolic_budget_authority"
    allowed_item_tags:
      - "weapon"
    allows_offensive_affixes: true
    allows_defensive_affixes: false
    dual_wield_role: "primary"
    unique_equip_scope: null
    visible_in_equipment_ui: true
    runtime_source:
      plugin: "MMOItems/MMOInventory"
    status: "supported_in_principle"

  off_hand:
