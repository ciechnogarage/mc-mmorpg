open_questions:
  - "Whether off-hand weapons are globally allowed or class/proficiency-gated belongs to domain 04."
  - "Final slot coefficient authority depends on domain-03 combat budget math."

deferred_runtime_slots:
  - slot_id: "gloves"
    reason: "Outside approved domain-05 v1 scope."
    note: "May continue to exist as runtime/plugin capability without creating domain-05 v1 requirements."
  - slot_id: "bracelet"
    reason: "Outside approved domain-05 v1 scope."
    note: "May continue to exist as runtime/plugin capability without creating domain-05 v1 requirements."
  - slot_id: "artifact1"
    reason: "Outside approved domain-05 v1 scope."
    note: "Legacy runtime slot only; not an authority for v1 equip legality, affix eligibility, semantics, or any Relic behavior."
  - slot_id: "artifact2"
    reason: "Outside approved domain-05 v1 scope."
    note: "Legacy runtime slot only; not an authority for v1 equip legality, affix eligibility, semantics, or any Relic behavior."
  - slot_id: "artifact3"
    reason: "Outside approved domain-05 v1 scope."
    note: "Legacy runtime slot only; not an authority for v1 equip legality, affix eligibility, semantics, or any Relic behavior."

legacy_compatibility_rules:
  artifact1_to_3:
    v1_authority: "none"
    load_behavior: "migrate_to_supported_v1_slot_or_reject"
    silent_fallback_forbidden: true
    note: "Legacy artifact slots may exist in runtime/plugin state, but they must not be interpreted as supported v1 slot authority."
  offhand_weapon:
    slot_category_authority: "05-itemization"
    equip_gate_authority: "04-classes"
    v1_runtime_behavior: "reject_or_disable_until_domain_04_gate_is_published"
    silent_enable_forbidden: true
