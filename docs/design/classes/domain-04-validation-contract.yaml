  - D04-INV-PROG-002
- id: D04-RG-PVP
  topic: pvp
  proves: 'PvP combat engagement locks loadout edits after dealing or receiving damage,
    and PvP modifiers resolve through the Domain 03 pvp-mode-modifier contract rather
    than a Domain 04 local rule.

    '
