  topic: cost
  proves: 'executing a skill spends the Domain 03 resource cost referenced by its
    resource_costs entry, and an insufficient resource blocks execution instead of
    executing for free.

    '
  evidence_channel: plugin_api
  backend: dev_lease_backend
  lease_required: true
  covers_invariants:
