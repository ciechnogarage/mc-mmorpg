  topic: cooldown
  proves: 'cooldown and global cooldown behave per the referenced Domain 03 cooldown
    rules, and no Domain 04 path resets or bypasses a running cooldown, including
    loadout swap and respec.

    '
  evidence_channel: plugin_api
  backend: dev_lease_backend
  lease_required: true
