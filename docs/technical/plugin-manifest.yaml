# Superseded Domain 16 plugin review snapshot from 2026-07-22.
# Do not use this file as current inventory truth. The one canonical manifest is
# docs/plugin_manifest.yaml; this normalized snapshot remains only as historical
# evidence for documents and audits that explicitly cite the 2026-07-22 baseline.

manifest_version: 1
document_status: superseded
canonical_manifest_ref: docs/plugin_manifest.yaml
snapshot_observed_at: "2026-07-22"
contract_status: superseded
runtime_status: partially_verified
release_status: blocked
document_owner: domain-16
status_vocabulary_ref: docs/technical/status-and-evidence-vocabulary.md#canonical-status-and-evidence-rules

server:
  target_minecraft_version: "1.21.11"
  paper_runtime: "Paper 1.21.11-127-main@bd74bf6"
  java_runtime: "Temurin/OpenJDK 21.0.11+10 LTS"
  environment: staging
  server_folder: MCMMORPG
  baseline_created_at: "2026-07-22"

schema_rules:
  required_plugin_fields:
    - id
    - name
    - version
    - release_channel
    - source
    - required
    - dependencies
    - paper_compatibility
    - java_compatibility
    - database_usage
    - network_usage
    - config_owner
    - update_policy
    - runtime_status
  field_conventions:
    release_channel:
      - release
      - snapshot
      - unknown
    source:
      - internal
      - vendor
      - unknown
    database_usage:
      - none
      - local_file
      - shared_mariadb
      - unknown
    network_usage:
      - true
      - false
      - unknown
    update_policy:
      - manual_approval
      - staging_required
      - blocked
      - unknown
  baseline_limits:
    - "Dependencies are only populated when the current repository proves them."
    - "Empty arrays mean 'not proven here', not 'guaranteed none'."
    - "`required: true` means required for the current active staging inventory baseline."
    - "`source: vendor` means a third-party plugin present in runtime inventory; it does not prove the upstream distributor."
    - "`database_usage: local_file` means the currently observed runtime uses plugin-local h2 or sqlite, not shared MariaDB."
    - "`database_usage: shared_mariadb` should only be used when the current repo proves active MariaDB usage, not merely exposed credentials or disabled MySQL blocks."
    - "Top-level `evidence_refs` contains full evidence objects; plugin-level `evidence_ref_ids` only reuses named evidence IDs from that canonical list."

evidence_refs:
  - evidence_id: EVID-PLUGIN-DOC-2026-06-24
    source_type: document
    source_path: docs/plugin_manifest.yaml
    observed_at: "2026-06-24"
    scope: legacy plugin inventory, versions, roles, owners, and runtime notes
    summary: Legacy plugin manifest is the source for prior names, roles, and selected notes.
  - evidence_id: EVID-COMPAT-MATRIX-2026-06-24
    source_type: document
    source_path: docs/compatibility_matrix.md
    observed_at: "2026-06-24"
    scope: staging-observed compatibility subset for MMO/Mythic/packet stack
    summary: Compatibility matrix confirms a subset of the stack on Paper 1.21.11 staging.
  - evidence_id: EVID-PLUGIN-DIR-2026-07-22
    source_type: inventory
    source_path: MCMMORPG/plugins
    observed_at: "2026-07-22"
    scope: active plugin jar baseline
    summary: Active jars present under MCMMORPG/plugins on 2026-07-22.
  - evidence_id: EVID-DISABLED-PLUGIN-DIR-2026-07-22
    source_type: inventory
    source_path: MCMMORPG/disabled-runtime-blockers/plugins
    observed_at: "2026-07-22"
    scope: intentionally disabled runtime blockers
    summary: Disabled runtime blockers inventory includes HuskSync outside the active baseline.

