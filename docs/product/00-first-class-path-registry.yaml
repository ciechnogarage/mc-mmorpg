candidate_paths:
  - candidate_id: candidate.builder_architect
    display_name: Builder / Architect
    scope_status: candidate
    coordinating_owner_domain: "06"
    contributing_domains: ["00", "09", "10", "14", "16", "18", "19"]
    current_boundary: >-
      Building is an approved supported playstyle through protected private
      plots or estates, profession farms and workshops, guild headquarters, and
      controlled public projects. It is not yet a separate first-class path.
    promotion_requirements:
      - explicit player promise, entry, mastery, accomplishment, and ecosystem card
      - authoritative plot, protection, ownership, persistence, and rollback contracts
      - builder-specific contracts, jobs, project economy, and mastery progression
      - runtime, abuse-resistance, player-value, and operability evidence
      - new Domain 00 approval and registry revision

supporting_capabilities:
  - capability_id: support.trade_market
    display_name: Trade and market
    scope_status: supporting
    coordinating_owner_domain: "10"
    boundary: A healthy market is required ecosystem infrastructure; a separate merchant level or career is not required for product completeness.
  - capability_id: support.collection
    display_name: Collection catalog and display
    scope_status: supporting
    coordinating_owner_domain: "00"
    contributing_domains: ["05", "06", "07", "09", "11", "12", "14", "18"]
    boundary: Collection is a cross-cutting supported playstyle sourced by many paths, not an artificial universal collector progression.
  - capability_id: support.hybrid_building
    display_name: Hybrid plots, estates, workshops, and public projects
    scope_status: supporting
    coordinating_owner_domain: "06"
    contributing_domains: ["09", "14", "16", "18", "19"]
    boundary: The common world stays authored and protected while bounded private and organizational building gives accomplishment a real place.
  - capability_id: support.quests_narrative
    display_name: Quests and narrative
    scope_status: supporting
    coordinating_owner_domain: "08"
    boundary: Narrative is a layer across paths, not a mandatory separate progression fantasy.
  - capability_id: support.classes_builds
    display_name: Classes and builds
    scope_status: supporting
    coordinating_owner_domain: "04"
    boundary: Classes and builds enable combat expression across relevant paths but are not a separate path in this registry.
  - capability_id: support.itemization
    display_name: Itemization
    scope_status: supporting
    coordinating_owner_domain: "05"
    boundary: Items carry progression and interdependence across paths but are not a standalone path.
  - capability_id: support.economy
    display_name: Economy
    scope_status: supporting
    coordinating_owner_domain: "10"
    boundary: Economic policy connects paths and protects ecosystem health but is not itself a progression fantasy.
  - capability_id: support.social_basics
    display_name: Party, chat, and friends
    scope_status: supporting
    coordinating_owner_domain: "19"
