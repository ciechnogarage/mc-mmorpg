    primary_segment_ids: [segment.self_directed_persistent_world_inhabitant]
    progression_fantasy:
      player_promise: Explore, understand, and master authored regions and islands as a complete open-world PvE path.
      first_session_entry: Begin a real island or regional objective without first completing a dungeon or an unrelated profession ladder.
      mastery_horizon: Master increasingly dangerous regions through knowledge, execution, access, and path-specific challenges rather than flat stat inflation alone.
      lasting_accomplishment: Preserve legible regional discoveries, access, trophies, reputation, and history worth returning to.
      ecosystem_role: Supply discoveries, materials, public-event participation, and world knowledge to the shared ecosystem.
      minecraft_world_expression: Progress is embodied in authored places, routes, encounters, unlocks, and visible world consequences rather than only menus.
    required_surfaces:
      - islands.entry_and_orientation
      - islands.regional_progression
      - islands.exploration_and_discovery
      - islands.encounters_and_challenge
      - islands.rewards_and_persistence
      - islands.return_path
    scope_authority_refs:
      - PRODUCT-GOV-010
    downstream_context_refs:
      - docs/contracts/world-progression-model.md
      - docs/contracts/world-progression-contract.yaml
    blocking_refs: []
    missing_delivery_evidence:
      - complete path contract against all required surfaces
      - isolated runtime evidence
      - player-value evidence
      - release-gate evidence

