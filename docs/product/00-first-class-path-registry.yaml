meta:
  document: first-class-path-registry
  domain: "00"
  status: active
  registry_revision: path-registry-r1
  tier_0_norm_revision: tier0-r2
  authority_decision_id: PRODUCT-GOV-010
  effective_at: "2026-08-12"
  approved_by: project_owner
purpose: >-
  Define the exact owner-approved set of first-class player paths for Tier 0,
  distinguish them from candidates and supporting capabilities, and prevent
  scope approval from being mistaken for runtime or release readiness.

primary_segment:
  segment_id: segment.self_directed_persistent_world_inhabitant
  canonical_ref: docs/product/00-tier-0-product-identity.md

status_vocabulary:
  scope_status:
    - approved_first_class
    - candidate
    - supporting
  delivery_status:
    - cannot_judge
    - blocked
    - runtime_partial
    - runtime_verified
    - release_ready

claim_rules:
  - A path is a durable player fantasy with its own entry, mastery horizon, lasting accomplishment, and ecosystem role; a feature, mode, recipe, organization, or menu is not automatically a path.
  - Scope approval proves only that the path belongs to the product promise. It does not prove design completeness, runtime behaviour, player value, balance, operability, or release readiness.
  - Missing or incomplete delivery evidence yields cannot_judge, never PASS.
  - The unqualified claim that Tier 0 path scope is delivered requires all thirteen approved first-class paths to be release_ready against the same declared release envelope.
  - A bounded pilot, alpha, or release may cover fewer paths only when it names the included path_ids and required surfaces explicitly and does not claim full Tier 0 coverage.
  - A family cannot inherit a positive delivery status from only one child. Every child path retains an independent delivery status.
  - A candidate cannot become first-class without a new explicit Domain 00 decision and registry revision.
  - Supporting capabilities are required where referenced by a path, but they are not separate progression fantasies and must not be counted as additional first-class paths.

families:
  - family_id: family.pve
    display_name: PvE world and instance mastery
    scope_status: approved_first_class
    delivery_status: cannot_judge
    child_path_ids:
      - path.islands
      - path.dungeons
    rollup_rule: Both child paths retain separate status; neither may require completion of the other as a universal entry gate.
  - family_id: family.competitive
    display_name: Competitive play
    scope_status: approved_first_class
    delivery_status: cannot_judge
    child_path_ids:
      - path.pvp
    rollup_rule: Duel, arena/ranked, open-world/contested, and guild-war are required reportable surfaces of one PvP path, not four separate paths.
  - family_id: family.social
    display_name: Durable social organization
    scope_status: approved_first_class
    delivery_status: cannot_judge
    child_path_ids:
      - path.guild
    rollup_rule: Guild identity alone is insufficient; projects, headquarters, roles, history, influence, and goals are part of the path contract.
  - family_id: family.companions
    display_name: Pets
    scope_status: approved_first_class
    delivery_status: blocked
    child_path_ids:
      - path.pets
    rollup_rule: Acquisition, breeding, training, collection, and pet battles are parts of one Pets path; mounts and class summons remain supporting applications.
  - family_id: family.professions
    display_name: Professions
    scope_status: approved_first_class
    delivery_status: blocked
    child_path_ids:
      - path.profession.miner
      - path.profession.lumberjack
      - path.profession.harvester
      - path.profession.blacksmith
      - path.profession.armorer
      - path.profession.alchemist
      - path.profession.artificer
      - path.profession.cook
    rollup_rule: All eight professions have independent status; one working profession, recipe set, or organization cannot make the family green.

