  - question_id: PRODUCT-QUESTION-004
    title: What authoritative persistence and reset boundary applies across 02, 11, and 13?
    status: open
    area: cross_domain_02_11_13
    why_it_matters: >-
      Ownership is approved for 11 and 13, but seasonal transitions still need
      an explicit persistence owner review and authoritative statement on what
      resets, what persists, and how product release framing communicates that
      boundary to players.
    affected_domains:
      - "02"
      - "11"
      - "13"
      - "17"
    blocking: true
    related_decision_ids:
      - PRODUCT-GOV-003
      - PRODUCT-GOV-009
      - PRODUCT-GOV-010
    related_conflict_ids:
      - CONFLICT-002
      - CONFLICT-005
    owner_to_answer: "00"
    evidence_needed:
      - explicit persistence-owner review from 02
      - release-gate language for seasonal transitions
      - approved statement on competitive reset versus durable player state
    target_resolution: before seasonal release-stage advancement beyond governance proposal
    notes: >-
      PRODUCT-GOV-009 establishes the anti-goal against silently resetting or
      invalidating durable accomplishment, but it intentionally does not close
      the exact 02/11/13 persistence and reset matrix. This remains a contract
      and release-boundary question.

  - question_id: PRODUCT-QUESTION-005
    title: How should companion direction be treated in product truth while runtime remains blocked?
    status: open
    area: domain_12_companion_systems
    why_it_matters: >-
      Repo sources document companion authority direction, but runtime and
      release status remain blocked. Domain 00 still needs an explicit
      governance boundary for how far product truth can go without runtime
      verification.
    affected_domains:
      - "02"
      - "09"
      - "10"
      - "12"
      - "17"
    blocking: true
    related_decision_ids:
      - PRODUCT-GOV-002
      - PRODUCT-GOV-008
      - PRODUCT-GOV-010
    related_conflict_ids:
      - CONFLICT-006
    owner_to_answer: "00"
    evidence_needed:
      - runtime verification path for companion authority
      - reconciliation between documented direction and blocked runtime state
      - release-gate statement for companion-dependent slices
    target_resolution: before companion-dependent claims move beyond proposed governance direction
    notes: >-
      PRODUCT-GOV-010 classifies Pets as a first-class path while explicitly
      keeping delivery blocked. It does not promote blocked companion runtime or
      release readiness. Domain 00 continues to separate product scope from
      runtime truth.
