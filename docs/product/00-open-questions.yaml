    status: resolved
    area: domain_09_professions_and_crafting
    why_it_matters: >-
      Domain 09 ownership is now approved, but crafting outputs and profession
      progression still need a clean handoff into item semantics, economy
      consequences, and any PvP overlays.
    affected_domains:
      - "05"
      - "09"
      - "10"
      - "11"
      - "12"
      - "18"
    blocking: false
    related_decision_ids:
      - PRODUCT-GOV-003
      - PRODUCT-GOV-005
    related_conflict_ids:
      - CONFLICT-004
    owner_to_answer: "00"
    evidence_needed:
      - explicit 09 -> 05 crafted-output semantics boundary
      - explicit 09 -> 10 sink and reward-economy handoff
      - explicit 09 -> 11 PvP overlay rule where crafted outputs affect combat
    target_resolution: before profession-dependent release claims advance
    resolution_contract_refs:
