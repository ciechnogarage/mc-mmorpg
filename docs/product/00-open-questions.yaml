meta:
  document: open-questions
  domain: "00"
  status: active
  purpose: Central unresolved product questions that still affect contract boundaries, persistence, release framing, or runtime truth.

rules:
  - Questions stay open until explicit decision or de-scope closes them.
  - Use stable ids so decisions, conflicts, and ownership rows can cross-link here.

questions:
  - question_id: PRODUCT-QUESTION-001
    title: What exact contract handoff closes world facts, quest state, and quest reward entitlement?
    status: resolved
    area: domain_08_quests_and_narrative
    why_it_matters: >-
      Domain 08 ownership is now approved, but release-critical quest flows
      still depend on a clean contract handoff from 06 world facts into 08
      objective credit and from 08 quest entitlement into 10 reward policy and
      14 user-facing flow.
    affected_domains:
      - "06"
      - "08"
      - "10"
      - "14"
      - "18"
    blocking: false
    related_decision_ids:
      - PRODUCT-GOV-003
      - PRODUCT-GOV-010
      - PRODUCT-GOV-004
    related_conflict_ids:
      - CONFLICT-003
    owner_to_answer: "00"
    evidence_needed:
      - explicit 06 -> 08 world-fact handoff
      - explicit 08 -> 10 reward-entitlement handoff
      - downstream release impact statement for quest-driven product slices
    target_resolution: before quest-dependent release claims advance
    resolution_contract_refs:
      - docs/contracts/quest-domain-handoff-contract.yaml
    resolved_at: "2026-08-12"
    resolution: >-
      The accepted handoff assigns world facts to 06, quest state/objective
      credit/reward entitlement to 08, reward policy to 10, transaction
      coordination to 01, and presentation projection to 14. Runtime and
      release evidence remain separate downstream gates.
    notes: Ownership and the cross-domain contract boundary are approved; implementation evidence is still blocked.

