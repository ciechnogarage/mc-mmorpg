        - market_unvalidated
        - runtime_not_evaluated
      classification: decision_registry_candidate
      confidence: high
      intake_state: promoted
      source_truth_mode: approved_target_state
      review_state: closed
      disposition: carry_as_approved
      target_artifact: docs/product/00-tier-0-product-identity.md
      conflict_ids: []
      required_evidence:
        - explicit owner approval recorded on 2026-08-12
        - PRODUCT-GOV-008
        - exact first-class-path set remains outside this promotion
      owner_to_review: "00"
      notes: >
        This promotes the promise and progression grammar as intent. It does not promote
