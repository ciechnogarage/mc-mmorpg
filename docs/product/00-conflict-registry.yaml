meta:
  document: conflict-registry
  domain: "00"
  status: active
  purpose: >
    Track disputed, contradictory, stale, ownerless, or over-asserted product
    claims before they can influence Domain 00 target-state truth.
  constraints:
    - No conflict record may imply a claim is true only because a legacy source asserted it.
    - Imported accepted, partial, and blocked statuses remain observed-source metadata.
    - Conflict closure is a governance event, not a wording cleanup.

status_model:
  allowed_statuses:
    - open
    - under_review
    - awaiting_owner
    - awaiting_evidence
    - resolved
    - superseded
  closure_rule:
    - Open, under_review, awaiting_owner, and awaiting_evidence all keep linked claims quarantined unless the record is explicitly marked non-blocking and scoped advisory only.

severity_model:
  allowed_severities:
    - critical
    - high
    - medium
    - low
  meaning:
    critical: Contradiction or ownership gap blocks approved truth and release-gate use.
    high: Strong governance conflict blocks approved truth but may not block release execution.
    medium: Conflict blocks promotion of a specific claim or artifact section.
    low: Cleanup or clarification conflict still requires explicit closure before promotion.

blocking_semantics:
  allowed_blocking_values:
    - none
    - artifact_promotion
    - domain_decision
    - release_gate
  rules:
    - artifact_promotion blocks copying linked claims into approved or accepted target-state artifacts.
    - domain_decision blocks closing a Domain 00 decision on the affected topic.
    - release_gate blocks treating a linked claim as authoritative release-readiness criteria.
    - none is allowed only when the conflict is scoped advisory and still does not promote claim truth by itself.

source_classification:
  allowed:
    - suspect_registry
    - mixed
    - stale
    - legacy_only
    - runtime_contradicted
    - unknown

open_conflict_triggers:
  - Source asserts strong truth without current owner review.
  - Source conflicts with runtime evidence, a later ADR, a later contract, or a later owner statement.
  - Source redefines domain ownership or product boundaries without Domain 00 approval.
  - Source mixes incompatible meanings such as runtime fact, design intent, and decision state in one claim.

quarantine_scope_model:
  requirements:
    - quarantine_scope must state exactly what cannot be promoted while the conflict is open.
    - quarantine_scope should name the affected artifact or decision surface when known.
  invariant_rules:
    - Claims linked to an open conflict remain quarantined.
    - Open conflicts prevent linked claims becoming approved decisions or accepted contracts.
    - Open conflicts prevent linked claims serving as release-gate truth.
    - Ticket work may cite linked claims only as unresolved observed context until the conflict exits quarantine.

resolution_exit_criteria:
  all_required:
    - owner_to_review assigned
    - decision_needed clearly states what must be decided or reconciled
    - resolution_evidence cites exact proof that closes the contradiction
    - linked intake records updated to reflect the outcome
    - quarantine scope no longer active for the resolved claim path
  closure_outputs:
    - status becomes resolved or superseded
    - blocking is reduced or cleared explicitly
    - affected target-state artifacts are updated in the same change or a cited next gated step

conflicts:
  records:
    - conflict_id: CONFLICT-001
      title: Registry implementation statuses still require per-contract evidence before product promotion
      status: awaiting_evidence
      severity: high
      claims:
        - INTAKE-001
      source_files:
        - docs/config_authority_registry.yaml
      source_classification:
        - suspect_registry
      affected_domains:
        - "00"
        - "01"
        - "08"
        - "09"
        - "11"
        - "12"
        - "17"
      quarantine_scope: >
        Do not promote registry accepted, partial, or blocked labels into approved Domain 00
        truth, accepted contracts, or release-gate language without owner review.
      blocking: artifact_promotion
      decision_needed: >
        Apply the now-documented product-versus-implementation authority split and decide,
        per contract, which implementation claims have enough owner review and evidence for
        target-state promotion.
      resolution_evidence:
        - authority-layer rules in docs/config_authority_registry.yaml
        - per-contract owner confirmation and implementation evidence before promotion
      owner_to_review: "00"
      exit_criteria:
        - Domain 00 records status-handling policy against the affected contract surfaces
        - linked intake record is updated with final disposition
      notes: >
        Registry scope is now explicit: its authority field describes technical
        implementation, while Domain 00 owns product semantics. Remaining quarantine is
        evidence-specific, not an unresolved product-owner question.
    - conflict_id: CONFLICT-002
      title: Foundation index mixes advisory input with surviving product claims
      status: open
      severity: medium
      claims:
        - INTAKE-002
      source_files:
        - docs/foundation-index.md
      source_classification:
        - mixed
      affected_domains:
        - "00"
        - "02"
        - "05"
        - "06"
        - "07"
        - "10"
        - "11"
        - "12"
        - "13"
      quarantine_scope: >
        Do not copy surviving product claims from the foundation index into approved Domain 00
        truth or release framing until each claim is extracted into a current contract or
        explicit governance decision. The exact norms promoted through PRODUCT-GOV-006..009
        into docs/product/00-tier-0-product-identity.md are outside this quarantine; similar
        or adjacent foundation wording remains quarantined.
      blocking: artifact_promotion
      decision_needed: >
        Separate which foundation statements are only advisory and which remain intended
        target-state direction worth extracting into current artifacts.
      resolution_evidence:
        - per-claim extraction into current contracts or governance decisions
        - explicit de-scope or rejection for statements not promoted
      owner_to_review: "00"
      exit_criteria:
        - each promoted claim cites its current target artifact
        - linked intake record is no longer carrying mixed meanings
      notes: >
        The file itself warns that foundation documents are not runtime truth; this conflict
        preserves that warning as an active quarantine. Tier 0 promotion is claim-specific
        and does not constitute blanket approval of the foundation corpus.
    - conflict_id: CONFLICT-003
      title: Quest product ownership and cross-domain handoffs are approved
      status: resolved
      severity: high
      claims:
        - INTAKE-003
      source_files:
        - docs/current-server-plan.md
        - docs/config_authority_registry.yaml
        - docs/contracts/quest-domain-handoff-contract.yaml
      source_classification:
        - mixed
      affected_domains:
        - "00"
        - "06"
        - "08"
        - "10"
        - "14"
        - "18"
      quarantine_scope: >
        Quarantine is lifted for the accepted 06 -> 08 world-fact, Domain 08
        objective-credit, 08 -> 10 reward-entitlement, and Domain 14 projection
        boundaries. Runtime and release claims remain gated by the contract's
        validation requirements.
      blocking: none
      decision_needed: >
        Closed by PRODUCT-GOV-004 and quest-domain-handoff-v1.
      resolution_evidence:
        - PRODUCT-GOV-004
        - docs/contracts/quest-domain-handoff-contract.yaml
        - resolved PRODUCT-QUESTION-001
      owner_to_review: "00"
      exit_criteria:
        - PRODUCT-QUESTION-001 is answered or explicitly de-scoped
        - linked intake record is updated with owner-reviewed disposition
      notes: >
        Product ownership and the semantic contract boundary are settled. This
        resolution does not claim that Domain08QuestService or its adapters are
        implemented or release-ready.
    - conflict_id: CONFLICT-004
      title: Profession product ownership and downstream handoffs are approved
      status: resolved
      severity: high
      claims:
        - INTAKE-004
      source_files:
        - docs/current-server-plan.md
        - docs/config_authority_registry.yaml
        - docs/contracts/profession-domain-handoff-contract.yaml
      source_classification:
        - mixed
      affected_domains:
        - "00"
        - "05"
        - "09"
        - "10"
        - "12"
        - "18"
      quarantine_scope: >
        Quarantine is lifted for the accepted profession persistence, 09 -> 05
        item, 09 -> 10 economy/transaction, and 09 -> 11 contextual PvP overlay
        boundaries. Runtime and release claims remain gated by the contract's
        validation requirements.
      blocking: none
      decision_needed: >
        Closed by PRODUCT-GOV-005 and profession-domain-handoff-v1.
      resolution_evidence:
        - PRODUCT-GOV-005
        - docs/contracts/profession-domain-handoff-contract.yaml
        - resolved PRODUCT-QUESTION-002
      owner_to_review: "00"
      exit_criteria:
        - PRODUCT-QUESTION-002 is answered or explicitly de-scoped
        - linked intake record is updated with owner-reviewed disposition
      notes: >
        Product ownership and the semantic contract boundary are settled. This
        resolution does not claim that Domain09ProfessionService or its adapters
        are implemented or release-ready.
    - conflict_id: CONFLICT-005
      title: Seasonal product ownership is approved while reward, payout, and reset boundaries remain unresolved
      status: awaiting_evidence
      severity: high
      claims:
        - INTAKE-005
      source_files:
        - docs/current-server-plan.md
        - docs/config_authority_registry.yaml
        - docs/foundation-index.md
      source_classification:
        - mixed
      affected_domains:
        - "00"
        - "02"
        - "10"
        - "11"
        - "13"
        - "17"
      quarantine_scope: >
        Do not promote uncontracted reward-envelope, guild projection/treasury payout, or
        persistence/reset claims into approved release framing. Approved ownership for
        Domains 11, 13, and 19 is outside this quarantine.
      blocking: release_gate
      decision_needed: >
        Close the 10/11/13/19 reward and guild payout contract bundle and decide the 02/11/13
        persistence/reset boundary across competitive, prestige, cosmetic, and durable state.
      resolution_evidence:
        - PRODUCT-GOV-003 and approved ownership rows for Domains 11, 13, and 19
        - current seasonal reward and guild payout contracts
        - explicit reset-boundary decision cited by release-facing artifacts
      owner_to_review: "00"
      exit_criteria:
        - PRODUCT-QUESTION-003 and PRODUCT-QUESTION-004 are answered or de-scoped
        - linked intake record is updated with owner-reviewed disposition
      notes: >
        Product ownership is settled. Foundation guidance remains advisory until the reward,
        payout, persistence, and reset contracts are evidenced.
    - conflict_id: CONFLICT-006
      title: Companion authority direction is documented but runtime remains blocked
      status: awaiting_evidence
      severity: high
      claims:
        - INTAKE-006
      source_files:
        - docs/adr/ADR-003-petcore-companion-authority.md
        - docs/contracts/petcore-legacy-claim-contract.yaml
        - docs/config_authority_registry.yaml
      source_classification:
        - mixed
      affected_domains:
        - "00"
        - "02"
        - "09"
        - "10"
        - "12"
        - "17"
      quarantine_scope: >
        Do not treat the documented PetCore companion direction as verified product truth,
        accepted release-gate evidence, or runtime-ready authority while blocked runtime
        remains unresolved.
      blocking: release_gate
      decision_needed: >
        Reconcile how Domain 00 should talk about companion direction versus blocked runtime,
        and define the evidence required before companion-dependent slices can advance.
      resolution_evidence:
        - current runtime verification evidence for companion authority on an allocated backend
        - explicit release-gate wording for companion-dependent slices
      owner_to_review: "00"
      exit_criteria:
        - PRODUCT-QUESTION-005 is answered or explicitly de-scoped
        - linked intake record is updated with runtime evidence or narrowed scope
      notes: >
        ADR-003 is preserved as accepted authority direction and the authority registry now
        names PetCore. Blocked runtime still quarantines implementation and release claims.
  entry_template:
    conflict_id: CONFLICT-000
    title: ""
    status: open
    severity: medium
    claims: []
    source_files: []
    source_classification: []
    affected_domains: []
    quarantine_scope: ""
    blocking: artifact_promotion
    decision_needed: ""
    resolution_evidence: []
    owner_to_review: ""
    exit_criteria: []
    notes: ""
