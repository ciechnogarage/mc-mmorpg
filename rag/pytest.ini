[pytest]
# Repository-level config for running BOTH model-service suites in one
# invocation, e.g.:
#   rag/.venv/bin/python -m pytest rag/services/embedding/tests rag/services/reranker/tests -q
#
# `services` on sys.path makes each service a distinct top-level package
# (`embedding`, `reranker`), so `embedding.app` / `reranker.app` and
# `embedding.tests` / `reranker.tests` never collide on the bare names
# `app` / `tests`.
pythonpath = services services/ragcore
testpaths =
    services/embedding/tests
    services/reranker/tests
    services/ragcore/tests
    services/indexer/tests
    services/api/tests
    services/knowledge_mcp/tests
norecursedirs = .venv */.venv
