# Przeciwnicy Gaju v1 - generowane przez forge/tools/przeciwnicy/przeciwnicy.py (nie edytowac recznie)
GAJ_WILK:
  Type: WOLF
  Display: '&6Wilk Gajowy'
  Health: 40
  Damage: 3
  Options:
    Despawn: persistent
    FollowRange: 20
    MovementSpeed: 0.34
    PreventOtherDrops: true
    KnockbackResistance: 0.3
  AITargetSelectors:
  - clear
  - attacker
  - players
  Skills:
  # SKOK: zapowiedz 0.9 s (warkniecie + przysiad), potem doskok i ugryzienie 6; po skoku 1 s odslony (wolny)
  - skill{s=GAJ_WILK_SKOK} @target ~onTimer:20

GAJ_KORZENIAK:
  Type: ZOMBIE
  Display: '&aKorzeniak'
