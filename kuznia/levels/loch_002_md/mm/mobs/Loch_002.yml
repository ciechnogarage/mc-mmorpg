  - particles{p=white_smoke;a=6;hs=10;vs=0.2;s=0.005;y=0.3} @self ~onTimer:30
  - sound{s=entity.frog.ambient;v=0.6;p=0.8} @self ~onTimer:160
  - sound{s=entity.drowned.ambient_water;v=0.3;p=0.5} @self ~onTimer:420

