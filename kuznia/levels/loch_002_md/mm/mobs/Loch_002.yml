  - mmoitem{type=MATERIAL;id=PROF_FLAX_FIBER} 1 0.35
  AIGoalSelectors:
  - clear
  - meleeattack
  - lookatplayers
  - randomlookaround
  AITargetSelectors:
  - clear
  - attacker
  - players
  Skills:
  # slad mulu: co 1,5 s zostawia plame (zyje 4 s) spowalniajaca w r=1.6 - kontra: nie idz jego sladem
  - skill{s=L002_SLAD} @selflocation ~onTimer:30
  - sound{s=block.mud.step;v=1;p=0.6} @self ~onTimer:30
  - command{c="mmocore admin exp give <trigger.name> main 25"} @trigger ~onDeath ?~isplayer
  - command{c="mmocore admin exp give <trigger.name> hunting 6"} @trigger ~onDeath ?~isplayer

