# Loch 002. Skille wolane przez funkcje MD (caster = punkt funkcji): BEZ delay, summon level=1 + os=true.
loch_002_przybycie:
  Skills:
  # gamerules.yml nie jest stosowany do recznego szablonu (zmierzone) - reguly z konsoli na swiecie instancji
  - command{c="execute in minecraft:<caster.l.w> run gamerule fall_damage false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule keep_inventory true"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule advance_time false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule advance_weather false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule mob_griefing false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule random_tick_speed 0"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule block_drops false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule drowning_damage false"}
  - command{c="execute in minecraft:<caster.l.w> run gamerule water_source_conversion false"}
  - command{c="execute in minecraft:<caster.l.w> run time set 13000"}
  - command{c="execute in minecraft:<caster.l.w> run weather rain"}
  - setvariable{var=world.l002_sekrety;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_sluza1;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_sluza2;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_sluza3;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_korba;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_dzwon;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_szeptucha;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_wrak;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_skrzynia;val=0;type=INTEGER} @self
  - setvariable{var=world.l002_wywar;val=0;type=INTEGER} @self
  - title{title="<light_purple>Loch 002</light_purple>";subtitle="<dark_green>Bagna Zgniłych Korzeni</dark_green>";fadein=15;duration=60;fadeout=20} @PlayersInRadius{r=40}
