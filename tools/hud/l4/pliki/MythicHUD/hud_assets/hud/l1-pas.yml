    tekst:
      text: '<#FFF1CC>%mmocore_level%'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: -12}

l1-hp-tekst:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - progress{l=hp;o=>=;v=30%} true hide
  layers:
    tekst:
      text: '<#FFF1CC>%player_health_rounded%/%player_max_health_rounded%'
      font: default
      outlined: true
      align: right
      offset: {x: 16, y: -14}
    hp:
      texture: {path: assets/l1/dane.png}
      scale: 0.5
      offset: {x: 0, y: 0}
      function: {listener: health, increment: 1, orientation: horizontal}

l1-hp-niskie:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - progress{l=hp;o=<;v=30%} true hide
  layers:
    tekst:
      text: '<#FFF1CC>%player_health_rounded%/%player_max_health_rounded%'
      font: default
      outlined: true
      align: right
      offset: {x: 17, y: -14}
    alarm:
      texture: {path: assets/l1/hp_alarm.png}
      scale: 0.5
      offset: {x: 0, y: -11}
    hp:
      texture: {path: assets/l1/dane.png}
      scale: 0.5
      offset: {x: 1, y: 0}
      function: {listener: health, increment: 1, orientation: horizontal}

