# Pas przetrwania L1 nad hotbarem (18.10). Kotwica: lewa krawedz hotbara, 51 GUI nad dolem.
l1-pas:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%player_health%;v=0;o=>} true hide
  layers:
    medal:
      texture: {path: assets/l1/medal.png}
      scale: 0.5
      offset: {x: 79, y: -1}
    absorpcja:
      texture: {path: assets/l1/absorpcja_fill.png}
      scale: 0.5
      offset: {x: 13, y: -13}
      function: {listener: absorpcja, increment: 67, orientation: horizontal}
      conditions:
        - progress{l=absorpcja;o=>;v=0} true hide
    hp-trucizna:
      texture: {path: assets/l1/hp_trucizna.png}
      scale: 0.5
      offset: {x: 13, y: -13}
      function: {listener: health, increment: 67, orientation: horizontal}
      conditions:
        - effect{e=poison} true hide
    hp-uschniecie:
      texture: {path: assets/l1/hp_uschniecie.png}
      scale: 0.5
      offset: {x: 13, y: -13}
      function: {listener: health, increment: 67, orientation: horizontal}
      conditions:
        - effect{e=wither} true hide
    hp:
      texture: {path: assets/l1/hp_fill.png}
      scale: 0.5
      offset: {x: 13, y: -13}
      function: {listener: health, increment: 67, orientation: horizontal}
    hp-tlo:
      texture: {path: assets/l1/pasek_tlo.png}
      scale: 0.5
      offset: {x: 12, y: -12}
    serce:
      texture: {path: assets/l1/kieszen_serce.png}
      scale: 0.5
      offset: {x: 0, y: -12}
    stamina-niska:
      texture: {path: assets/l1/stamina_niska.png}
      scale: 1
      offset: {x: 0, y: -24}
      function: {listener: stamina, increment: 10, orientation: horizontal}
      conditions:
        - progress{l=stamina-niska;o=<;v=31%} true hide
    stamina:
      texture: {path: assets/l1/stamina_fill.png}
      scale: 1
      offset: {x: 0, y: -24}
      function: {listener: stamina, increment: 10, orientation: horizontal}
    stamina-tlo:
      texture: {path: assets/l1/stamina_tlo.png}
      scale: 1
      offset: {x: 0, y: -24}

l1-poziom-1:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%mmocore_level%;v=10;o=<} true hide
  layers:
    tekst:
      text: '<#FFF1CC>%mmocore_level%'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: -12}

l1-poziom-2:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%mmocore_level%;v=10;o=>=} true hide
    - placeholder{ph=%mmocore_level%;v=100;o=<} true hide
  layers:
    tekst:
      text: '<#FFF1CC>%mmocore_level%'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: -12}

l1-poziom-3:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%mmocore_level%;v=100;o=>=} true hide
