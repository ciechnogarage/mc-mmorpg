# Okno postaci v3 (20.10): w walce, walce Chowancow i trybie kompakt PRZYGASA (alfa 45%), nie zwija sie.
# Stan z %hud_okno% (HudDane), bo MythicHUD nie ma "lub" w warunkach.
l1-okno:
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%player_health%;v=0;o=>} true hide
    - placeholder{ph=%luckperms_meta_ui_hud%;val=off} false hide
    - placeholder{ph=%hud_okno%;val=pelne} true hide
  layers:
    nick:
      text: '<#FFF1CC>%player_name%'
      font: default
      outlined: true
      align: right
      offset: {x: 46, y: -8}
    klasa:
      text: '<#D5A96B>%mmocore_class%'
      font: default
      outlined: true
      align: right
      offset: {x: 43, y: -20}
    exp-proc:
      text: '<#D5A96B>%mmocore_level_percent%%'
      font: default
      outlined: true
      align: right
      offset: {x: 116, y: -30}
    rasa-czlowiek:
      texture: {path: assets/l1/rasa_czlowiek.png}
      scale: 0.5
      offset: {x: 31, y: -31}
      conditions:
        - placeholder{ph=%wiary_rasa%;val=czlowiek} true hide
    rasa-elf:
      texture: {path: assets/l1/rasa_elf.png}
      scale: 0.5
      offset: {x: 31, y: -31}
      conditions:
        - placeholder{ph=%wiary_rasa%;val=elf} true hide
    rasa-ork:
      texture: {path: assets/l1/rasa_ork.png}
      scale: 0.5
      offset: {x: 31, y: -31}
      conditions:
        - placeholder{ph=%wiary_rasa%;val=ork} true hide
    rasa-nieumarly:
      texture: {path: assets/l1/rasa_nieumarly.png}
      scale: 0.5
      offset: {x: 31, y: -31}
      conditions:
        - placeholder{ph=%wiary_rasa%;val=nieumarly} true hide
    rasa-tlo:
      texture: {path: assets/l1/rasa_tlo.png}
      scale: 0.5
      offset: {x: 30, y: -30}
      conditions:
        - placeholder{ph=%wiary_rasa%;val=brak} false hide
    exp:
      texture: {path: assets/l1/exp_fill.png}
      scale: 0.5
      offset: {x: 43, y: -32}
      function: {listener: doswiadczenie, increment: 69, orientation: horizontal}
    glowa:
      head: {size: 4}
      align: right
      offset: {x: 6, y: -34}
    hp:
      texture: {path: assets/l1/dane.png}
      scale: 0.5
      offset: {x: 0, y: 0}
      function: {listener: health, increment: 1, orientation: horizontal}
    tlo-b:
      texture: {path: assets/l1/okno_b.png}
      scale: 0.5
      offset: {x: 128, y: 0}
    tlo:
      texture: {path: assets/l1/okno_a.png}
      scale: 0.5
      offset: {x: 0, y: 0}

