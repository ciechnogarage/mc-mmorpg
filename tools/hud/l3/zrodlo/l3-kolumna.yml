l3-pet-e0c0:
  conditions:
    - placeholder{ph=%luckperms_meta_ui_hud%;val=minimal} false hide
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%player_health%;v=0;o=>} true hide
    - placeholder{ph=%chowance_w_walce%;val=tak} false hide
    - placeholder{ph=%chowance_aktywny_istnieje%;val=tak} true hide
    - placeholder{ph=%chowance_aktywny_zemdlony%;val=tak} false hide
    - placeholder{ph=%hud_efekty_liczba%;v=1;o=>=} false hide
    - placeholder{ph=%hud_zadanie_widac%;val=tak} false hide
  layers:
    nazwa:
      text: '<#FFE7AE>%chowance_aktywny_nazwa% <#D5A96B>%chowance_aktywny_poziom% <#B39066>%hud_pet_typ%'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: -5}
    hp-tekst:
      text: '<#FFF1CC>%chowance_aktywny_hp%/%chowance_aktywny_hpmax%'
      font: default
      outlined: true
      align: right
      offset: {x: 98, y: -5}
    hp:
      texture: {path: assets/l1/pet_hp.png}
      scale: 0.5
      offset: {x: 1, y: -15}
      function: {listener: chowaniec_hp, increment: 120, orientation: horizontal}
    exp:
      texture: {path: assets/l1/pet_exp.png}
      scale: 0.5
      offset: {x: 1, y: -17}
      function: {listener: chowaniec_exp, increment: 120, orientation: horizontal}
    tlo:
      texture: {path: assets/l1/pet_tlo.png}
      scale: 0.5
      offset: {x: 0, y: -14}

