# HUD v3 (20.10): lewa kolumna pod oknem postaci - efekty, towarzysze (Chowaniec, slugi), druzyna.
# Warianty polozenia wg %hud_uklad% (HudDane): e = rzad efektow, t = wiersze towarzyszy.
l3-tow-tlo-e0c0t1:
  conditions:
    - placeholder{ph=%luckperms_meta_ui_hud%;val=minimal} false hide
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%player_health%;v=0;o=>} true hide
    - placeholder{ph=%chowance_w_walce%;val=tak} false hide
    - placeholder{ph=%hud_uklad%;val=e0c0t1} true hide
  layers:
    b:
      texture: {path: assets/l1/tow_21_b.png}
      scale: 0.5
      offset: {x: 128, y: 0}
    a:
      texture: {path: assets/l1/tow_21_a.png}
      scale: 0.5
      offset: {x: 0, y: 0}

