generate-default-files: true
generate-unicode-files: true
layout:
  default:
  - zaklecia-layout
  - l1-okno-layout
  - l1-pas-layout
  - cel-layout
  - hotbar-layout
  - chowance-layout
check-update: 5
placeholder-update: 5
decimal-format: '#'
nexo-hook: true
copy-pack:
  enabled: false
  path: Nexo/pack/external_packs/MythicHud.zip
boss-bar:
  max: 7
  hud-position: 4
  color: yellow
disable-geyser-players: true
disable-netty-injection: false
hide-exp: true
hide-vanilla-hud: false
# MythicHUD 1.3.4: selektywne ukrycie, hotbar i podswietlenie pozostaja.
elements:
  HEALTH: hidden
  HUNGER: hidden
  ARMOR: hidden
  AIR: hidden
  EXPERIENCE: hidden
  EXPERIENCE_LEVEL: hidden
updaters:
  ARMOR: true
  EXPERIENCE: true
  AIR: true
  CONSUMING: true
  RESPAWNING: true
pack-support: all
default-namespace: mythichud
config-version: 11
