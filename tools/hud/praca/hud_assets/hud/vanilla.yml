vanilla-health:
  # Kreator postaci trzyma gracza w SPECTATOR i ma wlasny pelnoekranowy UI.
  # Warunek `gamemode{gm=...}` tez sie parsuje, ale NIE jest przeliczany w trakcie gry —
  # sprawdzone na zywym kliencie. Placeholder dziala, bo MythicHUD odswieza je
  # cyklicznie (config.yml -> placeholder-update).
  conditions:
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} true hide
  layers:
    icon:
      texture:
        path: assets/vanilla/heart.png
      offset:
        x: -5
        y: 2
    fill:
      texture:
        path: assets/vanilla/exp_bar_short_fill.png
      color: "#f23a3a"
      offset:
        x: 0
        y: 0
      function:
        listener: health
        increment: 13
        orientation: horizontal
    outline:
      texture:
        path: assets/vanilla/exp_bar_short_outline.png
