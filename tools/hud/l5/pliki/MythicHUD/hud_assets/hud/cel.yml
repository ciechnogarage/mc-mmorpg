# Cel zadania v5 (20.10): w lewej kolumnie pod efektami; tekst z HudDane (przyciety), strzalka do celu kroku.
l5-zadanie-e0:
  conditions:
    - placeholder{ph=%luckperms_meta_ui_hud%;val=minimal} false hide
    - placeholder{ph=%player_gamemode%;val=SPECTATOR} false hide
    - placeholder{ph=%player_health%;v=0;o=>} true hide
    - placeholder{ph=%hud_zadanie_widac%;val=tak} true hide
    - placeholder{ph=%hud_efekty_liczba%;v=1;o=>=} false hide
  layers:
    tytul:
      text: '<#FFE7AE>%hud_zadanie_tytul% <#D5A96B>%hud_zadanie_postep%'
      font: default
      outlined: true
      align: right
      offset: {x: 18, y: -5}
    krok:
      text: '<#FFF1CC>%hud_zadanie_krok%'
      font: default
      outlined: true
      align: right
      offset: {x: 18, y: -17}
    ikona:
      texture: {path: assets/l1/cel_ikona.png}
      scale: 0.5
      offset: {x: 6, y: -4}
    strzalka:
      texture: {path: assets/l1/cel_strzalka.png}
      scale: 0.5
      offset: {x: 7, y: -16}
      conditions:
        - placeholder{ph=%hud_zadanie_kierunek%;val=brak} true hide
    tlo-b:
      texture: {path: assets/l1/cel_b.png}
      scale: 0.5
      offset: {x: 115, y: 0}
    tlo:
      texture: {path: assets/l1/cel_a.png}
      scale: 0.5
      offset: {x: 0, y: 0}

