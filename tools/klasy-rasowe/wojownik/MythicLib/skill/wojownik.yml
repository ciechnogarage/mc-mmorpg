    WOJ_Marsz_Krypty_Leczenie:
      Skills:
      - 'setvariable{var=caster.woj_marsz_ostatnie;type=DOUBLE;value="min(<modifier.damage> * 0.2,<caster.var.woj_marsz_limit> - <caster.var.woj_marsz_lecz>)";duration=40} @self'
      - 'heal{a="<caster.var.woj_marsz_ostatnie>"} @self'
      - 'variableadd{var=caster.woj_marsz_lecz;amount="<caster.var.woj_marsz_ostatnie>"} @self'
