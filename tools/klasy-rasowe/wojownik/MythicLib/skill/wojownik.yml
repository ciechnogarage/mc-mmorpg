# Wojownik, Akt 1. Modyfikatory MythicLib są odczytywane wyłącznie w extra-skills.
# wariant: 0 nieumarły, 1 ork, 2 elf, 3 człowiek.
WOJ_ROZPLATANIE:
  source: mythicmobs:WOJ_Rozplatanie
  name: 'Rozpłatanie'
  icon: {item: IRON_AXE}
  lore: ['&7Cięcie w łuku do 3 bl. za {damage} obrażeń.', '&7Ork: zasięg 4 bl.; człowiek: szerszy łuk;', '&7elf: odskok po cięciu.', '', '&e{cooldown}s odnowienia', '&9Koszt: 30 Szału']
  parameters:
    mana: {name: Koszt, player: 30}
    cooldown: {name: Odnowienie, player: 5}
    damage: {name: Obrażenia, player: {base: 5, per-level: 1.5}}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    WOJ_Rozplatanie:
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Standard} @self ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'skill{s=WOJ_Rozplatanie_Ork} @self ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'skill{s=WOJ_Rozplatanie_Elf} @self ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=WOJ_Rozplatanie_Czlowiek} @self ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
    WOJ_Rozplatanie_Standard:
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Cel} @EntitiesInCone{angle=100;range=3;ignore=self,players;targetvillagers=false}'
      - 'skill{s=WOJ_Rozplatanie_Gracz} @EntitiesInCone{angle=100;range=3;target=players}'
    WOJ_Rozplatanie_Ork:
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Cel} @EntitiesInCone{angle=100;range=4;ignore=self,players;targetvillagers=false}'
      - 'skill{s=WOJ_Rozplatanie_Gracz} @EntitiesInCone{angle=100;range=4;target=players}'
    WOJ_Rozplatanie_Elf:
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Standard} @self'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @Forward{f=-1.5}'
    WOJ_Rozplatanie_Czlowiek:
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Cel} @EntitiesInCone{angle=140;range=3;ignore=self,players;targetvillagers=false}'
      - 'skill{s=WOJ_Rozplatanie_Gracz} @EntitiesInCone{angle=140;range=3;target=players}'
    WOJ_Rozplatanie_Cel:
      # A6: bez petów/sług sojuszników (frakcje MM; gracze bez frakcji przechodzą)
      TargetConditions:
      - 'celWrogi{} true'
      Skills:
      - 'mmodamage{a="<modifier.damage>";types=SKILL,PHYSICAL}'
    WOJ_Rozplatanie_Gracz:
      TargetConditions:
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=WOJ_Rozplatanie_Cel} @TargetedTarget'

WOJ_OKRZYK:
  source: mythicmobs:WOJ_Okrzyk
  name: 'Okrzyk'
  icon: {item: GOAT_HORN}
  lore: ['&7Siła dla ciebie i drużyny w 8 blokach na 6 s.', '&7Człowiek: także Odporność I.', '&7Daje 20 Szału.', '', '&e{cooldown}s odnowienia']
  parameters:
    mana: {name: Koszt, player: 0}
    cooldown: {name: Odnowienie, player: 20}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    WOJ_Okrzyk:
      Skills:
      - 'skill{s=WOJ_Okrzyk_Buff} @self'
      - 'skill{s=WOJ_Okrzyk_Sojusznik} @PlayersInRadius{r=8;ignore=self;conditions=[  - druzyna{} true ]}'
      - 'command{c="mmocore admin resource-mana give <caster.name> 20"} @self'
    WOJ_Okrzyk_Buff:
      Skills:
      - 'potion{type=STRENGTH;duration=120;level=0;force=true;hasParticles=true}'
      - 'potion{type=RESISTANCE;duration=120;level=0;force=true;hasParticles=true} ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
    WOJ_Okrzyk_Sojusznik:
      TargetConditions:
      - 'druzyna{} true'
      Skills:
      - 'skill{s=WOJ_Okrzyk_Buff}'

WOJ_GNIEW:
  source: mythicmobs:WOJ_Gniew
  name: 'Gniew'
  icon: {item: NETHERITE_AXE}
  lore: ['&7Potężny cios w cel do 4 bl.', '&7Bazowo {damage} obrażeń, rosną z Szałem.', '&7Ork: +50% za Szał; nieumarły leczy 30%;', '&7elf przeskakuje cel; człowiek: osłona 4 HP/4 s.', '', '&e{cooldown}s odnowienia', '&9Koszt: cały Szał (min. 40)']
  parameters:
    mana: {name: Koszt, player: 40}
    cooldown: {name: Odnowienie, player: 10}
    damage: {name: Obrażenia, player: {base: 5, per-level: 1.5}}
    coefficient: {name: Współczynnik, player: 0.1}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    WOJ_Gniew:
      # A5: warunki celu w KORZENIU — bez celu do 4 bl. skill się nie rzuca i nie zabiera Szału
      # (docs MythicLib using-mythicmobs.md:92, przykład TargetConditions w korzeniu :183)
      TargetConditions:
      - 'distance{d=0to4} true'
      Skills:
      - 'skill{s=WOJ_Gniew_Cel} @target'
    WOJ_Gniew_Cel:
      TargetConditions:
      - 'distance{d=0to4} true'
      - 'celWrogi{} true'
      Skills:
      - 'setvariable{var=skill.woj_gniew_szal;type=DOUBLE;value="<mana>"} @self'
      - 'skill{s=WOJ_Gniew_Nieumarly} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'skill{s=WOJ_Gniew_Ork} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'skill{s=WOJ_Gniew_Elf} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=WOJ_Gniew_Czlowiek} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'command{c="mmocore admin resource-mana set <caster.name> 0"} @self'
    WOJ_Gniew_Zwykly:
      Skills:
      - 'mmodamage{a="<modifier.damage> + <modifier.coefficient> * <skill.var.woj_gniew_szal>";types=SKILL,PHYSICAL}'
    WOJ_Gniew_Elf:
      Skills:
      - 'skill{s=WOJ_Gniew_Zwykly} @TargetedTarget'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @TargetedTarget'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @Forward{f=1.5;lockpitch=true}'
    WOJ_Gniew_Czlowiek:
      Skills:
      - 'skill{s=WOJ_Gniew_Zwykly} @TargetedTarget'
      # A2: osłona 4 HP na 4 s (wcześniej bez wygaszenia)
      - 'shield{amount=4;maxabsorb=100} @self'
      - 'delay 80'
      - 'shield{amount=-4;maxabsorb=100} @self'
    WOJ_Gniew_Ork:
      Skills:
      - 'mmodamage{a="<modifier.damage> + <modifier.coefficient> * 1.5 * <skill.var.woj_gniew_szal>";types=SKILL,PHYSICAL}'
    WOJ_Gniew_Nieumarly:
      Skills:
      - 'mmodamage{a="<modifier.damage> + <modifier.coefficient> * <skill.var.woj_gniew_szal>";types=SKILL,PHYSICAL}'
      - 'heal{a="(<modifier.damage> + <modifier.coefficient> * <skill.var.woj_gniew_szal>) * 0.3"} @self'

