WOJ_NATARCIE_WODZA:
  source: mythicmobs:WOJ_Natarcie_Wodza
  name: 'Natarcie Wodza'
  icon: {item: IRON_AXE}
  lore: ['&8&oWódz rozsuwa mur tarcz.', '&7Doskok do 8 bl.; trafia do 3 wrogów', '&7w promieniu 3 bl. po {damage} obrażeń.', '&7Daje 15 Szału raz za natarcie.', '&6◆ Topór: promień cięcia 4 bl.', '', '&e{cooldown}s odnowienia']
  parameters:
    mana: {name: Koszt, player: 0}
    cooldown: {name: Odnowienie, player: 9}
    damage: {name: Obrażenia, player: {base: 5, per-level: 1.5}}
  extra-skills:
    WOJ_Natarcie_Wodza:
      Skills:
      - 'setvariable{var=caster.kr_premia;type=INTEGER;value=0;duration=100} @self'
      - 'setvariable{var=caster.kr_premia;type=INTEGER;value=1;duration=100} @self ?bronRasowa{typ=AXE}'
      - 'setvariable{var=caster.kr_premia;type=INTEGER;value=1;duration=100} @self ?bronRasowa{typ=GREATAXE}'
      - 'skill{s=WOJ_Natarcie_Wodza_Mob} @target'
      - 'skill{s=WOJ_Natarcie_Wodza_Gracz} @target'
    WOJ_Natarcie_Wodza_Mob:
      TargetConditions:
      - 'distance{d=0to8} true'
      - 'isPlayer false'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Cel} @TargetedTarget'
    WOJ_Natarcie_Wodza_Gracz:
      TargetConditions:
      - 'distance{d=0to8} true'
      - 'isPlayer true'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Cel} @TargetedTarget'
    WOJ_Natarcie_Wodza_Cel:
      Skills:
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @TargetedTarget'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @Forward{f=-1.2}'
      - 'setvariable{var=caster.woj_natarcie_licznik;type=INTEGER;value=1;duration=40} @self'
      - 'mmodamage{a="<modifier.damage>";types=SKILL,PHYSICAL}'
      # A1: rozprysk liczony wokół celu (origin = cel, sort NEAREST wg originu, skipTargetsUpToIndex=1 pomija sam cel —
      # docs MM skills-targeters.md:355-356). Stare wykluczenie stringEquals <target.uuid> w TargetConditions + @LivingNearTargetLocation
      # nie trafiało nikogo poza celem (test 25.10, klon klasy-skille: drugi worek 1 bl. obok = 0 obrażeń).
      # limit=2 (po pominięciu celu): licznik variableadd na caster nie ograniczał (test: 3 dodatkowe trafienia).
      - 'skill{s=WOJ_Natarcie_Wodza_Zwykly;origin=@TargetedTarget} @self ?variableEquals{var=caster.kr_premia;value=0}'
      - 'skill{s=WOJ_Natarcie_Wodza_Topor;origin=@TargetedTarget} @self ?variableEquals{var=caster.kr_premia;value=1}'
      - 'command{c="mmocore admin resource-mana give <caster.name> 15"} @self'
      - 'effect:particles{p=sweep_attack;a=20;hS=1;vS=0.3} @self'
    WOJ_Natarcie_Wodza_Zwykly:
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Adresuj} @EntitiesNearOrigin{r=3;ignore=self,samefaction,owner;targetarmorstands=false;targetvillagers=false;sort=NEAREST;skipTargetsUpToIndex=1;limit=2}'
    WOJ_Natarcie_Wodza_Topor:
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Adresuj} @EntitiesNearOrigin{r=4;ignore=self,samefaction,owner;targetarmorstands=false;targetvillagers=false;sort=NEAREST;skipTargetsUpToIndex=1;limit=2}'
    WOJ_Natarcie_Wodza_Adresuj:
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Uderz_Mob} @TargetedTarget'
      - 'skill{s=WOJ_Natarcie_Wodza_Uderz_Gracz} @TargetedTarget'
    WOJ_Natarcie_Wodza_Uderz_Mob:
      TargetConditions:
      - 'isPlayer false'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Uderz} @TargetedTarget'
    WOJ_Natarcie_Wodza_Uderz_Gracz:
      TargetConditions:
      - 'isPlayer true'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=WOJ_Natarcie_Wodza_Uderz} @TargetedTarget'
    WOJ_Natarcie_Wodza_Uderz:
      Conditions:
      - 'variableInRange{var=caster.woj_natarcie_licznik;value=<3} true'
      Skills:
      - 'variableadd{var=caster.woj_natarcie_licznik;amount=1} @self'
      - 'mmodamage{a="<modifier.damage>";types=SKILL,PHYSICAL}'

