    WOJ_Marsz_Krypty_Uderz_Mob:
      TargetConditions:
      - 'isPlayer false'
      Skills:
      - 'skill{s=WOJ_Marsz_Krypty_Uderz} @TargetedTarget'
    WOJ_Marsz_Krypty_Uderz_Gracz:
      TargetConditions:
      - 'isPlayer true'
      - 'mmoCanTarget{interaction=OFFENSE_SKILL} true'
      Skills:
      - 'skill{s=WOJ_Marsz_Krypty_Uderz} @TargetedTarget'
    WOJ_Marsz_Krypty_Uderz:
      Conditions:
      - 'variableInRange{var=caster.woj_marsz_licznik;value=<3} true'
      Skills:
      - 'mmodamage{a="<modifier.damage>";types=SKILL,PHYSICAL}'
      - 'variableadd{var=caster.woj_marsz_licznik;amount=1} @self'
      - 'skill{s=WOJ_Marsz_Krypty_Leczenie} @TargetedTarget'
    WOJ_Marsz_Krypty_Leczenie:
      Skills:
      - 'setvariable{var=caster.woj_marsz_ostatnie;type=DOUBLE;value="min(<modifier.damage> * 0.2,<caster.var.woj_marsz_limit> - <caster.var.woj_marsz_lecz>)";duration=40} @self'
      - 'heal{a="<caster.var.woj_marsz_ostatnie>"} @self'
      - 'variableadd{var=caster.woj_marsz_lecz;amount="<caster.var.woj_marsz_ostatnie>"} @self'
