# HISTORIA (zostaje, żeby nikt nie wrócił tą drogą): poprzednia wersja miała sekcję 'skin'
# odsyłającą do klasy SkinProvider, której NIGDY nie było w źródłach — cała "abstrakcja"
# sprowadzała się do `cmi skin <gracz> <gracz> -s`, czyli nakładania graczowi jego WŁASNEJ
# skórki przy każdym wyborze profilu. Dzisiejsze skórki nie pytają Mojanga o nic: gotowe,
# podpisane tekstury leżą w skins.yml i idą prosto do profilu gracza.
# SKÓRKI POSTACI
#
# Skórka jest JEDNĄ teksturą na parę RASA x KLASA — protokół nie ma drugiej warstwy, którą
# serwer mógłby podmienić osobno, więc "podskin klasy" jest wypalony w tę samą teksturę:
# rasa trzyma głowę i karnację, klasa tors, ręce, nogi i warstwę zewnętrzną (kaptur, maska,
# naramienniki, tabard). Same tekstury leżą w skins.yml (obok tego pliku) i są czytane
# Z DYSKU — poprawka skórki to podmiana tamtego pliku i '/cc reload', bez przebudowy jara.
#
# Skąd biorą się pliki: tools/gen_race_skins.py generuje 16 PNG, tools/upload_skins.sh wgrywa
# je na mineskin.org (wprost przez jego API) i zapisuje stamtąd podpisane tekstury do
# skins.yml. Własny hosting PNG odpada: klient Javy pobiera skórki wyłącznie
# z textures.minecraft.net, także przy online-mode=false.
skins:
  # false = kreator nadal pokazuje skórkę rasy i klasy na podglądzie, ale gracz zostaje
  # w skórce swojego konta. To JEDYNA rzecz w tym pluginie, która zmienia profil gracza —
  # wyłącznik jest po to, żeby przy sporze z innym pluginem od skórek (CMI, SkinsRestorer)
  # dało się to rozdzielić bez przebudowy jara.
  apply-to-player: true

  # SKORKA JUZ PRZY WEJSCIU, a nie dopiero przy wyborze postaci.
  #
  # Bez tego gracz od wejscia do kliknięcia postaci chodzi w skorce swojego KONTA —
  # kilkanascie sekund, w ktorych patrzy na ekran wyboru i widzi za nim siebie. Z tym
  # wlacznikiem plugin naklada mu skorke postaci granej OSTATNIO (pole 'last-used'
  # w characters.yml), a po wyborze i tak poprawia ja na skorke wybranej postaci.
  # Najgorszy mozliwy skutek pomylki: skorka poprzedniej postaci przez chwile.
  #
  # Nakladamy dwa razy (10 i 40 tickow po wejsciu), bo plugin od skorek moze nalozyc swoja
  # PO nas — CMI robilo to ~1 s po wejsciu. Nalozenie jest idempotentne, wiec drugie
  # podejscie przy niezmienionej skorce nie kosztuje nic.
  #
  # false = zachowanie sprzed 2026-09-20: skorka wchodzi dopiero przy wyborze postaci.
  apply-on-join: true

  # Głowy na ekranie wyboru postaci (MMOProfiles) — bez tego każda postać ma tam głowę
  # Steve'a, bo MMOProfiles rysuje PLAYER_HEAD bez tekstury i nie ma placeholdera, którym
  # dałoby się to ustawić z jego configu. Dopisujemy je już po zbudowaniu okna, czyli
  # wchodzimy w CUDZE okno — dlatego osobny wyłącznik. Mapowanie slot -> postać bierzemy
  # z jego własnego pliku language/gui/profile-list.yml; przy stronicowaniu (więcej postaci
  # niż slotów) nie ruszamy niczego, żeby nie wstawić komuś cudzej głowy.
  profile-heads: true

