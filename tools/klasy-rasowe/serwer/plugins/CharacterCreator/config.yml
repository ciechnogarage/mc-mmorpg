    # 2026-09-30 wieczor: WYLACZONE na prosbe wlasciciela ("wyjeb to ze leci"); trasa i tak celowala
    # w stary start 149/197 w 'world', a spawn przenosi sie do Stolicy (osobna sesja).
    enabled: false
    world: 'world'
    # pora dnia na czas lotu (tylko dla gracza); -1 = czas swiata
    time: 1000
    # ile tickow ekran zostaje czarny po przeniesieniu do swiata gry (wczytanie terenu)
    hold-ticks: 40
    look: { x: 149.5, y: 99.0, z: 197.5 }
    title: '&6&l{imie}'
    subtitle: '&7Twoja droga zaczyna się tutaj'
    path:
      - { x: 222.5, y: 96.0, z: 160.5 }
      - { x: 196.5, y: 104.0, z: 178.5, ticks: 55 }
      - { x: 176.5, y: 108.0, z: 194.5, ticks: 50 }
      - { x: 163.5, y: 104.0, z: 203.5, ticks: 45 }

# ---------------------------------------------------------------------------------------------
# WYBOR POSTACI (scena wyboru, lista pod PPM i w menu Q, zarzadzanie) — 2026-09-30; kosz usuniety 2026-10-01
# ---------------------------------------------------------------------------------------------
wybor-postaci:
  # Od ilu aktywnych postaci lista (kafelki, klik = graj) otwiera sie sama po wejsciu do sceny.
  # 0 = nigdy (lista zawsze pod PPM).
  lista-od: 0
  # Od ktorego poziomu usuniecie (zawsze ostateczne) wymaga wpisania imienia postaci.
  imie-od-poziomu: 10
  # Napis "Miejsce" na karcie. Najpierw region WorldGuard z greeting-title, potem nazwa mapy
  # MythicDungeons (swiat <mapa>_<n>), na koncu te wpisy: nazwa swiata (regex) -> napis.
  miejsca:
    - { swiat: 'world', nazwa: 'Kraina' }
  # Pliki postaci, ktore inne pluginy zostawiaja po trwalym usunieciu ({id} = UUID profilu).
  # Przenoszone (nie kasowane) do CharacterCreator/usuniete/<id>/ — cofniecie = przeniesc z powrotem.
  po-usunieciu:
    - 'CoreTools/userdata/{id}.yml'
    - 'MMOCore/userdata/{id}.yml'
    - 'MMOItems/userdata/{id}.yml'
    - 'MMOInventory/userdata/{id}.yml'

