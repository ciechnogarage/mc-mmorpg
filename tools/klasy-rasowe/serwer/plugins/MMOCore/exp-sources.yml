# Tabele zrodel EXP KLASY (MMOCore). Odwolanie w pliku klasy: main-exp-sources: ['from{source=klasa-swiat}']
# Dokumentacja: docs/Plugins-wiki-local/mmocore/wiki/md/level-sources.md:34 (tabele), :49 (from), :52 (killmythicmob).
# klasa-swiat: moby Bestiariusza (MythicMobs/mobs/Bestiariusz.yml). EXP = 0,4 x HP moba, rozrzut +-15%.
# Rachunek (tools/klasy-rasowe/serwer/README.md): Akt 1 = 9000 EXP do poz. 10; lochy 001-010 (pierwsze przejscie,
# 0,6 x 200 x N) daja 6600, swiat ma dac reszte ~2400 i nie byc szybszy od lochu (~40 EXP/min).
# Nowy mob Bestiariusza = nowy wiersz (bez wiersza mob nie daje EXP klasy). Generator klas tego pliku nie pisze.
