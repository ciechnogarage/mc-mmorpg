id: 'combat'
name: '&4Walka'
type: PROXIMITY
lore:
  - '&6Umiejętności bojowe'
max-point-spent: 20

icon:
  material: IRON_AXE
  item_flags: [HIDE_ATTRIBUTES]
  #custom_model_data: 10
  #custom_model_data_string: 'off_hand'
  #item_model: 'minecraft:dirt'
  #tooltip_style: 'myplugin:tooltip_style_1'

nodes:
  a1:
    name: 'Skrócenie odnowienia I'
    coordinates: -3,-2
    root: true
    experience-table:
      first_table_item:
        triggers:
          - 'stat{stat="COOLDOWN_REDUCTION";amount=5;type="FLAT"}'
    lores:
      0:
        - "&7Skrócenie odnowienia: &a+5%"
      1:
        - "&7Skrócenie odnowienia: &a+5%"

  a2:
    name: 'Skrócenie odnowienia II'
    coordinates: -2,-2
