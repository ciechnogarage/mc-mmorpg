# Mag, Akt 1. Wariant: 0 nieumarły, 1 ork, 2 elf, 3 człowiek.
# Modyfikatory MythicLib są odczytywane wyłącznie w extra-skills.
MAG_POCISK:
  source: mythicmobs:MAG_Pocisk
  name: 'Pocisk Many'
  icon: {item: AMETHYST_SHARD}
  lore: ['&7Magiczny pocisk do 20 bloków.', '&7Żywioł zależy od rasy.', '', '&e{cooldown}s odnowienia', '&9Koszt: {mana} {mana_name}']
  parameters:
    mana: {name: Koszt, player: 4}
    cooldown: {name: Odnowienie, player: 1}
    damage: {name: Obrażenia, player: {base: 6, per-level: 1}}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    MAG_Pocisk:
      TargetConditions:
      - 'distance{d=0to20} true'
      Skills:
      - 'skill{s=MAG_Pocisk_Rzuc_Mob} @target'
      - 'skill{s=MAG_Pocisk_Rzuc_Gracz} @target'
      - 'effect:sound{s=entity.evoker.cast_spell;v=0.6;p=1.5} @self'
    MAG_Pocisk_Rzuc_Mob:
      TargetConditions:
      - 'isPlayer false'
      Skills:
      - 'skill{s=MAG_Pocisk_Pocisk} @TargetedTarget'
    MAG_Pocisk_Rzuc_Gracz:
      TargetConditions:
      - 'isPlayer true'
      - 'mmoCanTarget{interaction=OFFENSE_SKILL} true'
      Skills:
      - 'skill{s=MAG_Pocisk_Pocisk} @TargetedTarget'
    MAG_Pocisk_Pocisk:
      Skills:
      - 'projectile{bulletType=ITEM;material=AMETHYST_SHARD;onTick=MAG_Pocisk_Slad;onHit=MAG_Pocisk_Trafienie;v=24;i=1;mr=20;hR=0.5;vR=0.5;hitNonPlayers=true;hitPlayers=true;hitTargetOnly=true;stopAtBlock=true;stopAtEntity=true} @TargetedTarget'
    MAG_Pocisk_Slad:
      Skills:
      - 'effect:particles{p=witch;a=3;hS=0.08;vS=0.08} @origin'
    MAG_Pocisk_Trafienie:
      Skills:
      - 'skill{s=MAG_Pocisk_Trafienie_Mob} @TargetedTarget'
      - 'skill{s=MAG_Pocisk_Trafienie_Gracz} @TargetedTarget'
    MAG_Pocisk_Trafienie_Mob:
      TargetConditions:
      - 'isPlayer false'
      Skills:
      - 'skill{s=MAG_Pocisk_Trafienie_Efekt} @TargetedTarget'
    MAG_Pocisk_Trafienie_Gracz:
      TargetConditions:
      - 'isPlayer true'
      - 'mmoCanTarget{interaction=OFFENSE_SKILL} true'
      Skills:
      - 'skill{s=MAG_Pocisk_Trafienie_Efekt} @TargetedTarget'
    MAG_Pocisk_Trafienie_Efekt:
      Skills:
      - 'mmodamage{a="<modifier.damage>";types=SKILL,MAGIC}'
      - 'potion{type=WITHER;duration=60;level=0;force=true;hasParticles=true} ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'effect:lightning ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'throw{velocity=1.5;velocityY=0.25} ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'potion{type=SLOWNESS;duration=40;level=0;force=true;hasParticles=true} ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'ignite{ticks=60} ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'

