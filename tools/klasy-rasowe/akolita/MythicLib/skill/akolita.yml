# Umiejętności akolity na Duszach (etap 2, 30.09; AKO_WEZWANIE usunięte 25.10 — nic go nie wiązało). Wariant rasy
# w parametrze 'wariant' (0 nieumarły, 1 ork, 2 elf, 3 człowiek) — plik klasy nadpisuje go per rasa.
AKO_ZNIWO:
  source: mythicmobs:AKO_Zniwo
  name: 'Żniwo'
  icon: {item: WITHER_ROSE}
  lore: ['&7Poświęca do 4 sług; każdy ofensywny rani', '&7do 2 wrogów za 5-7, obrońca leczy i osłania.', '', '&e{cooldown}s odnowienia']
  parameters:
    mana: {name: Koszt, player: 0}
    cooldown: {name: Odnowienie, player: 8}

AKO_STRAZ_RELIKWII:
  source: mythicmobs:AKO_Straz_Relikwii
  name: 'Straż Relikwii'
  icon: {item: SHIELD}
  lore: ['&8&oPrzy relikwii stoi wierna warta.', '&7Stawia obrońcę przy sojuszniku do 10 bl.', '&7lub przy sobie; prowokuje i pilnuje.', '&7Jeden obrońca na 15 s, 40 HP.', '&6◆ Tarcza: prowokacja do 8 bl.', '', '&e{cooldown}s odnowienia', '&9Koszt: {mana} {mana_name}']
  parameters:
    mana: {name: Koszt, player: 2}
    cooldown: {name: Odnowienie, player: 10}
  extra-skills:
    AKO_Straz_Relikwii:
      Conditions:
      - 'children{a=<3} true'
      Skills:
      - 'signal{s=ZASTAP} @Children'
      - 'setvariable{var=caster.kr_premia;type=INTEGER;value=0;duration=100} @self'
      - 'setvariable{var=caster.kr_premia;type=INTEGER;value=1;duration=100} @self ?bronRasowa{typ=SHIELD}'
      - 'setvariable{var=caster.ako_straz_sojusznik;type=INTEGER;value=0;duration=2} @self'
      - 'skill{s=AKO_Straz_Relikwii_Sojusznik} @PlayersInRadius{r=10;ignore=self;sort=NEAREST;limit=1;conditions=[  - mmoCanTarget{interaction=SUPPORT_SKILL} true ]}'
      - 'skill{s=AKO_Straz_Relikwii_Siebie} @self ?variableEquals{var=caster.ako_straz_sojusznik;value=0}'
      - 'effect:sound{s=block.beacon.activate;v=0.8;p=1.2} @self'
    AKO_Straz_Relikwii_Sojusznik:
      TargetConditions:
      - 'mmoCanTarget{interaction=SUPPORT_SKILL} true'
      Skills:
      - 'setvariable{var=caster.ako_straz_sojusznik;type=INTEGER;value=1;duration=2} @self'
      - 'setvariable{var=skill.ako_pilnowany;type=STRING;value="<target.uuid>"} @TargetedTarget'
      - 'summon{type=AKO_SLUGA_OBRONCA;amount=1;radius=0;onSurface=true;onSummon=AKO_Straz_Przekaz} @TargetedTarget'
      - 'effect:particles{p=totem_of_undying;a=25;hS=0.6;vS=1} @TargetedTarget'
    AKO_Straz_Przekaz:
      Skills:
      - 'setvariable{var=target.ako_pilnowany;type=STRING;value="<skill.var.ako_pilnowany>";duration=320}'
      - 'setvariable{var=target.ako_bron_bonus;type=INTEGER;value="<caster.var.kr_premia>";duration=320}'
    AKO_Straz_Relikwii_Siebie:
      Skills:
      - 'setvariable{var=skill.ako_pilnowany;type=STRING;value="<caster.uuid>"} @self'
      - 'summon{type=AKO_SLUGA_OBRONCA;amount=1;radius=0;onSurface=true;onSummon=AKO_Straz_Przekaz} @self'
      - 'effect:particles{p=totem_of_undying;a=25;hS=0.6;vS=1} @self'

AKO_OPIEKA:
  source: mythicmobs:AKO_Opieka
  name: 'Opieka'
  icon: {item: GOLDEN_APPLE}
  lore: ['&7Leczy siebie lub wskazanego sojusznika.', '&7Elf: leczenie w czasie; ork: także sługa.', '&7Nieumarły płaci 2 HP, człowiek daje', '&7osłonę 4 HP na 6 s.', '', '&e{cooldown}s odnowienia', '&9Koszt: {mana} {mana_name}']
  parameters:
    mana: {name: Koszt, player: 1}
    cooldown: {name: Odnowienie, player: 6}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    AKO_Opieka:
      Skills:
      - 'skill{s=AKO_Opieka_Nieumarly} @self ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'skill{s=AKO_Opieka_Rzuc} @self ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'skill{s=AKO_Opieka_Rzuc} @self ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=AKO_Opieka_Rzuc} @self ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
    AKO_Opieka_Nieumarly:
      Conditions:
      - 'health{h=>2} true'
      Skills:
      - 'sethealth{a="<caster.hp> - 2"} @self'
      - 'skill{s=AKO_Opieka_Rzuc} @self'
    AKO_Opieka_Rzuc:
      Skills:
      - 'setvariable{var=caster.ako_opieka_sojusznik;type=INTEGER;value=0;duration=2} @self'
      - 'skill{s=AKO_Opieka_Sojusznik} @target'
      # Leczenie siebie: ?!variableEquals ...=1 (stare ?variableEquals ...=0 nigdy nie przechodziło — test 25.10 klon klasy-skille:
      # koszt pobrany, AKO_Opieka_Efekt nie startował, osłona/leczenie siebie nie działały u żadnej rasy)
      - 'skill{s=AKO_Opieka_Efekt} @self ?!variableEquals{var=caster.ako_opieka_sojusznik;value=1}'
      - 'skill{s=AKO_Opieka_Sluga} @Children{sort=NEAREST;limit=1} ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'effect:sound{s=block.amethyst_block.chime;v=0.7;p=1.3} @self'
    AKO_Opieka_Sojusznik:
      TargetConditions:
      - 'distance{d=0to10} true'
      - 'isPlayer true'
      - 'mmoCanTarget{interaction=SUPPORT_SKILL} true'
      Skills:
      - 'setvariable{var=caster.ako_opieka_sojusznik;type=INTEGER;value=1;duration=2} @self'
      - 'skill{s=AKO_Opieka_Efekt} @TargetedTarget'
    AKO_Opieka_Efekt:
      # Elf/Osłona bez targetera = dziedziczą cel Efektu (siebie lub sojusznika); @TargetedTarget przy wywołaniu @self nie trafiał nikogo
      Skills:
      - 'heal{a=6} ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'heal{a=6} ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'heal{a=6} ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'skill{s=AKO_Opieka_Elf} ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=AKO_Opieka_Oslona} ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'effect:particles{p=heart;a=12;hS=0.4;vS=0.5}'
    # A2: osłona wygasa po 6 s (MM shield nie ma czasu trwania, docs skills-mechanics-shield.md: tylko amount/maxabsorb)
    AKO_Opieka_Oslona:
      Skills:
      - 'shield{amount=4;maxabsorb=100}'
      - 'delay 120'
      - 'shield{amount=-4;maxabsorb=100}'
    AKO_Opieka_Elf:
      Skills:
      - 'heal{a=2}'
      - 'delay 20'
      - 'heal{a=2}'
      - 'delay 20'
      - 'heal{a=2}'
    AKO_Opieka_Sluga:
      Skills:
      - 'heal{a=4}'

AKO_ROZKAZ:
  source: mythicmobs:AKO_Rozkaz
  name: 'Rozkaz'
  icon: {item: GOAT_HORN}
  lore: ['&7Słudzy atakują wskazany cel.', '&7Bez celu wracają do właściciela.', '', '&e{cooldown}s odnowienia']
  parameters:
    mana: {name: Koszt, player: 0}
    cooldown: {name: Odnowienie, player: 3}
  extra-skills:
    AKO_Rozkaz:
      Skills:
      - 'setvariable{var=caster.ako_rozkaz_cel;type=INTEGER;value=0;duration=2} @self'
      # Cel = istota pod celownikiem (@Target gracza, docs skills-targeters-target.md). Zapas: linia POZIOMA
      # (lockpitch) — sama linia stopy->@Forward{f=20} przy wzroku w dół szła w ziemię i mijała moba
      # 3 bl. przed graczem (bot klon klasy-naprawa 25.10: celownik na zającu 0 obrażeń, wzrok poziomo 12->8 HP).
      - 'skill{s=AKO_Rozkaz_Cel_Mob} @Target'
      - 'skill{s=AKO_Rozkaz_Cel_Gracz} @Target ?variableEquals{var=caster.ako_rozkaz_cel;value=0}'
      - 'skill{s=AKO_Rozkaz_Wskaz} @Forward{f=20;lockpitch=true} ?variableEquals{var=caster.ako_rozkaz_cel;value=0}'
      - 'signal{s=POWROT} @Children ?variableEquals{var=caster.ako_rozkaz_cel;value=0}'
      - 'effect:sound{s=block.note_block.hat;v=0.8;p=1} @self'
    AKO_Rozkaz_Wskaz:
      Skills:
      - 'skill{s=AKO_Rozkaz_Cel_Mob} @EntitiesInLine{r=0.75;ignore=self,armorstands,samefaction,owner;targetinvulnerable=false;sort=NEAREST;limit=1;targetvillagers=false}'
      - 'skill{s=AKO_Rozkaz_Cel_Gracz} @EntitiesInLine{r=0.75;ignore=self,armorstands,samefaction,owner;targetinvulnerable=false;sort=NEAREST;limit=1;targetvillagers=false}'
    AKO_Rozkaz_Cel_Mob:
      TargetConditions:
      - 'isPlayer false'
      - 'faction{faction=chowance} false'
      - 'faction{faction=akolita_slugi} false'
      - 'faction{faction=zaklecia_przywolane} false'
      Skills:
      - 'skill{s=AKO_Rozkaz_Cel} @TargetedTarget'
    AKO_Rozkaz_Cel_Gracz:
      TargetConditions:
      - 'isPlayer true'
      - 'mmoCanTarget{interaction=OFFENSE_SKILL} true'
      Skills:
      - 'skill{s=AKO_Rozkaz_Cel} @TargetedTarget'
    AKO_Rozkaz_Cel:
      Skills:
      - 'setvariable{var=caster.ako_rozkaz_cel;type=INTEGER;value=1;duration=2} @self'
      - 'setvariable{var=caster.ako_rozkaz_uuid;type=STRING;value="<target.uuid>";duration=2} @TargetedTarget'
      - 'skill{s=AKO_Rozkaz_Przekaz} @Children'
      - 'signal{s=ATAK} @Children'
    AKO_Rozkaz_Przekaz:
      TargetConditions:
      - 'mythicMobType{type=AKO_OGNIK_KSIEZYCA} false'
      Skills:
      - 'setvariable{var=target.ako_cel_uuid;type=STRING;value="<caster.var.ako_rozkaz_uuid>"}'

