# ETAP 2 przebudowy klas (prototyp 2026-09-30): słudzy akolity, po jednym na rasę. AI jak ciała Chowańców:
# idą za właścicielem (summon ustawia właściciela), biją to, co bije właściciela i jego cel. Wygląd zastępczy vanilli.
# 2026-10-25 (audyt A3/A9/A11): cios sługi w moba jest anulowany i zadawany przez WŁAŚCICIELA (AKO_Sluga_Cios ->
# mmodamage gracza), więc zabójstwo, EXP i łup należą do gracza, a obrażenia skalują się ze skill_damage (Wiara).
# Słudzy Wezwania mają czas życia (AKO_Sluga_Czas) i wyrównane HP x obrażenia; rozkaz odświeżany co 20 tików.
AKO_SLUGA_NIEUMARLY:
  Type: SKELETON
  Display: '&7Sługa Kurhanu'
  Health: 22
  Damage: 4
  Faction: akolita_slugi
  Options: {MovementSpeed: 0.3, PreventOtherDrops: true, PreventItemPickup: true, PreventSunburn: true, Despawn: true, FollowRange: 24}
  Equipment: ['AIR HAND']
  AIGoalSelectors: ['0 clear', '1 float', '2 meleeattack', '3 gotoowner', '4 lookatplayers']
  AITargetSelectors: ['0 clear', '1 ownerattacker', '2 ownertarget']
  Skills:
  - 'skill{s=AKO_Sluga_Zniwo} ~onSignal:ZNIWO'
  - 'skill{s=AKO_Sluga_Atak} ~onSignal:ATAK'
  - 'skill{s=AKO_Sluga_Utrzymaj_Rozkaz} @self ~onTimer:20 ?variableIsSet{var=caster.ako_cel_uuid}'
  - 'skill{s=AKO_Sluga_Powrot} ~onSignal:POWROT'
  - 'setvariable{var=caster.ako_dmg;type=DOUBLE;value=4} @self ~onSpawn'
  - 'skill{s=AKO_Sluga_Cios;sync=true} @trigger ~onAttack ?~!isplayer'
  - 'skill{s=AKO_Sluga_Czas} @self ~onSpawn'
