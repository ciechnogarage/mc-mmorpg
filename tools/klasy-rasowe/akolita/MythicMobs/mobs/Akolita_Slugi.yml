# ETAP 2 przebudowy klas (prototyp 2026-09-30): słudzy akolity, po jednym na rasę. AI jak ciała Chowańców:
# idą za właścicielem (summon ustawia właściciela), biją to, co bije właściciela i jego cel. Wygląd zastępczy vanilli.
AKO_SLUGA_NIEUMARLY:
  Type: SKELETON
  Display: '&7Sługa Kurhanu'
  Health: 14
  Damage: 3
  Faction: akolita_slugi
  Options: {MovementSpeed: 0.3, PreventOtherDrops: true, PreventItemPickup: true, PreventSunburn: true, Despawn: true, FollowRange: 24}
  Equipment: ['AIR HAND']
  AIGoalSelectors: ['0 clear', '1 float', '2 meleeattack', '3 gotoowner', '4 lookatplayers']
  AITargetSelectors: ['0 clear', '1 ownerattacker', '2 ownertarget']
  Skills:
  - 'skill{s=AKO_Sluga_Zniwo} ~onSignal:ZNIWO'
  - 'skill{s=AKO_Sluga_Atak} ~onSignal:ATAK'
  - 'skill{s=AKO_Sluga_Utrzymaj_Rozkaz} @self ~onTimer:10 ?variableIsSet{var=caster.ako_cel_uuid}'
  - 'skill{s=AKO_Sluga_Powrot} ~onSignal:POWROT'
