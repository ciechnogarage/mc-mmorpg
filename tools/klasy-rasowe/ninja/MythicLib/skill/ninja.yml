# Ninja, Akt 1. wariant: 0 nieumarły, 1 ork, 2 elf, 3 człowiek.
# Znamiona są zmienną MythicMobs na trafionym celu (target.znamiona), od 0 do 5.
# Modyfikatory MythicLib są odczytywane wyłącznie w extra-skills.
NIN_CIECIE:
  source: mythicmobs:NIN_Ciecie
  name: 'Cięcie'
  icon: {item: IRON_SWORD}
  lore: ['&7Szybki cios do 3 bl. za {damage} obrażeń.', '&7Dodaje 1 Znamię (maks. 5, gasną po 10 s).', '&7Człowiek: zatruwa cel na 3 s.', '', '&e{cooldown}s odnowienia', '&9Koszt: 20 Skupienia']
  parameters:
    mana: {name: Koszt, player: 20}
    cooldown: {name: Odnowienie, player: 1.5}
    damage: {name: Obrażenia, player: {base: 3, per-level: 0.8}}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    NIN_Ciecie:
      TargetConditions:
      - 'distance{d=0to3} true'
      - 'celWrogi{} true'
      Skills:
      - 'mmodamage{a="<modifier.damage>";types=SKILL,PHYSICAL} @target'
      - 'skill{s=NIN_Znamie_Dodaj} @target'
      - 'potion{type=POISON;duration=60;level=0;force=true;hasParticles=true} @target ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'effect:sound{s=entity.player.attack.sweep;v=0.7;p=1.4} @self'
    NIN_Znamie_Init:
      TargetConditions:
      - 'variableIsSet{var=target.znamiona} false'
      Skills:
      - 'setvariable{var=target.znamiona;type=INTEGER;value=0}'
    NIN_Znamie_Dodaj:
      Skills:
      - 'skill{s=NIN_Znamie_Init}'
      - 'variableadd{var=target.znamiona;amount=1}'
      - 'skill{s=NIN_Znamie_Ogranicz}'
      # A10: Znamiona wygasają 10 s po ostatnim trafieniu (setvariable duration, docs skills-mechanics-setvariable.md);
      # licznik na pasku akcji zamiast czatu (docs skills-mechanics-sendactionmessage.md)
      - 'setvariable{var=skill.nin_znamiona;type=INTEGER;value="<target.var.znamiona>"}'
      - 'setvariable{var=target.znamiona;type=INTEGER;value="<skill.var.nin_znamiona>";duration=200}'
      - 'actionmessage{m="&7Znamiona: &f<skill.var.nin_znamiona>&7/5"} @self'
      - 'effect:particles{p=crit;a=12;hS=0.25;vS=0.3} @target'
    NIN_Znamie_Ogranicz:
      TargetConditions:
      - 'variableInRange{var=target.znamiona;value=>5} true'
      Skills:
      - 'setvariable{var=target.znamiona;type=INTEGER;value=5}'

NIN_KROK:
  source: mythicmobs:NIN_Krok
  name: 'Krok w Cień'
  icon: {item: ENDER_PEARL}
  lore: ['&7Za cel do 10 bloków; szybkość na 2 s.', '&7Nieumarły przyciąga cel zamiast skoku.', '&7Ork odpycha cel, elf znika na 2 s.', '', '&e{cooldown}s odnowienia', '&9Koszt: 30 Skupienia']
  parameters:
    mana: {name: Koszt, player: 30}
    cooldown: {name: Odnowienie, player: 8}
    wariant: {name: Wariant, player: 0}
  extra-skills:
    NIN_Krok:
      TargetConditions:
      - 'distance{d=0to10} true'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=NIN_Krok_Nieumarly} @target ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'skill{s=NIN_Krok_Ork} @target ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'skill{s=NIN_Krok_Elf} @target ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=NIN_Krok_Teleport} @target ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'potion{type=SPEED;duration=40;level=0;force=true;hasParticles=true} @self'
      - 'effect:sound{s=entity.enderman.teleport;v=0.6;p=1.5} @self'
    NIN_Krok_Teleport:
      # 1. krok unsafe=true: tryb bezpieczny nie laduje "w" celu (docs skills-mechanics-teleport.md: unsafe = teleport into the target entity)
      #    i losowal miejsce w spreadv=1 (nad celem / obok) -> Forward 1,5 liczony od zlej pozycji, throw orka w bok;
      #    test 26.10 klon klasy-p1p2 (p1p2.js pochylenie 4): przed 2/8 rzutow za cel i odrzut do tylu +-20 st.
      # 2. krok zostaje bezpieczny (unsafe=false): ladowanie za celem nie wejdzie w blok
      Skills:
      - 'teleport{unsafe=true} @TargetedTarget'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @Forward{f=1.5;lockpitch=true}'
      - 'effect:particles{p=smoke;a=18;hS=0.3;vS=0.5} @self'
    NIN_Krok_Ork:
      # A9: osobny wariant orka (wcześniej = człowiek): za cel i odepchnięcie barkiem
      # throw dzieli velocity przez 10 (MM 5.11.2 ThrowMechanic, CFR; docs skills-mechanics-throw.md: przykłady 15/5)
      # -> 1.2 dawało 0,12 bl./tik i 0-0,7 bl. odrzutu (klon klasy-naprawa 25.10); 12 = 1,2 bl./tik
      Skills:
      - 'skill{s=NIN_Krok_Teleport} @TargetedTarget'
      - 'throw{velocity=12;velocityY=3} @TargetedTarget'
    NIN_Krok_Elf:
      Skills:
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @TargetedTarget'
      - 'teleport{spreadh=0;spreadv=1;unsafe=false} @Forward{f=1.5;lockpitch=true}'
      - 'potion{type=INVISIBILITY;duration=40;level=0;force=true;hasParticles=false} @self'
      - 'effect:particles{p=smoke;a=18;hS=0.3;vS=0.5} @self'
    NIN_Krok_Nieumarly:
      Skills:
      - 'pull{velocity=2} @target'
      - 'effect:particles{p=soul;a=20;hS=0.3;vS=0.5} @target'

NIN_EGZEKUCJA:
  source: mythicmobs:NIN_Egzekucja
  name: 'Egzekucja'
  icon: {item: NETHERITE_SWORD}
  lore: ['&7Cios kończący do 3 bl.; strzelcy do 8.', '&7Bazowo {damage} obrażeń.', '&7Wersja dystansowa ma niższy mnożnik.', '&7Za Znamię: wręcz +40% (ork +55%),', '&7z dystansu +25%.', '', '&e{cooldown}s odnowienia', '&9Koszt: 40 Skupienia']
  parameters:
    mana: {name: Koszt, player: 40}
    cooldown: {name: Odnowienie, player: 6}
    damage: {name: Obrażenia, player: {base: 4.5, per-level: 1.2}}
    wariant: {name: Wariant, player: 0}
    dystans: {name: Wariant dystansowy, player: 0}
  extra-skills:
    NIN_Egzekucja:
      # A5: zasięg i cel sprawdzane w KORZENIU — bez celu w zasięgu skill się nie rzuca i nie bierze Skupienia
      # (docs MythicLib using-mythicmobs.md:92; warunki złożone && / || — docs MM skills-conditions.md:153)
      TargetConditions:
      - '((distance{d=0to3} true && stringEquals{val1="<modifier.int.dystans>";val2="0"} true) || (distance{d=3to8} true && stringEquals{val1="<modifier.int.dystans>";val2="1"} true)) true'
      Skills:
      - 'skill{s=NIN_Egzekucja_Wrecz_Mob} @target ?stringEquals{val1="<modifier.int.dystans>";val2="0"}'
      - 'skill{s=NIN_Egzekucja_Wrecz_Gracz} @target ?stringEquals{val1="<modifier.int.dystans>";val2="0"}'
      - 'skill{s=NIN_Egzekucja_Dystans_Mob} @target ?stringEquals{val1="<modifier.int.dystans>";val2="1"}'
      - 'skill{s=NIN_Egzekucja_Dystans_Gracz} @target ?stringEquals{val1="<modifier.int.dystans>";val2="1"}'
    NIN_Egzekucja_Wrecz_Mob:
      TargetConditions:
      - 'distance{d=0to3} true'
      - 'isPlayer false'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=NIN_Egzekucja_Cel} @TargetedTarget'
    NIN_Egzekucja_Wrecz_Gracz:
      TargetConditions:
      - 'distance{d=0to3} true'
      - 'isPlayer true'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=NIN_Egzekucja_Cel} @TargetedTarget'
    NIN_Egzekucja_Dystans_Mob:
      TargetConditions:
      - 'distance{d=3to8} true'
      - 'isPlayer false'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=NIN_Egzekucja_Cel_Dystans} @TargetedTarget'
    NIN_Egzekucja_Dystans_Gracz:
      TargetConditions:
      - 'distance{d=3to8} true'
      - 'isPlayer true'
      - 'celWrogi{} true'
      Skills:
      - 'skill{s=NIN_Egzekucja_Cel_Dystans} @TargetedTarget'
    NIN_Egzekucja_Cel:
      Skills:
      - 'skill{s=NIN_Znamie_Init} @TargetedTarget'
      - 'setvariable{var=skill.nin_finisher_znamiona;type=INTEGER;value="<target.var.znamiona>"} @TargetedTarget'
      - 'skill{s=NIN_Egzekucja_Nieumarly} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="0"}'
      - 'skill{s=NIN_Egzekucja_Ork} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="1"}'
      - 'skill{s=NIN_Egzekucja_Zwykla} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="2"}'
      - 'skill{s=NIN_Egzekucja_Zwykla} @TargetedTarget ?stringEquals{val1="<modifier.int.wariant>";val2="3"}'
      - 'setvariable{var=target.znamiona;type=INTEGER;value=0} @TargetedTarget'
      - 'effect:sound{s=entity.player.attack.crit;v=0.8;p=0.8} @self'
    NIN_Egzekucja_Cel_Dystans:
      Skills:
      - 'skill{s=NIN_Znamie_Init} @TargetedTarget'
      - 'setvariable{var=skill.nin_finisher_znamiona;type=INTEGER;value="<target.var.znamiona>"} @TargetedTarget'
      - 'mmodamage{a="<modifier.damage> * (1 + 0.25 * <skill.var.nin_finisher_znamiona>)";types=SKILL,PHYSICAL} @TargetedTarget'
      - 'setvariable{var=target.znamiona;type=INTEGER;value=0} @TargetedTarget'
      - 'effect:sound{s=entity.player.attack.crit;v=0.8;p=1.2} @self'
    NIN_Egzekucja_Zwykla:
      Skills:
      - 'mmodamage{a="<modifier.damage> * (1 + 0.4 * <skill.var.nin_finisher_znamiona>)";types=SKILL,PHYSICAL}'
    NIN_Egzekucja_Ork:
      Skills:
      - 'mmodamage{a="<modifier.damage> * (1 + 0.55 * <skill.var.nin_finisher_znamiona>)";types=SKILL,PHYSICAL}'
    NIN_Egzekucja_Nieumarly:
      Skills:
      - 'mmodamage{a="<modifier.damage> * (1 + 0.4 * <skill.var.nin_finisher_znamiona>)";types=SKILL,PHYSICAL}'
      - 'heal{a="<modifier.damage> * (1 + 0.4 * <skill.var.nin_finisher_znamiona>) * 0.3"} @self'

