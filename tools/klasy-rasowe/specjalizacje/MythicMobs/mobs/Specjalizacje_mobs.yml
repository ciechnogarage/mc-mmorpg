# 2026-10-25 (audyt A3/A11): cios sługi zadaje właściciel (AKO_Sluga_Cios w Akolita_Slugi_skills.yml): EXP/łup dla gracza, skaluje Wiara.
SPEC_WILK_STEPU:
  Type: "WOLF"
  Display: "&7Wilk Stepu"
  Health: 18
  Damage: 3
  Faction: "akolita_slugi"
  Options:
    MovementSpeed: 0.33
    PreventOtherDrops: true
    Despawn: true
    FollowRange: 24
  AIGoalSelectors:
  - "0 clear"
  - "1 float"
  - "2 meleeattack"
  - "3 gotoowner"
  - "4 lookatplayers"
  AITargetSelectors:
  - "0 clear"
  - "1 ownerattacker"
  - "2 ownertarget"
  Skills:
  - "skill{s=SpecSlugaKoniec10} @self ~onSpawn"
  - "setvariable{var=caster.ako_dmg;type=DOUBLE;value=3} @self ~onSpawn"
  - "skill{s=AKO_Sluga_Cios;sync=true} @trigger ~onAttack ?~!isplayer"
