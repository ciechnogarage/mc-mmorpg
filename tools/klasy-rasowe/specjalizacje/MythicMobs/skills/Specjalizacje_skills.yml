# Lokalna kopia NIN_Znamie_Dodaj: plik MM wczytuje się przed extra-skills MythicLib.

SpecZnamieDodaj:
  Skills:
  - "skill{s=SpecZnamieInit} @TargetedTarget"
  - "variableadd{var=target.znamiona;amount=1} @TargetedTarget"
  - "skill{s=SpecZnamieOgranicz} @TargetedTarget"
  # A10: Znamiona gasną 10 s po ostatnim trafieniu (jak NIN_Znamie_Dodaj)
  - "setvariable{var=target.znamiona;type=INTEGER;value=\"<target.var.znamiona>\";duration=200} @TargetedTarget"
  - "effect:particles{p=crit;a=12;hS=0.25;vS=0.3} @TargetedTarget"

SpecZnamieInit:
  TargetConditions:
  - "variableIsSet{var=target.znamiona} false"
  Skills:
  - "setvariable{var=target.znamiona;type=INTEGER;value=0} @TargetedTarget"

SpecZnamieOgranicz:
  TargetConditions:
  - "variableInRange{var=target.znamiona;value=>5} true"
  Skills:
  - "setvariable{var=target.znamiona;type=INTEGER;value=5} @TargetedTarget"
