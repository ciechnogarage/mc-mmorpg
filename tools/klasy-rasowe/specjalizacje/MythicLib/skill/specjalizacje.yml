SPEC_BASTION_MUR:
  source: "mythicmobs:SpecBastionMur"
  name: "Mur Przysięgi"
  icon:
    item: "SHIELD"
  lore:
  - "&8&oKorona stoi tam, gdzie jej miecz."
  - "&7Postawa 5 s: -40% obrażeń, bez odrzutu; prowokacja r6."
  - "&6◆ Tarcza: postawa +1 s"
  - ""
  - "&e{cooldown}s odnowienia"
  - "&9Koszt: 25 Szału"
  parameters:
    mana:
      name: "Koszt"
      player: 25
    cooldown:
      name: "Odnowienie"
      player: 16
  extra-skills:
    SpecBastionMur:
      Skills:
      - "setvariable{var=caster.kr_premia;type=INTEGER;value=0;duration=200} @self"
      - "setvariable{var=caster.kr_premia;type=INTEGER;value=1;duration=200} @self ?bronRasowa{typ=SHIELD}"
      - "skill{s=SpecBastionMurPose} @self ?variableEquals{var=caster.kr_premia;value=0}"
      - "skill{s=SpecBastionMurPoseShield} @self ?variableEquals{var=caster.kr_premia;value=1}"
      - "skill{s=SpecBastionMurTaunt} @self"
    SpecBastionMurPose:
      Skills:
      - "potion{type=RESISTANCE;duration=100;level=1;force=true} @self"
      - "onDamaged{auraName=spec_mur_still;duration=100;onHit=SpecBastionStill} @self"
    SpecBastionMurPoseShield:
      Skills:
      - "potion{type=RESISTANCE;duration=120;level=1;force=true} @self"
      - "onDamaged{auraName=spec_mur_still;duration=120;onHit=SpecBastionStill} @self"
    SpecBastionMurTaunt:
