      - "skill{s=SpecBastionMurTauntMob} @EntitiesInRadius{r=6;ignore=self,players;targetarmorstands=false;sort=NEAREST;limit=5;targetvillagers=false}"
    SpecBastionMurTauntMob:
      TargetConditions:
      - "isPlayer false"
      - "celWrogi{} true"
      Skills:
      - "sudoskill{s=SpecBastionMurSetTarget;cat=true} @TargetedTarget"
    SpecBastionMurSetTarget:
