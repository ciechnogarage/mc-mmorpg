###################################################
# Level & Experience
###################################################

level-up:
  sound: ENTITY_PLAYER_LEVELUP,1,2
  # Runs a script on level up. This script is implemented
  # inside file MythicLib/scripts/mmocore_scripts.yml
  script: mmocore_level_up_effect
  message:
    - ''
    - '&eAwans na poziom &6{level}&e!'
    - '&eOtwórz okno postaci klawiszem &6E&e, aby zobaczyć statystyki.'
    - ''
profession-level-up:
  sound: ENTITY_PLAYER_LEVELUP,1,2
  message:
    - ''
    - '&eAwans w profesji &6{profession}&e na poziom &6{level}&e!'
    - ''
exp-notification:
  message: '&f{profession} &e{progress} &e{ratio}%'
  priority: 10
  duration: 20
  action-bar: true
  #sound: ENTITY_EXPERIENCE_ORB_PICKUP # Not recommended, can be spammy
death-exp-loss:
  - ''
  - '&cZginąłeś i straciłeś {loss} doświadczenia.'
  - ''

# Experience boosters
new-exp-booster-main:
  message:
    - '&e'
    - '&eAktywowano premię doświadczenia &6×{multiplier}&e!'
    - '&e'
  sound: ENTITY_EXPERIENCE_ORB_PICKUP
new-exp-booster-profession:
  message:
    - '&e'
    - '&eAktywowano premię doświadczenia &6×{multiplier}&e dla profesji &6{profession}&e!'
    - '&e'
  sound: ENTITY_EXPERIENCE_ORB_PICKUP

