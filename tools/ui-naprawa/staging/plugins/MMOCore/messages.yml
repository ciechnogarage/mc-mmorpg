###################################################
# PvP Mode
###################################################
pvp-mode:
  cooldown: '&cPoczekaj jeszcze {remaining} s.'

  # When you cannot hit another player
  cannot-hit:
    high-level-difference: '&cRóżnica poziomów jest zbyt duża do tej walki.'
    low-level-target: '&cPoziom tego gracza jest za niski do walki z Tobą.'
    low-level-self: '&cTwój poziom jest za niski do walki z graczami.'
    pvp-mode-disabled-target: '&cTen gracz ma wyłączony tryb PvP.'
    pvp-mode-disabled-self: '&cMasz wyłączony tryb PvP.'
    invulnerable-self: '&cPrzez kolejne {left} s nie możesz walczyć.'
    invulnerable-target: '&cTen gracz jest chroniony jeszcze przez {left} s.'

  # When using /pvpmode
  toggle:
    on-safe: '&aMożesz teraz walczyć z graczami w wyznaczonych miejscach.'
    on-invulnerable: '&aBędziesz mógł walczyć z graczami za {time} s.'
    off-safe: '&cWyłączono walkę z graczami.'

  # Entering/leaving regions
  leave:
    pvp-allowed: '&cOpuszczono strefę PvP. Nadal można Cię zranić przez {remaining} s!'
    pvp-denied: '&cOpuszczono strefę PvP.'
  enter:
    pvp-mode-on: '&aWejście do strefy PvP: ochrona przez {time} s.'
    pvp-mode-off: '&aWejście do strefy PvP. Włącz PvP w oknie Ustawienia, aby walczyć.'

