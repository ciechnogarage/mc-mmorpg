# --- FARMER: dlugi zbior, ale duzo naraz -----------------------------
NODE_CROP_FIELD_HARVEST:
  Cooldown: 4
  Skills:
    - message{m="<gray><i>Zbierasz plon z poletka...</i>"} @trigger
    - effect:sound{s=block.crop.break;v=0.8;p=0.9} @self
    - effect:particles{p=block_crack;m=hay_block;a=15;hs=0.5;vs=0.3} @self
    - delay 25
    - effect:sound{s=block.crop.break;v=0.8;p=1.0} @self
    - effect:particles{p=block_crack;m=hay_block;a=15;hs=0.5;vs=0.3} @self
    - delay 25
    - effect:sound{s=block.crop.break;v=1.0;p=1.1} @self
    - command{c="mi give MATERIAL PROF_FRESH_HARVEST <trigger.name> 5"} @trigger
    - command{c="mmocore admin exp give <trigger.name> farming 22"} @trigger
    - 'message{m="<yellow>Poletko zebrane: <white>5x Świeży zbiór<yellow>."} @trigger'
    - remove @self

# --- JUBILER: precyzja, druza moze peknac ----------------------------
