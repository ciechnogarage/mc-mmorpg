# =====================================================================
#  Umiejetnosci wezlow zasobow.
#  KAZDA PROFESJA MA WLASNY RYTM ZBIERANIA - to jest celowe:
#    drwal      - wiele ciec, wysilek, halas, licznik postepu
#    zielarz    - jedno szybkie ciche zerwanie, loteria jakosci
#    farmer     - dlugi zbior, ale duza ilosc naraz
#    jubiler    - precyzja z ryzykiem: druza moze peknac
#  Licznik cięć trafia przez komendę konsoli Zaklecia do wspólnego arbitra MythicLib (priorytet 30).
# =====================================================================

# --- DRWAL: kazde klikniecie to jedno ciecie -------------------------

NODE_TIMBER_OAK_HARVEST:
  Cooldown: 1
  Skills:
    - variableadd{var=caster.chops;amount=1} @self
    - effect:sound{s=block.wood.hit;v=1.0;p=0.8} @self
    - effect:particles{p=block_crack;m=oak_log;a=14;hs=0.35;vs=0.35} @self
    - command{c="zaklecia pasek <trigger.name> ciecie <caster.var.chops> 3"} @trigger
    - skill{s=NODE_TIMBER_OAK_FELL} @trigger ?variableinrange{var=caster.chops;value=>2}

NODE_TIMBER_OAK_FELL:
  Skills:
    - effect:sound{s=block.wood.break;v=1.0;p=0.8} @self
    - command{c="mi give MATERIAL PROF_OAK_TIMBER <trigger.name> 3"} @trigger
    - command{c="mmocore admin exp give <trigger.name> woodworking 18"} @trigger
    - message{m="<green>Dąb pada. Pozyskujesz <white>3x Twarde drewno dębowe<green>."} @trigger
    - remove @self

