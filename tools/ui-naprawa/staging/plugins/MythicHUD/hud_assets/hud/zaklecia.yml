      text: '<#FFBC69>L %zaklecia_lewa_pasek% <white>%zaklecia_lewa_koszt%'
      font: default
      outlined: true
      align: left
      offset: {x: 0, y: 0}
zaklecia-prawa-laduje:
  conditions:
    - placeholder{ph=%zaklecia_tryb%;val=tak} true hide
    - placeholder{ph=%zaklecia_prawa_stan%;val=laduje} true hide
