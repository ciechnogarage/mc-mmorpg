# Gotowy czar nie zajmuje miejsca na ekranie. Podczas ladowania dwa paski
# mieszczą się w jednym wierszu; odmowa idzie przez arbiter paska akcji.
zaklecia-lewa-rzuca:
  conditions:
    - placeholder{ph=%zaklecia_tryb%;val=tak} true hide
    - placeholder{ph=%zaklecia_lewa_stan%;val=rzuca} true hide
  layers:
    znacznik:
      text: '<#FFBC69>◆'
      font: default
      outlined: true
      align: left
      offset: {x: 0, y: 0}
zaklecia-prawa-rzuca:
  conditions:
    - placeholder{ph=%zaklecia_tryb%;val=tak} true hide
    - placeholder{ph=%zaklecia_prawa_stan%;val=rzuca} true hide
  layers:
    znacznik:
      text: '<#FFBC69>◆'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: 0}
zaklecia-prawa-przelacznik:
  conditions:
    - placeholder{ph=%zaklecia_tryb%;val=tak} true hide
    - placeholder{ph=%zaklecia_prawa_przelacznik%;val=tak} true hide
  layers:
    znacznik:
      text: '<#F6D87B>●'
      font: default
      outlined: true
      align: right
      offset: {x: 0, y: 0}
zaklecia-lewa-laduje:
