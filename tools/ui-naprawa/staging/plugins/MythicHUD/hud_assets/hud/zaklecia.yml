      font: default
      outlined: true
      align: right
      offset: {x: 0, y: 0}
zaklecia-lewa-gotowe:
  conditions:
    - placeholder{ph=%zaklecia_tryb%;val=tak} true hide
    - placeholder{ph=%zaklecia_lewa_stan%;val=gotowe} true hide
  layers:
