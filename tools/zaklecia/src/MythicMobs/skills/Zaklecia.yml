# Zaklecia w dloni w stylu Skyrima (TEST 2026-09-29). Zrodlo prawdy: tools/zaklecia/src.
# Uklad kazdego zaklecia:
#   ~onUse       -> _Start: dwie aury na rzucajacym: _wiz (co 2 ticki, sam obraz strumienia)
#                   i _tik (co 10 tickow = okno niesmiertelnosci moba: mana, obrazenia, efekty)
#   ~onCancelUse -> _Stop: zdjecie aur + dzwiek wygaszenia
#   ~onUnHeld    -> Zak_Stop_Wszystko (zmiana slotu w trakcie rzucania)
#   ~onTimer:4   -> _Dlon: zarzacy sie ogien/szron na dloni, gdy zaklecie jest "w rece"
# Mana/wytrzymalosc: zakZasob / zakMaZasob z pluginu Zaklecia (ciche API MMOCore). Bez pluginu
# tools/zaklecia/wdroz.sh podmienia je na wariant awaryjny (komenda konsoli + placeholder <mana>).

# ---------------------------------------------------------------- wspolne
Zak_Stop_Wszystko:
  Skills:
  - auraRemove{aura=zak_plom_wiz} @self
  - auraRemove{aura=zak_plom_tik} @self
  - auraRemove{aura=zak_odm_wiz} @self
  - auraRemove{aura=zak_odm_tik} @self

Zak_BrakMany:
  Skills:
  - skill{s=Zak_Stop_Wszystko} @self
  - sendtitle{title=" ";subtitle="<#6ab4ff>Za mało many";fadein=2;duration=24;fadeout=8} @self
  - sound{s=block.fire.extinguish;v=0.6;p=1.8} @self
  - sound{s=block.beacon.deactivate;v=0.5;p=2} @self

# ---------------------------------------------------------------- PLOMIENIE
Zak_Plomienie_Start:
  Skills:
  - auraRemove{aura=zak_odm_wiz} @self
  - auraRemove{aura=zak_odm_tik} @self
  - sound{s=item.firecharge.use;v=0.7;p=0.8} @self
  - sound{s=entity.blaze.shoot;v=0.4;p=1.5} @self
  - aura{auraName=zak_plom_wiz;duration=1200;interval=2;onTick=Zak_Plomienie_Strumien} @self
  - aura{auraName=zak_plom_tik;duration=1200;interval=10;onTick=Zak_Plomienie_Tik} @self

Zak_Plomienie_Stop:
  Skills:
  - sound{s=block.fire.extinguish;v=0.35;p=1.6} @self ?hasaura{auraName=zak_plom_tik}
  - auraRemove{aura=zak_plom_wiz} @self
  - auraRemove{aura=zak_plom_tik} @self

Zak_Plomienie_Tik:
  Skills:
  - skill{s=Zak_Plomienie_Ogien;sync=true} ?zakMaZasob{zasob=mana;a=2}
  - skill{s=Zak_BrakMany;sync=true} ?!zakMaZasob{zasob=mana;a=2}

Zak_Plomienie_Ogien:
  Skills:
  - zakZasob{zasob=mana;a=2} @self
  - sound{s=block.fire.ambient;v=1;p=1.3} @self
  - sound{s=entity.blaze.burn;v=0.25;p=1.6} @self
  - skill{s=Zak_Plomienie_Traf;sync=true} @EntitiesInCone{a=40;r=6;usepitch=true;nomegbb=true}

Zak_Plomienie_Traf:
  TargetConditions:
  - mmoCanTarget{interaction=OFFENSE_ACTION} true
  - lineofsight true
  Skills:
  - mmodamage{a=4;t=SKILL,MAGIC;element=FIRE}
  - ignite{ticks=40}
  - effect:particles{p=flame;a=10;hs=0.3;vs=0.5;s=0.04;y=1}
  - effect:particles{p=lava;a=1;y=1}

Zak_Plomienie_Strumien:
  Skills:
  - projectile{onTick=Zak_Plomienie_Ogon;v=18;i=1;ti=1;mr=6.2;hR=0.25;vR=0.4;syo=1.3;sfo=0.55;sso=0.38;hn=10;vn=6;hp=true;hnp=true;ht=true;sE=true;sB=true} @Forward{f=7;y=1.3}

Zak_Plomienie_Ogon:
  Skills:
  - effect:particles{p=flame;a=4;hs=0.12;vs=0.1;s=0.02} @origin
  - effect:particles{p=small_flame;a=2;hs=0.08;vs=0.08;s=0.015} @origin
  - effect:particles{p=smoke;a=1;hs=0.1;vs=0.1;s=0.01} @origin 0.25

Zak_Plomienie_Dlon:
  Skills:
  - effect:particles{p=small_flame;a=1;hs=0.05;vs=0.05;y=1.1;sso=0.4;sfo=0.3} @self ?!hasaura{auraName=zak_plom_wiz} ?holding{m=ZAKLECIE_PLOMIENIE}

# ---------------------------------------------------------------- ODMROZENIE
Zak_Odmrozenie_Start:
  Skills:
  - auraRemove{aura=zak_plom_wiz} @self
  - auraRemove{aura=zak_plom_tik} @self
  - sound{s=entity.player.hurt_freeze;v=0.5;p=1.4} @self
  - sound{s=block.powder_snow.break;v=0.8;p=0.7} @self
  - aura{auraName=zak_odm_wiz;duration=1200;interval=2;onTick=Zak_Odmrozenie_Strumien} @self
  - aura{auraName=zak_odm_tik;duration=1200;interval=10;onTick=Zak_Odmrozenie_Tik} @self

Zak_Odmrozenie_Stop:
  Skills:
  - sound{s=block.amethyst_block.chime;v=0.5;p=1.8} @self ?hasaura{auraName=zak_odm_tik}
  - auraRemove{aura=zak_odm_wiz} @self
  - auraRemove{aura=zak_odm_tik} @self

Zak_Odmrozenie_Tik:
  Skills:
  - skill{s=Zak_Odmrozenie_Mroz;sync=true} ?zakMaZasob{zasob=mana;a=2.5}
  - skill{s=Zak_BrakMany;sync=true} ?!zakMaZasob{zasob=mana;a=2.5}

Zak_Odmrozenie_Mroz:
  Skills:
  - zakZasob{zasob=mana;a=2.5} @self
  - sound{s=block.powder_snow.step;v=1;p=0.6} @self
  - sound{s=entity.player.hurt_freeze;v=0.25;p=1.7} @self
  - skill{s=Zak_Odmrozenie_Traf;sync=true} @EntitiesInCone{a=40;r=6;usepitch=true;nomegbb=true}

Zak_Odmrozenie_Traf:
  TargetConditions:
  - mmoCanTarget{interaction=OFFENSE_ACTION} true
  - lineofsight true
  Skills:
  - mmodamage{a=3.5;t=SKILL,MAGIC;element=ICE}
  - potion{type=SLOWNESS;duration=30;level=1;hasParticles=false}
  - freeze{ticks=160}
  - effect:particles{p=snowflake;a=10;hs=0.35;vs=0.6;s=0.02;y=1}
  - effect:particles{p=item_snowball;a=6;hs=0.3;vs=0.5;s=0.05;y=1}
  - zakZasob{zasob=stamina;a=3}

Zak_Odmrozenie_Strumien:
  Skills:
  - projectile{onTick=Zak_Odmrozenie_Ogon;v=16;i=1;ti=1;mr=6.2;hR=0.25;vR=0.4;syo=1.3;sfo=0.55;sso=0.38;hn=11;vn=6;hp=true;hnp=true;ht=true;sE=true;sB=true} @Forward{f=7;y=1.3}

Zak_Odmrozenie_Ogon:
  Skills:
  - effect:particles{p=snowflake;a=3;hs=0.12;vs=0.1;s=0.015} @origin
  - effect:particles{p=item_snowball;a=1;hs=0.1;vs=0.08;s=0.01} @origin
  - effect:particles{p=end_rod;a=1;hs=0.12;vs=0.1;s=0.005} @origin 0.2

Zak_Odmrozenie_Dlon:
  Skills:
  - effect:particles{p=snowflake;a=1;hs=0.05;vs=0.05;y=1.1;sso=0.4;sfo=0.3} @self ?!hasaura{auraName=zak_odm_wiz} ?holding{m=ZAKLECIE_ODMROZENIE}
