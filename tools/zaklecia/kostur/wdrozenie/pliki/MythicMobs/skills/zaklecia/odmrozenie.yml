Zak_Odmrozenie_Strumien_P:
  Skills:
  - projectile{onTick=Zak_Odmrozenie_Ogon;v=16;i=1;ti=1;mr=6.2;hR=0.25;vR=0.4;syo=1.3;sfo=0.55;sso=0.38;hn=11;vn=6;hp=true;hnp=true;ht=true;sE=true;sB=true;hitConditions=[ - faction{faction=zaklecia_przywolane} false ]} @Forward{f=7;y=1.3}

Zak_Odmrozenie_Strumien_L:
  Skills:
  - projectile{onTick=Zak_Odmrozenie_Ogon;v=16;i=1;ti=1;mr=6.2;hR=0.25;vR=0.4;syo=1.3;sfo=0.55;sso=-0.38;hn=11;vn=6;hp=true;hnp=true;ht=true;sE=true;sB=true;hitConditions=[ - faction{faction=zaklecia_przywolane} false ]} @Forward{f=7;y=1.3}

Zak_Odmrozenie_Rdzen:
