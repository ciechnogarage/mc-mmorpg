Zak_Odmrozenie_Tik_L:
  Skills:
  - skill{s=Zak_Odmrozenie_Tik}

Zak_Odmrozenie_Tik_Obie:
  Skills:
  - skill{s=Zak_Odmrozenie_Tik}

Zak_Odmrozenie_Obraz_P:
