# Skille tylko zaklecia odmrozenie. _P = prawa, _L = lewa, _Obie = to samo w obu dloniach.
Zak_Odmrozenie_Start:
  Skills:
  - sound{s=entity.player.hurt_freeze;v=0.5;p=1.4} @self

Zak_Odmrozenie_Start_Obie:
  Skills:
  - effect:particles{p=snowflake;a=4;hs=0.15;vs=0.15;y=1.3;sfo=1.0} @self

Zak_Odmrozenie_Start_P:
  Skills:
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=6;hs=0.1;vs=0.1;s=0.02;y=1.3;sso=0.38;sfo=0.5} @self
  - effect:particles{audience=@PlayersInRadius{r=32};p=end_rod;a=3;hs=0.1;vs=0.1;s=0.03;y=1.3;sso=0.38;sfo=0.5} @self

Zak_Odmrozenie_Start_L:
  Skills:
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=6;hs=0.1;vs=0.1;s=0.02;y=1.3;sso=-0.38;sfo=0.5} @self
  - effect:particles{audience=@PlayersInRadius{r=32};p=end_rod;a=3;hs=0.1;vs=0.1;s=0.03;y=1.3;sso=-0.38;sfo=0.5} @self

Zak_Odmrozenie_Stop:
  Skills:
  - sound{s=block.amethyst_block.chime;v=0.5;p=1.8} @self

Zak_Odmrozenie_Stop_P:
  Skills:
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=5;hs=0.1;vs=0.05;s=0.01;y=1.3;sso=0.38;sfo=0.5} @self
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=4;hs=0.12;vs=0.08;s=0.01;y=1.3;sso=0.38;sfo=0.5} @self

Zak_Odmrozenie_Stop_L:
  Skills:
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=5;hs=0.1;vs=0.05;s=0.01;y=1.3;sso=-0.38;sfo=0.5} @self
  - effect:particles{audience=@PlayersInRadius{r=32};p=snowflake;a=4;hs=0.12;vs=0.08;s=0.01;y=1.3;sso=-0.38;sfo=0.5} @self

Zak_Odmrozenie_Tik:
  Skills:
  - sound{s=block.powder_snow.step;v=1;p=0.6} @self

Zak_Odmrozenie_Tik_P:
