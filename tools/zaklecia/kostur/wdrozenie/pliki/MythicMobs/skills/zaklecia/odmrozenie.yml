  - effect:particles{p=snowflake;a=18;hs=0.45;vs=0.7;s=0.03;y=1}
  - effect:particles{p=item_snowball;a=10;hs=0.4;vs=0.6;s=0.06;y=1}
  - zakZasob{zasob=stamina;a=6}

# Strumien rysuje plugin jako obiekt wyswietlany (model zaklecia:strumien_<id>); tu tylko male uderzenie w punkcie
# trafienia, wolane przez plugin co 4 ticki z lokacja trafienia jako @origin. Zak_Obraz (pociski) wylaczony w configu.

Zak_Odmrozenie_Traf_P:
  Skills:
  - skill{s=Zak_Odmrozenie_Traf;sync=true}

Zak_Odmrozenie_Traf_L:
  Skills:
  - skill{s=Zak_Odmrozenie_Traf;sync=true}

Zak_Odmrozenie_Traf_Obie:
  Skills:
  - skill{s=Zak_Odmrozenie_Traf2;sync=true}

Zak_Odmrozenie_Uderzenie:
  Skills:
  - effect:particles{p=snowflake;a=4;hs=0.15;vs=0.15;s=0.02} @origin
  - effect:particles{p=item_snowball;a=2;hs=0.1;vs=0.1;s=0.03} @origin

Zak_Odmrozenie_Uderzenie_P:
  Skills:
  - skill{s=Zak_Odmrozenie_Uderzenie}

Zak_Odmrozenie_Uderzenie_L:
  Skills:
  - skill{s=Zak_Odmrozenie_Uderzenie}
