  - skill{s=Zak_Odmrozenie_Rdzen}

Zak_Odmrozenie_Dlon_P:
  Skills:
  - effect:particles{p=snowflake;a=1;hs=0.05;vs=0.05;y=1.1;sso=0.4;sfo=0.3} @self

Zak_Odmrozenie_Dlon_L:
