  - mmoCanTarget{interaction=OFFENSE_ACTION} true
  - lineofsight true
  Skills:
  - mmodamage{a=7.7;t=SKILL,MAGIC;element=ICE}
  - potion{type=SLOWNESS;duration=40;level=2;hasParticles=false}
