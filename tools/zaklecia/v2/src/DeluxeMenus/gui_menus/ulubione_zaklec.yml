# Szybkie ulubione (Shift + Q), jak Q w Skyrimie. Widac tylko zaklecia z gwiazdka (Ksiega: Shift+LPM).
# LPM = prawa dlon, PPM = lewa. Tytul (glif panelu + znaki przesuniecia) wpisuje wpnij_menu.py z hub_umiejetnosci.
menu_title: 'Ulubione zaklęcia'
size: 27
update_interval: 1
items:

  'uzdrowienie_innego':
    material: TRIAL_KEY
    item_model: 'zaklecia:uzdrowienie_innego'
    update: true
    slot: 3
    view_requirement:
      requirements:
        ulubione:
          type: string equals
          input: '%zaklecia_ulubione_uzdrowienie_innego%'
          output: '★'
    display_name: '&a&lUzdrowienie innego'
    lore:
      - '&7Wskazana niewroga istota · 6 bloków · 8 HP · 2 many'
      - '&eLPM &7— do prawej dłoni'
      - '&ePPM &7— do lewej dłoni'
    left_click_commands:
      - '[console] zaklecia przypisz %player_name% uzdrowienie_innego prawa'
      - '[close]'
    right_click_commands:
      - '[console] zaklecia przypisz %player_name% uzdrowienie_innego lewa'
