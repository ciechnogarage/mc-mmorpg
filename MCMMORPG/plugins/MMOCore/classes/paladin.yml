# Can either be the file name of a text file inside the 'exp-curves' folder, where
# each line corresponds to the experience required to reach the next level.
# Example: 'levels'
#
# Or a formula using the {level} placeholder (current player level) and PAPI placeholders.
# The formula should return the total experience required to reach the next level
# given the current player's level.
# Example: '{level} * 200'
exp-curve: '{level} * 200'

skill-slots:
    1:
        name: "&aŚlubowanie Światła"
        unlocked-by-default: true
        lore:
            - '&7Slot pod pierwszą osłonę albo sustain.'
        # Permanently binds a skill to this slot
        # Players won't be able to change the skill in this slot
        hardset: HUMAN_SHIELD
    2:
        name: "&aWard Przysięgi"
        unlocked-by-default: true
        lore:
            - '&7Slot pod ochronę miejsca lub sojusznika.'
        hardset: GREATER_HEALINGS
    3:
        name: "&aPopiół Winnych"
        unlocked-by-default: true
        lore:
            - '&7Slot pod presję, dot albo karę.'
        hardset: AMBERS
    4:
        name: "&aOdmowa Śmierci"
        unlocked-by-default: true
        lore:
            - '&7Slot pod podpis builda akolity.'
        hardset: DEEP_WOUND

skill-trees:
    - 'general'
    - 'combat'
    - 'warrior-paladin'

# The maximum level players can reach
max-level: 100

exp-table: class_exp_table

cast-particle:
    particle: VILLAGER_HAPPY

skills:
    DEEP_WOUND:
        level: 10
        max-level: 30
    WEAKEN:
        level: 5
        max-level: 30
    AMBERS:
        level: 15
        max-level: 30
    GREATER_HEALINGS:
        level: 7
        max-level: 30
    MINOR_HEALINGS:
        level: 3
        max-level: 30
    HUMAN_SHIELD:
        level: 13
        max-level: 20

attributes:
    knockback-resistance:
        base: .3
        per-level: .01
    speed-malus-reduction:
        base: 30
        per-level: 2
    max-health:
        base: 22
        per-level: 0.3
    attack-speed:
        base: 3.7
        per-level: 0
    movement-speed:
        base: .095
        per-level: 0

# Experience sources for main class experience.
main-exp-sources:
- 'killmob{type=ZOMBIE;amount=1-3}'
- 'killmob{type=ENDERMAN;amount=6-9}'
subclasses:
    KAPELAN: 25
    INKWIZYTOR: 25
    RYTUALISTA: 25
