# GUI display name
name: 'Punkty podróży'
name-on-waypoint: 'Punkt podróży: {waypoint}'

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 45

items:
  waypoint:
    slots: [ 10,11,12,13,14,15,16,19,20,21,22,23,24,25,28,29,30,31,32,33,34 ]
    function: waypoint

    # Displayed when there is no waypoint
    no-waypoint:
      item: GRAY_STAINED_GLASS_PANE
      name: '&a'
      lore: { }

    # Displayed when the waypoint has not been unlocked yet.
    locked:
      name: '&c- Zablokowany -'
      item: GRAY_DYE
      lore: { }

    # When the two waypoints are not linked together
    not-a-destination:
      name: '&a{name}'
      item: ENDER_PEARL

      # Material displayed when the waypoint is not
      # ready (not dynamic, or not enough stellium)
      not-ready: ENDER_PEARL

      lore:
        - '{lore}'
        - '&7Nie masz dostępu do tego punktu.'

    current-waypoint:
      name: '&a{name}'

      #custom_model_data_float: 0.45        # 1.20.4+ Float custom model data. Either this, or string option above works completely fine
      #custom_model_data: 0                 # 1.14-1.20.3 Custom model data. Prefer using custom_model_data_string on 1.20.4+
      #tooltip: 'myplugin:tooltip_asset_id' # You can edit the slot icon tooltip that way
      #custom_model_data_string: 'test'     # 1.20.4+ string custom model data
      #item_model: 'minecraft:dirt'         # 1.21.2+ item model
      #skull_texture: '......'              # SKull texture value or URL
      #hide_tooltip: false                  # True or false, for vanilla tooltip
      #unbreakable: false                   # Is it unbreakable or not?
      #fake_attribute: false                # Should MythicLib add a fake attribute modifier? Useful for 1.20 or lower to hide vanilla attributes from the item
      #item_flags: [HIDE_ENCHANTS, ....]    # Add item flags to your items. https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/inventory/ItemFlag.html

      item: ENDER_PEARL
      lore:
        - '{lore}'
        - '&7Jesteś tutaj.'

    # When you don't have enough stellium
    not-enough-stellium:
      name: '&a{name}'
      item: ENDER_PEARL

      lore:
        - '{lore}'
        - '&7Masz za mało stellium, by się przenieść.'
        - '&7Koszt podróży: &b{normal_cost}&7/&b{dynamic_cost} &7stellium.'

    # Displayed when the waypoint is unlocked and usable
    display:
      name: '&a{name}'
      item: ENDER_EYE
      format_path:   # MMOCore czyta format_path.none/.splitter (WaypointViewer$WaypointItemHandler); domyslne "path:" nieczytane -> "None"
        splitter: ', '
        none: 'Brak'
      lore:
        - '{lore}'
        - '&7Możesz się tu przenieść.'
        - '&7Punkty pośrednie: {intermediary_waypoints}'
        - '&7Kliknij, by przenieść się za &b{current_cost} &7stellium.'

  next:
    slots: [ 26 ]
    function: next
