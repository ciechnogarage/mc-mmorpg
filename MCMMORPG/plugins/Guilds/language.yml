      - '&bGuild Exp: &e{xp}'
      - '&bGuild Level: &e{level} &b(&e{percentage}% &bto Level {nextLevel})'
      - '&b&m-----------------------------------------------------'
    invite:
      help: '&e/guild invite <player> - &bInvites the player to your guild'
      hover-command: '/guild invite '
      hover-text: ' &bInvites the player to your guild'
      player-already-in-guild: '&c{player} &cis already in a guild'
