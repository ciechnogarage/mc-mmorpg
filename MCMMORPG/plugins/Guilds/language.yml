        chat: '&cYou''ve already got a rank with this name!'
        gui: Name already used
      updated: '&aThe rank is now called &6{rankDisplayName}&a!'
    rank-tag:
      input-minor-than-2: '&cThe rank''s tag must be at least 2 characters!'
      already-exist: '&cYou''ve already got a rank with this tag!'
      updated: '&aSuccessfully changed the tag to &6{rankTag}&a!'
