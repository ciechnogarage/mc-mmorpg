      help: '&e/guild create <name> - &bCreates a guild with the specified name'
      hover-command: '/guild create '
      hover-text: '&bCreates a guild with the specified name'
      use: '&cUse: /guild create <guild-name>'
      already-exists: '&cThe guild {guildName} already exists'
      name-length-more-than-limit: '&cThe guild name length must be less than {limit}'
      name-with-prohibited-chars: '&cThe guild name contains prohibited characters'
      success:
      - '&b&m-----------------------------------------------------'
      - '&aYou created the &6{guildName} &aguild!'
      - '&b&m-----------------------------------------------------'
    demote:
      help: '&e/guild demote <player> - &bDemotes the player to the previous rank'
      hover-command: '/guild demote '
      hover-text: '&bDemotes the player to the previous rank'
      use: '&cUse: /guild demote <player>'
      master-rank: '&cYou can''t demote the player because he is the highest rank!'
      default-rank: '&cYou can''t demote again the player because his rank is the
        default one!'
      success:
      - '&b&m-----------------------------------------------------'
      - '&a{playerTarget} &awas demoted from {oldRank} to {newRank}!'
      - '&b&m-----------------------------------------------------'
    disband:
      help: '&e/guild disband - &bDisbands the guild'
      hover-command: /guild disband
      hover-text: '&bDisbands the guild'
      use: '&cUse: /guild disband'
      not-in-guild: '&cYou are not in a guild'
      success:
      - '&b&m-----------------------------------------------------'
      - '&aYou disbanded the &6{guildName} &aguild!'
      - '&b&m-----------------------------------------------------'
      confirm-request:
      - '&b&m-----------------------------------------------------'
      - '&eAre you sure you want to disband the guild?'
      - '&eType &6{confirmMessage} &eto confirm.'
      - '&b&m-----------------------------------------------------'
    discord:
      help: '&e/guild discord - &bSet or view the guild''s discord link'
      hover-command: /guild discord
      hover-text: '&bSet or view the guild''s discord link'
      use: '&cUse: /guild discord'
      no-link: '&cYour guild does not have a Discord invite link!'
      change-link-help: '&7To change the link, use &6/guild discord (invite link)
        &7or &6/guild discord reset &7to remove it.'
