      help: '&e/guild achievements - &bOpens the Guild Achievements Menu'
      hover-command: /guild achievements
      hover-text: '&bOpens the Guild Achievements Menu'
      use: '&cUse: /guild achievements'
    chat:
      help: '&e/guild chat <chat message> - &bSend a chat message to your guild channel'
      hover-command: '/guild chat '
      hover-text: '&bSend a chat message to your guild channel'
      use: '&cUse: /guild chat <message>'
      empty: '&cYou must enter a message to send'
