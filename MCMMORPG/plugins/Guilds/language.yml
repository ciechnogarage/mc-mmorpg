      - '                                 &6{guildName}'
      - ''
      - '&bCreated: &e{creationTime}'
      - '&bMembers: &e{players}&6/&e{maxPlayers}'
      - '&bDescription: &e{description}'
      - '&bMOTD last edited by &e{motdEditor} &bat &e{editTime}'
