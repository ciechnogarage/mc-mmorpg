      - '&b&m-----------------------------------------------------'
      - '&f{guildName}'
      - '&fDISCORD'
      - '&b {link}'
      - '&7{editmsg-or-null}'
      - '&b&m-----------------------------------------------------'
      success:
      - '&b&m-----------------------------------------------------'
      - '&a{player} &aupdated the Guild Discord invite link.'
      - '&b&m-----------------------------------------------------'
    finder:
      help: '&e/guild finder - &bOpens the Guild Finder Menu'
      hover-command: /guild finder
      hover-text: '&bOpens the Guild Finder Menu'
    help:
