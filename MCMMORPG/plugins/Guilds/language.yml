guilds:
  settings:
    guild-level:
      level-up-message:
      - '&6&m-----------------------------------------------------'
      - ''
      - '&f&lLEVEL UP!'
      - ''
      - '&6The Guild has reached Level {level}!'
      - ''
      - '&6&m-----------------------------------------------------'
    boosters:
      double-xp:
        start-message:
        - '&6&lYOU GOT LUCKY!'
        - '&7You will receive &3DOUBLE XP &7this game!'
        reward-message:
        - '&bExperience just earned DOUBLED as a &2Guild &6Level Reward!'
      double-coins:
        reward-message:
        - '&6Coins just earned DOUBLED as a &2Guild &6Level Reward!'
    guild-join:
      format: '&2Guild > &7{player} &ejoined.'
    guild-leave:
      format: '&2Guild > &7{player} &eleft.'
    guild-chat:
      format: '&2Guild > &7{player} {rankTagFormatted}&f: {message}'
      admin-spy:
        format: '&9Guild Spy > &7{guildName} &7{player} {rankTagFormatted}&f: {message}'
    officer-chat:
      format: '&3Officer > &7{player}{rankTagFormatted}&f: {message}'
    finder:
      sorting:
        format: '{sortingStatus} {sortingName}'
        a_to_z: A to Z.
        z_to_a: Z to A.
        high_members: Most Guild Members first.
        low_members: Fewest Guild Members first.
        high_level: Highest Guild Level first.
        low_level: Lowest Guild Level first.
        none: Sort in no apparent order.
  message:
    no-permissions: '&cYou do not have the required permission'
    no-rank: '&cYou do not have the required guild rank'
    not-in-guild: '&cYou are not in a guild'
    already-in-guild: '&cYou are already in a guild'
    player-not-found: '&cPlayer not found'
    full-guild: '&cThe guild is full'
    command-not-available: '&cThis command is not usable yet'
    error: '&cAn error occurred while executing the command. Please contact an administrator!'
    none: None
    nobody: Nobody
    never: Never
    online: Online
    no-description: Your guild does not have a description
    enter-new-name: Enter new name
    enter-edit-name: '{name}'
    enter-new-tag: Enter new tag
    enter-edit-tag: '{tag}'
    enter-player-name: Enter player name
  messages:
    guild-time:
      units:
        second:
          singular: second
          plural: seconds
        minute:
          singular: minute
          plural: minutes
        hour:
          singular: hour
          plural: hours
        day:
          singular: day
          plural: days
        year:
          singular: year
          plural: years
  help:
    above:
    - '&b&m-----------------------------------------------------'
    - '&aGuild Commands:'
    bottom:
    - '&b&m-----------------------------------------------------'
  motd:
    above:
    - '&b&m--------------&a Guild: Message Of The Day &b&m----------------'
    line: '&b| {line-text}'
    line-list: '&b| {line-number}. {line-text}'
    bottom:
    - '&b&m---------------------------------------------------'
  quest:
    complete-message:
    - '&6&m---------------------------------------------------'
    - ''
    - '&6The guild has completed Tier {quest_tier} of this week''s Guild Quest!'
    - '&2+{quest_next_reward} Guild Experience'
    - ''
    - '&6&m---------------------------------------------------'
  menu:
    home-no-guild:
      create:
        help:
          message: '&aClick here to use &6/guild create &ato create a new guild!'
          hover: '&aClick to create a new guild!'
    home:
      discord-item:
        help:
          message: '&aClick here to use &6/guild discord &ato change the discord link!'
          hover: '&aClick to change the discord link!'
      description-item:
        help:
          message: '&aClick here to use &6/guild settings DESCRIPTION &ato change
            the description!'
          hover: '&aClick to change the description!'
