# Do NOT change this! Choose one and stick to it.
#
# When updating from MMOInventory 1 to MMOInventory 2, MMOInventory will convert the legacy mmoinventory
# to the custom inventory with ID "mmoinventory1_legacy". If you change this ID, data of the old inventory
# will be lost.
#
# This option is irrelevant for the vanilla inventory (as MMOInventory stores no vanilla inventory data).
id: mmoinventory1_legacy

# Toggle on/off for temporary disabling this inventory.
enabled: true

# Either 'custom' for custom inventories or 'vanilla' for the vanilla inventory.
# There can be only one vanilla inventory at a time!
type: custom

# Should items from this custom inventory be dropped on death.
# This option is only for custom inventories, as vanilla inventory
# is already supported by the keepInventory world flag.
drop_on_death: false

ui_layout:

  # Amount of rows in the inventory (between 1 and 6).
  # Remember to check the slot numbers in the config section below when changing this.
  # This option is only for custom inventories.
  rows: 4

  # Names of the inventories. This is also used to apply custom textures to the UIs.
  # The default MMOInventory resource pack provides three basic textures:
  # - u40E0 (classic)
  # - u40E1 (classic v2)
  # - u40E2 (Oraxen texture based)
  #
  # Note that in 1.20.X and under, GUI item models had a "scale" parameter that could
  # be set to 110% to hide the vanilla grid pattern of any inventory. This no longer
  # exists in 1.21+ and custom fonts are now required to achieve similar results.
  name:
    self: "&f%mythiclib_space_-17%\u40E0%mythiclib_space_-169%<#3F3F3F>Ekwipunek Postaci"
    other: "&f%mythiclib_space_-17%\u40E0%mythiclib_space_-169%<#3F3F3F>Ekwipunek: {name}"

# Command to be used in order to open the custom inventory.
# This option is only for custom inventories.
open_command:
  enabled: true
  name: 'custominv'
  permission: 'custom_inv.open.mmoinventory_default'
  aliases: [ mmoinv, rpginv, rpginventory ]

  output:
    player-command: '&cThis command is only for players.'
    specify-player: '&cPlease specify a player.'
    wrong-player: '&cCould not find the player called {arg}.'
    not-enough-perms: '&cYou don''t have enough permissions.'

# Adds a static item to players' inventories to open this custom inventory.
# Requires a server reload when changed.
inventory_button:
  enabled: false
  slot: 9
  item:
    material: CHEST
    name: '&6Ekwipunek RPG'
    lore:
      - ''
      - '&eKliknij, aby otworzyć.'
    # custom_model_data: 1
    # skull_texture: eyJ0ZXh0dXJ.....

# This option is only for custom inventories.
script:

  # This script runs before parsing the buttons or title placeholders
  # when the UI is opened. You can also use this to add music.
  # Remove to disable.
  open:
    #- 'send_message{format="Inventory opened!"}'
    - 'play_sound{sound=BLOCK_CHEST_OPEN}'

  close:
    #- 'send_message{format="Inventory closed!"}'
    - 'play_sound{sound=BLOCK_CHEST_CLOSE}'

# Slots in the UI
slots:
  HELMET:
    type: helmet
    material: GOLD_NUGGET
    custom_model_data_string: 'helmet'

    #custom_model_data_float: 0.45        # 1.20.4+ Float custom model data. Either this, or string option above works completely fine
    #custom_model_data: 0                 # 1.14-1.20.3 Custom model data. Prefer using custom_model_data_string on 1.20.4+
    #tooltip: 'myplugin:tooltip_asset_id' # You can edit the slot icon tooltip that way
    #custom_model_data_string: 'test'     # 1.20.4+ string custom model data
    #item_model: 'minecraft:dirt'         # 1.21.2+ item model
    #skull_texture: '......'              # Base-64 skull texture value or URL
    #hide_tooltip: false                  # True or false, for vanilla tooltip
    #unbreakable: false                   # Is it unbreakable or not?
    #fake_attribute: false                # Should MythicLib add a fake attribute modifier? Useful for 1.20 or lower to hide vanilla attributes from the item
    #item_flags: [HIDE_ENCHANTS, ....]    # Add item flags to your items. https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/inventory/ItemFlag.html

    name: "&6Hełm"
    slot: 4
    lore:
      - '&7Obrona głowy, ward albo pierwszy bonus roli.'
      - '&ePrzeciągnij pasujący przedmiot.'
  CHESTPLATE:
    type: chestplate
    material: GOLD_NUGGET
    custom_model_data_string: 'chestplate'
    name: "&6Pancerz"
    slot: 13
    lore:
      - '&7Główna decyzja defensywna postaci.'
      - '&ePrzeciągnij pasujący przedmiot.'
  LEGGINGS:
    type: leggings
    material: GOLD_NUGGET
    custom_model_data_string: 'leggings'
    name: "&6Nogawice"
    slot: 22
    lore:
      - '&7Stabilność, mobilność albo zasoby.'
      - '&ePrzeciągnij pasujący przedmiot.'
  BOOTS:
    type: boots
    material: GOLD_NUGGET
    custom_model_data_string: 'boots'
    name: "&6Buty"
    slot: 31
    lore:
      - '&7Pozycjonowanie, tempo i kara za ciężar.'
      - '&ePrzeciągnij pasujący przedmiot.'
  OFF_HAND:
    type: off_hand
    material: GOLD_NUGGET
    custom_model_data_string: 'off_hand'
    name: "&6Druga Ręka"
    slot: 12
    lore:
      - '&7Tarcza, relikt, fokus albo narzędzie builda.'
      - '&ePrzeciągnij pasujący przedmiot.'

  ELYTRA:
    type: elytra
    material: GOLD_NUGGET
    custom_model_data_string: "elytra"
    name: "&6Slot Pleców"
    restrictions:
      - 'material{materials="ELYTRA"}'
    slot: 14
    lore:
      - '&7Późniejszy slot mobilności lub kosmetyki.'
      - '&7Na teraz akceptuje tylko &bElytrę&7.'
      - '&eNie jest częścią starter power.'

  # Ring slots
  LEFT_RING:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "ring1"
    name: "&6Pierścień Lewy"
    slot: 34
    restrictions:
      - "mmoitemstype{type=RING}"
    lore:
      - '&7Mały slot, duża korekta builda.'
      - '&eTylko itemy typu RING.'
  RIGHT_RING:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "ring2"
    name: "&6Pierścień Prawy"
    slot: 25
    restrictions:
      - "mmoitemstype{type=RING}"
    lore:
      - '&7Drugi pierścień domyka braki postaci.'
      - '&eTylko itemy typu RING.'

  # Extra accessories
  AMULET:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "amulet"
    name: "&6Amulet"
    slot: 7
    restrictions:
      - "mmoitemstype{type=AMULET}"
    lore:
      - '&7Tożsamość, zasoby albo odporności.'
      - '&eTylko itemy typu AMULET.'
  BRACELET:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "bracelet"
    name: "&6Bransoleta"
    slot: 16
    restrictions:
      - "mmoitemstype{type=BRACELET}"
    lore:
      - '&7Utility, tempo albo drobna obrona.'
      - '&eTylko itemy typu BRACELET.'
  GLOVES:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "gloves"
    name: "&6Rękawice"
    slot: 1
    restrictions:
      - "mmoitemstype{type=GLOVES}"
    lore:
      - '&7Precyzja ataku, castu albo pracy broni.'
      - '&eTylko itemy typu GLOVES.'

  # Artifact slots
  ARTIFACT_1:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "artifact1"
    name: "&6Artefakt I"
    slot: 10
    restrictions:
      - "mmoitemstype{type=ARTIFACT}"
      - "unique{enabled=true}"
    lore:
      - '&7Moc specjalna z realną ceną.'
      - '&eTylko unikatowe ARTIFACT.'
  ARTIFACT_2:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "artifact2"
    name: "&6Artefakt II"
    slot: 19
    restrictions:
      - "mmoitemstype{type=ARTIFACT}"
      - "unique{enabled=true}"
    lore:
      - '&7Nie każdy build powinien zapełnić ten slot od razu.'
      - '&eTylko unikatowe ARTIFACT.'
  ARTIFACT_3:
    type: accessory
    material: GOLD_NUGGET
    custom_model_data_string: "artifact3"
    name: "&6Artefakt III"
    slot: 28
    restrictions:
      - "mmoitemstype{type=ARTIFACT}"
      - "unique{enabled=true}"
    lore:
      - '&7Późny slot pod specjalizację, nie starter power.'
      - '&eTylko unikatowe ARTIFACT.'
  FILL:
    type: fill
    material: GOLD_NUGGET
    custom_model_data_string: "fill"
    name: " "
    # Hides tooltip (1.20.5+ only)
    hide_tooltip: true
    slot: -1
    lore: [ ]

# Static items, not slots. Players can click on them but not move them around.
items:
  INFO:
    #item: GOLD_NUGGET
    #custom_model_data_string: "info"
    material: SPRUCE_HANGING_SIGN
    name: "&6Profil Walki"
    slot: 5
    lore:
      - ''
      - '&f ⌛ &7Poziom: &f%mmocore_level%'
      - '&f %mythiclib_space_1%❣%mythiclib_space_1% &7Klasa: &f%mmocore_class%'
      - '&f ☄ &7Złoto: &f%vault_eco_balance%'
      - ''
      - '&7Życie: &f%mythiclib_stat_max_health%'
      - '&7Obrona: &f%mythiclib_stat_defense%'
      - '&7Atak: &f%mythiclib_stat_attack_damage%'
      - ''
      - '&8EQ ma pokazać build, nie tylko miejsce na itemy.'
    on_click:
      - 'command{format="p";from_console=false}'

  CLOSE:
    item: BARRIER
    name: "&cZamknij"
    slot: 35
    lore:
      - "&7Kliknij, aby zamknąć ekwipunek."
    on_click:
      - 'close_inventory{}'
