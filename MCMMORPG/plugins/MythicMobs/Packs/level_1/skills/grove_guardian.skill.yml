# FINAL smierci bossa: kolumna platkow + fontanna swiatla + warstwowy dzwiek (wolane ~onDeath)
level_1_grove_guardian_death_finale:
  Skills:
    - sound{s=entity.warden.death;v=0.5;p=1.3} @PlayersInRadius{r=45}
    - sound{s=block.amethyst_block.resonate;v=1.2;p=0.7} @PlayersInRadius{r=45}
    - particles{particle=totem_of_undying;amount=140;hSpread=0.6;vSpread=0.6;yOffset=1;speed=0.55} @self
    - particles{particle=end_rod;amount=120;hSpread=0.4;vSpread=6;yOffset=3;speed=0.12} @self
    - particles{particle=falling_spore_blossom;amount=90;hSpread=9;vSpread=5;yOffset=6;speed=0} @self
    - particles{particle=block;material=CHERRY_LEAVES;amount=120;hSpread=5;vSpread=4;yOffset=2;speed=0.3} @self
    - delay 20
    - sound{s=entity.player.levelup;v=0.9;p=0.6} @PlayersInRadius{r=45}
    - sound{s=block.bell.use;v=0.8;p=1.2} @PlayersInRadius{r=45}
    - title{title="<green>Gaj odetchnal</green>";subtitle="<gray>Serce Polany bije spokojnie...</gray>";fadein=10;duration=60;fadeout=25} @PlayersInRadius{r=45}
    - particles{particle=glow;amount=80;hSpread=6;vSpread=3;yOffset=2;speed=0.02} @self
    # Reakcja swiata: korupcja NE gasnie (soul_fire znika, sculk cichnie) — playbook:
    # zwyciestwo widac w scenerii, nie tylko w title.
    - delay 30
    - command{c="execute in <caster.l.w> run fill 14 63 -44 44 70 -14 air replace minecraft:soul_fire"}
    - particles{particle=totem_of_undying;amount=90;hSpread=10;vSpread=2;yOffset=2;speed=0.25} @Location{x=24;y=66;z=-24}
    - particles{particle=glow;amount=60;hSpread=12;vSpread=3;yOffset=1;speed=0.03} @Location{x=24;y=65;z=-24}
    - sound{s=block.sculk_shrieker.shriek;v=0.5;p=0.4} @PlayersInRadius{r=50}
    - delay 15
    - sound{s=block.amethyst_block.chime;v=1;p=1.4} @PlayersInRadius{r=50}
    - message{m="<gray>Skażenie na północnym wschodzie przygasa — węzły milkną, ogniska duszy gasną.</gray>"} @PlayersInRadius{r=50}

level_1_corrupted_sprout_thorn_shot:
  Skills:
    - projectile{onTick=[ particles{particle=composter} @origin ];onHit=[ damage{amount=4} @trigger ];velocity=8;hRadius=0.4;vRadius=0.4;maxRange=18} @target
