# Wezly Skazenia — skille. Telegraph grammar jak reszta packa: particle -> pauza -> efekt.
# Licznik: world.level_1_nodes_cleansed (INTEGER, scope=world => per instancja lochu).
# Graceful degradation: gdy wezly nie zostaly zespawnowane, zmienna jest unset i wszystkie
# ?variableInRange sa false => boss zachowuje sie dokladnie jak przed ta zmiana.

# Spawn 3 wezlow. Wolane przez MD (DungeonStart, Faza 3) albo recznie w testach.
# WSPOLRZEDNE MUSZA ZGADZAC SIE z sekcja NODES w _validation/build_level1_grove.js:
#   N1 = jezyk sculku przy arenie (8,65,-16)
#   N2 = krawedz klina NE przy zapadlisku (20,65,-21)
#   N3 = glab klina NE (17,65,-29)
level_1_spawn_corruption_nodes:
  Conditions:
    # radius 200: caster to punkt campu (poludnie mapy), wezly sa na polnocy —
    # guard ma widziec caly loch, zeby nie zdublowac spawnu.
    - mobsinradius{types=level_1_corruption_node;amount=<1;radius=200}
  Skills:
    - setvariable{var=world.level_1_nodes_cleansed;value=0;type=INTEGER}
    - summon{mob=level_1_corruption_node;amount=1;radius=0;noise=0} @Location{x=8.5;y=65;z=-15.5}
    - summon{mob=level_1_corruption_node;amount=1;radius=0;noise=0} @Location{x=20.5;y=65;z=-20.5}
    - summon{mob=level_1_corruption_node;amount=1;radius=0;noise=0} @Location{x=17.5;y=65;z=-28.5}
    - sound{s=block.sculk_shrieker.shriek;v=0.5;p=0.7} @Location{x=8.5;y=65;z=-15.5}

# Aura: prowadzi oko do niewidzialnego moba (cialo = dekoracja z buildu).
level_1_corruption_node_aura:
  Skills:
    - particles{particle=sculk_charge_pop;amount=10;hSpread=0.5;vSpread=1;yOffset=0.5;speed=0.03} @self
    - particles{particle=soul_fire_flame;amount=6;hSpread=0.3;vSpread=1.4;yOffset=0.4;speed=0.015} @self
    - sound{s=block.sculk_sensor.clicking;v=0.35;p=0.6;chance=0.4} @PlayersInRadius{r=14}

# Feedback trafienia: wezel "zyje" i reaguje.
level_1_corruption_node_hurt:
  Skills:
    - sound{s=block.sculk.break;v=0.9;p=0.8} @self
    - particles{particle=block;material=SCULK;amount=18;hSpread=0.4;vSpread=0.6;yOffset=0.5;speed=0.05} @self

# Oczyszczenie: licznik +1, FX "zycie wraca", komunikat postepu 1/3 -> 3/3.
level_1_corruption_node_cleansed:
  Skills:
    # variableadd NIE tworzy zmiennej (zweryfikowane probe'em 2026-07-04) — init konieczny.
    - setvariable{var=world.level_1_nodes_cleansed;value=0;type=INTEGER} ?!variableIsSet{var=world.level_1_nodes_cleansed}
    - variableadd{var=world.level_1_nodes_cleansed;amount=1}
    - sound{s=block.sculk_catalyst.bloom;v=1;p=0.7} @PlayersInRadius{r=30}
    - particles{particle=sculk_soul;amount=40;hSpread=0.6;vSpread=0.8;yOffset=0.6;speed=0.08} @self
    - delay 12
    - sound{s=block.amethyst_block.chime;v=1;p=1.1} @PlayersInRadius{r=30}
    - particles{particle=glow;amount=50;hSpread=1.5;vSpread=1.5;yOffset=1;speed=0.05} @self
    - particles{particle=falling_spore_blossom;amount=30;hSpread=2.5;vSpread=2;yOffset=2.5;speed=0} @self
    - message{m="<green>Węzeł oczyszczony (1/3).</green> <gray>Skażona kora Strażnika słabnie...</gray>"} @PlayersInRadius{r=40} ?variableInRange{var=world.level_1_nodes_cleansed;value=1}
    - message{m="<green>Węzeł oczyszczony (2/3).</green> <gray>Kora Strażnika pęka na oczach...</gray>"} @PlayersInRadius{r=40} ?variableInRange{var=world.level_1_nodes_cleansed;value=2}
    - title{title="<green>Skażenie odcięte</green>";subtitle="<gray>Strażnik Gaju utracił ochronę kory!</gray>";fadein=5;duration=50;fadeout=15} @PlayersInRadius{r=50} ?variableInRange{var=world.level_1_nodes_cleansed;value=>2}
    - sound{s=entity.player.levelup;v=0.7;p=1.3} @PlayersInRadius{r=40} ?variableInRange{var=world.level_1_nodes_cleansed;value=>2}

# --- HARD chase: Skarb Skazenia (wolane z ~onDeath bossa, gate w mob.yml) ---
level_1_hard_chase:
  Skills:
    - delay 60
    - title{title="<light_purple>Skarb Skażenia</light_purple>";subtitle="<gray>Zapadlisko na płn.-wsch. — 60 sekund, nim sculk go wchłonie!</gray>";fadein=5;duration=60;fadeout=15} @PlayersInRadius{r=50}
    - sound{s=block.sculk_catalyst.bloom;v=1;p=0.6} @PlayersInRadius{r=50}
    - summon{mob=level_1_sculk_cache;amount=1;radius=0;noise=0} @Location{x=24.5;y=64;z=-23.5}
    - particles{particle=end_rod;amount=60;hSpread=0.4;vSpread=8;yOffset=4;speed=0.02} @Location{x=24.5;y=65;z=-23.5}

level_1_sculk_cache_aura:
  Skills:
    - particles{particle=glow;amount=8;hSpread=0.4;vSpread=1;yOffset=0.6;speed=0.02} @self
    - particles{particle=sculk_soul;amount=4;hSpread=0.3;vSpread=0.8;yOffset=0.4;speed=0.02} @self
    - sound{s=block.amethyst_block.chime;v=0.3;p=1.6;chance=0.3} @PlayersInRadius{r=20}

# Po 60 s sculk wchlania skarb — spoznienie ma byc odczuwalne, ale fair (title byl).
level_1_sculk_cache_timeout:
  Skills:
    - sound{s=block.sculk.spread;v=1;p=0.5} @PlayersInRadius{r=30}
    - particles{particle=sculk_charge_pop;amount=40;hSpread=0.8;vSpread=1;yOffset=0.5;speed=0.08} @self
    - message{m="<dark_purple>Sculk wchłonął skarb...</dark_purple>"} @PlayersInRadius{r=40}
    - remove @self

level_1_sculk_cache_opened:
  Skills:
    - sound{s=block.vault.open_shutter;v=1;p=1} @PlayersInRadius{r=30}
    - sound{s=entity.player.levelup;v=0.8;p=1.4} @PlayersInRadius{r=30}
    - particles{particle=totem_of_undying;amount=60;hSpread=0.8;vSpread=1;yOffset=0.8;speed=0.3} @self
    - title{title="<gold>Łup Skażenia</gold>";subtitle="<gray>Odłamki klejnotów z serca zapadliska</gray>";fadein=3;duration=40;fadeout=10} @PlayersInRadius{r=30}

# HARD, P2: skazenie odrasta — jeden wezel wraca przy arenie i rytual kory znow
# jest mozliwy (gate <3 w mob.yml). Cooldown ogranicza do rzadkiego wydarzenia.
level_1_grove_guardian_node_regrow:
  Cooldown: 90
  Conditions:
    - variableInRange{var=world.level_1_nodes_cleansed;value=>0}
    - mobsinradius{types=level_1_corruption_node;amount=<1;radius=40}
  Skills:
    - variablesubtract{var=world.level_1_nodes_cleansed;amount=1}
    - sound{s=block.sculk_shrieker.shriek;v=0.9;p=0.8} @PlayersInRadius{r=40}
    - particles{particle=sculk_charge_pop;amount=40;hSpread=1;vSpread=1;speed=0.1} @Location{x=8.5;y=65;z=-15.5}
    - title{title="<dark_purple>Skażenie odrasta!</dark_purple>";subtitle="<gray>Węzeł powrócił na skraju areny...</gray>";fadein=5;duration=40;fadeout=10} @PlayersInRadius{r=40}
    - delay 15
    - summon{mob=level_1_corruption_node;amount=1;radius=0;noise=0} @Location{x=8.5;y=65;z=-15.5}
