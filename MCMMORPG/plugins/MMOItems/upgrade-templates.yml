
# Template ID, only used as reference. This is the
# text you need to enter in the edition GUI in order
# to setup item upgrading for a specific item.
weapon-default:

    # Every time the item is upgraded, its attack damage
    # is increased by 3% (relative to the current value)
    attack-damage: 3%
    
    # Every time it is upgraded, it gets +2% aboslute 
    # critical strike chance (independant of current val.)
    critical-strike-chance: 2
    
    pve-damage: 1%

armor-template-example:
    armor: 3%
    armor-toughness: 2%
    block-rating: 5%
    dodge-rating: 5%
    parry-rating: 5%

foundation-weapon:
    attack-damage: 4%
    weapon-damage: 2%
    critical-strike-chance: 1

foundation-ranged:
    attack-damage: 3%
    projectile-damage: 4%
    critical-strike-power: 2%

foundation-caster:
    attack-damage: 2%
    magic-damage: 4%
    skill-damage: 3%
    max-mana: 2%

foundation-heavy-armor:
    armor: 4%
    block-rating: 5%
    max-health: 2%

foundation-light-armor:
    armor: 3%
    dodge-rating: 5%
    movement-speed: 1%

foundation-robe:
    armor: 2%
    max-mana: 3%
    mana-regeneration: 2%
    magic-damage-reduction: 2%

foundation-shield:
    block-power: 5%
    block-rating: 5%
    armor: 3%

foundation-accessory:
    max-health: 2%
    max-mana: 2%
    cooldown-reduction: 1%
