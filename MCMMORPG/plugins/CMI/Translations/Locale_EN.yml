# Full color code support and some variables
# Keep in mind that variables wont work for some lines, when it will for anothers :)
# Just keep them where there are now and everything will be ok :)
# Some lines can have global variables set. For player who will be effected. In example /heal Zrips then Zrips data will be used
# [serverName] to show server name
# [playerName] to show target player name
# [playerDisplayName] to show target player display name
# [lvl] to show target player level
# [exp] to show target player total exp
# [hp] to show target player health
# [maxHp] to show target player max health
# [hunger] to show target player hunger level
# [gameMode] to show target player gamemode
# [prefix] to show target player prefix if possible
# [suffix] to show target player suffix if possible
# Sender is console or player who performs command. In example Zrips performs /heal Zhax then Zrips data will be used
# [senderName] to show Sender player name
# [senderDisplayName] to show Sender player display name
# [senderLvl] to show Sender player level
# [senderExp] to show Sender player total exp
# [senderHp] to show Sender player health
# [senderMaxHp] to show Sender player max health
# [senderHunger] to show Sender player hunger level
# [senderGameMode] to show Sender player gamemode
# [senderPrefix] to show Sender player prefix if possible
# [senderSuffix] to show Sender player suffix if possible
# Source is player which is being used for extra info. In example Zrips performs /tp Zhax Zrips then Zhax data will be used as its location is being taken for new player location
# [sourceName] to show source player name
# [sourceDisplayName] to show source player display name
# [sourceLvl] to show source player level
# [sourceExp] to show source player total exp
# [sourceHp] to show source player health
# [sourceMaxHp] to show source player max health
# [sourceHunger] to show source player hunger level
# [sourceGameMode] to show source player gamemode
# [sourcePrefix] to show source player prefix if possible
# [sourceSuffix] to show source player suffix if possible
# ***********************************************
# Some lines supports option to send them to custom places, like action bar, title, sub title or even create JSON/clickable messages
# If line starts with !toast! then player will get toast message (advancement popup, only 1.12 and up). Some extra variables can be used to define type and icon. example: !toast! -t:goal -icon:paper Hello world!
# If line starts with !actionbar! then player will get action bar message defined after this variable
# If line starts with !actionbar:[seconds]! then player will get action bar message for defined amount of time
# If line starts with !broadcast! then everyone will receive message. You can add extra !toast! !actionbar! or !title! to send message for everyone to specific place, in example !broadcast!!title!
# If line starts with !customtext:[cTextName]! then custom text will be taken by name provided and shown for player. In case its used after !broadcast! then everyone who is online will get this custom text message
# If line starts with !title! then player will get title message defined after this variable, in addition it can contain !subtitle! which will add subtitle message. Optional time can be defined with !title:4.5! which will keep title message for 4.5 seconds
# If line starts with !bossbar:[name]-[timer]! then player will get bossbar message defined after this variable, in addition you can define how long this message will be visible. You need to define bossbar name which can be anything you want, but lines with same name will override each other to prevent stacking
#
#
#
# ATTENTION! As of 9.0.0.0 CMI version some of the locale lines got moved to CMILib file. This is to centralize some of most used ones across multiple plugins.
# After you update locale in CMILib file perform `/cmil reload` command for changes to take effect

command:
  tfly:
    help:
      explanation:
      - 'Examples:'
      - tfly Zrips 30 - fly mode for the next 30 sec
      - tfly Zrips +30 - adds fly mode for an additional 30 sec
      - tfly Zrips 0 - fly mode until relog
      - tfly Zrips - check if player have tfly mode enabled and until when
    info:
      setTimedFly: '{gcp}You have set {gcs}[playerDisplayName]{gcp} temporary fly
        for the next [time]'
      addTimedFly: '{gcp}You have added an additional [addTime] ([time]) for {gcs}[playerDisplayName]{gcp}'
      takeTimedFly: '{gcp}You have taken [addTime] ([time]) for {gcs}[playerDisplayName]{gcp}'
      setUntilRelogFly: '{gcp}You have set {gcs}[playerDisplayName]{gcp} temporary
        fly until relog.'
      targetTimedEnabled: '{gcp}Your flight was enabled by {gcs}[senderDisplayName]{gcp}
        for the next [time].'
      targetTimedEnabledAdd: '{gcp}Your flight time was increased by [addTime] ([time]).'
      targetTimedEnabledTake: '{gcp}Your flight time was decreased by [addTime] ([time]).'
      targetUntilRelogEnabled: '{gcp}Your flight was enabled by {gcs}[senderDisplayName]{gcp}
        until you relog.'
      setFor: '{gcp}Temporary fly mode enabled for the next [time]'
      setForRelog: '{gcp}Temporary fly mode enabled until relog'
      notSet: '{gcp}Temporary fly mode is not enabled for player'
      willBeDisabled: '{gcp}Fly mode will be disabled in [time]'
      disabled: '{gcp}Temporary fly mode is disabled!'
  tgod:
    help:
      info: Set players temporarily god mode until relog or time end
      args: '[playerName] (timeInSec) (-s)'
      explanation:
      - 'Examples:'
      - tgod Zrips 30 - god mode for the next 30 sec
      - tgod Zrips 0 - god mode until relog
      - tgod Zrips - check how long a player has tgod for, if at all.
    info:
      setTimedGod: '{gcp}You have set {gcs}[playerDisplayName]{gcp} temporary god
        for the next [time]'
      info:
        PurgeNotEnabled: '{gcw}Purge function is not enabled in config file!'
        TeamManagementDisabled: '{gcp}This feature will have limited functionalaty
          while DisableTeamManagement is set to true!'
        NoGameMode: '{gcw}Please use 0/1/2/3 or Survival/Creative/Adventure/Spectator
          or s/c/a/sp!'
        NameChange: '{gcs}[playerDisplayName] {gcp}logged in, also known as: {gcs}[namelist]'
        Cooldowns: '{gcp}This command is on cooldown for another {gcs}[time]'
      setUntilRelogGod: '{gcp}You have set {gcs}[playerDisplayName]{gcp} temporary
        god until relog.'
      targetTimedEnabled: '{gcp}You got temporary god mode enabled by {gcs}[senderDisplayName]{gcp}
        for the next [time].'
      targetUntilRelogEnabled: '{gcp}You got temporary god mode enabled by {gcs}[senderDisplayName]{gcp}
        until you relog'
      setFor: '{gcp}Temporary god mode enabled for the ext [time]'
      setForRelog: '{gcp}Temporary god mode enabled until relog'
      notSet: '{gcp}Temporary god mode is not enabled for player'
      willBeDisabled: '{gcp}God mode will be disabled in [time]'
      disabled: '{gcp}Temporary god mode is disabled!'
  time:
    help:
      info: Controls server time
      args: (time) (world) (alter [value]) (-smooth)
      explanation:
      - 'Example:'
      - /day
      - /night
      - /time 13:00:00
      - /time 1pm
      - /time 13
      - /time 7000ticks
      - /time 1pm Lt_Craft
      - /time 1pm all
      - /time add 0:30
      - /time take 0:30
      - /time freeze
      - /time unfreeze
      - /time realtime
      - /time autorealtime start/stop
    info:
      check: '{gcp}Time: {gcs}[24h] {gcp}or {gcs}[12h] {gcp}or {gcs}[ticks]ticks {gcp}in
        {gcs}[world]'
      info:
        FailedSpawnerMine: '!actionbar!{gcw}Failed to mine spawner. {gcs}[percent]%
          {gcw}drop chance'
        ClickSpawner: '!actionbar!{gcs}[percent]% {gcp}Drop chance'
        Elevator:
          created: '{gcp}Created elevator sign'
        CantPlaceSpawner: '{gcp}Can''t place spawner so close to another spawner ({gcs}[range]{gcp})'
        ChunksLoading: '{gcp}World chunk data is still being loaded. Please wait a
          bit and try again.'
        CantUseNonEncrypted: '!actionbar!{gcw}Commands on this item are not encrypted.
          Can''t use them!'
      frozen: ' {gcn}(-)'
      frozenTime: '{gcp}Frozen time'
      real: ' {gcs}(+)'
      realTime: '{gcp}Automatic real time'
      autorealstart: '{gcp}Automatic time adjustment for {gcs}[world] {gcp}started'
      autorealstop: '{gcp}Automatic time adjustment for {gcs}[world] {gcp}stopped'
      gotfrozen: '{gcs}[world] {gcp}time have has been frozen'
      gotunfrozen: '{gcs}[world] {gcp}time have has been unfrozen'
      cantset: '{gcp}Can''t set time to this value'
      setto: '{gcp}Time set to {gcs}[24h] {gcp}or {gcs}[12h] {gcp}or {gcs}[ticks]ticks
        {gcp}for {gcs}[world]'
  titlemsg:
    help:
      info: Sends title message to player
      args: "[playerName/all] [title \n subtitle] (-in:[ticks]) (-out:[ticks]) (-keep:[ticks])"
    info:
      message: '&f[message]'
      info:
        CantTeleportDistance: '{gcp}Sorry you cant teleport over {gcs}[amount] {gcp}blocks
          away!'
  toast:
    help:
      info: Sends toast message to player
      args: '[playerName/all] (-t:[advType]) (-icon:[material]) [message]'
    info:
      message: '&f[message]'
      info:
        sleepersRequired: '!actionbar!{gcs}[sleeping] {gcp}of {gcs}[required] {gcp}sleeping
          from required for night time speedup'
  top:
    help:
      info: Teleport to highest point at your location
      args: '[playerName] (-s)'
  tp:
    help:
      info: Teleports to player's location
      args: '[playerName] (playerName)'
    info:
      feedback: '{gcp}You have been teleported to {gcp}[sourceDisplayName] {gcp}location.'
      info:
        mapLimit: '{gcw}Cant go beyond 30 000 000 blocks'
        startedEditingPainting: '{gcp}You started editing painting. Click any other
          block to cancel.'
        canceledEditingPainting: '{gcp}You canceled painting editing mode'
        changedPainting: '!actionbar!{gcp}Changed painting to {gcs}[name] {gcp}with
          id of {gcs}[id]'
        noSpam: '!title!{gcw}No spamming!'
        noCmdSpam: '!title!{gcw}No command spamming!'
        spamConsoleInform: '{gcw}Player ({gcs}[playerName]{gcw}) triggered ({gcs}[rules]{gcw})
          chat filter with:&r [message]'
      bad:
        msg: '{gcw}Teleport location is unsafe. {gcs}[reason]'
        extraMsg: '{gcp}Use {gcs}/tpbypass {gcp}to bypass this. You have {gcs}[time]'
        badfloor: '{gcw}Bad floor ({gcs}[material]{gcw})'
        void: '{gcw}Void'
        fall: '{gcw}Fall ({gcs}[distance]{gcw})'
        suffocation: '{gcw}Suffocation'
        unknown: '{gcw}Unknown'
        plugin: '{gcw}3rd party plugin'
      notAllowed: '{gcw}Can''t teleport to this player'
      prevented: '{gcw}Teleportation has been prevented by another plugin'
  tpa:
    help:
      info: Ask the player if you can teleport to them
      args: '[playerName] (playerName) (-c)'
    info:
      requestSent: '{gcp}Request sent to {gcs}[playerDisplayName]'
      info:
        deathlocation: '{gcp}You died at x:{gcs}[x]{gcp}, y:{gcs}[y]{gcp}, z:{gcs}[z]{gcp}
          in {gcs}[world]'
        book:
          exploit: '{gcw}You cant create book with more than [amount] pages'
        combat:
          CostToOpen: '!actionbar!{gcp}Charged for opening: [amount]'
          CantUseShulkerBox: '{gcw}Can''t use shulker box while you are in combat
            with player. Wait: [time]'
      gotRequest: '{gcs}[senderDisplayName] {gcp}requests teleportation to you!'
      time: '{gcp}You have {gcs}[time]{gcp}to accept this request'
      canceled: '{gcp}Teleportation request has been cancelled'
      # This line cant contain anything else then default variables ([message][cancelButton]), you can switch them around to your liking tho
      senderFeedbackMessageFormat: '[message][cancelButton]'
      alreadyRequesting: '{gcp}You are already requesting that {gcs}[playerDisplayName]
        {gcp}accepts your teleportation request'
      banned: '{gcp}You can''t send a teleportation request to {gcs}[playerDisplayName]
        {gcp}for the next {gcs}[time]'
  tpaall:
    help:
      info: Ask all online players to teleport to your location
      args: ''
    info:
      requestSent: '{gcp}Request sent to all players'
      info:
        noSchedule: '{gcw}Schedule by this name is not found'
  tpaccept:
    help:
      info: Accept teleport request
      args: (playerName)
    info:
      noRequest: '{gcp}There is no teleport requests'
      info:
        totem:
          cantConsume: '{gcp}Totem usage was denied due to its cooldown time'
        InventorySave:
          info: '{gcp}Info: {gcs}[playerDisplayName]'
      NotOnline: '{gcp}Player is no longer online'
      accepted: '{gcs}[playerDisplayName] {gcp}accepted request'
      youAccepted: '{gcp}Teleportation accepted'
  tpahere:
    help:
      info: Asks player to accept teleportation to your location
      args: '[playerName] (playerName) (-c)'
    info:
      requestSent: '{gcp}Request sent to {gcs}[playerDisplayName]'
      gotRequest: '{gcs}[senderDisplayName] {gcp}requests teleportation to them!'
      accept: '{gcu}Click to accept teleportation request!'
      info:
        InventorySave:
          TopLine: '{gcp}----------- {gcs}[playerDisplayName] saved inventory {gcp}-----------'
  tpall:
    help:
      info: Teleports all online players to location
      args: (playerName)
    info:
      feedback: '{gcp}You have been teleported ({gcs}[world],[x],[y],[z]{gcp}) to
        {gcs}[playerDisplayName] {gcp}location.'
      info:
        InventorySave:
          KillerSymbol: '{gcw} ☠'
  tpallworld:
    help:
      info: Teleports ALL players from specific world
      args: '[worldName] (worldName;x;y;z(;yaw;pitch)) (-a)'
      explanation:
      - -a variable will teleport everyone who are in no longer existing world to
        target location
    info:
      started: '{gcp}Teleportations started!'
      info:
        InventorySave:
          Restored: '{gcp}You have restored {gcs}[sourcename] {gcp}inventory for {gcs}[targetname]
            {gcp}user.'
          GotRestored: '{gcp}Your inventory was restored from {gcs}[sourcename] {gcp}saved
            inventory on {gcs}[time]'
          LoadForSelf: '{gcp}Load this inventory for your self'
      current: '{gcp}Currently teleported {gcs}[amount] {gcp}and {gcs}[files] {gcp}checked
        files'
      total: '{gcp}Teleported a total of {gcs}[amount] {gcp}out of the {gcs}[files]
        {gcp}users checked'
      WorldNotFound: '{gcp}World by given {gcs}[name] {gcp}name is not loaded. Make
        sure its correct one. We will use as it is.'
  tpbypass:
    help:
      info: Bypass teleportation to unsafe location
      args: (playername)
    info:
      noSavedTp: '{gcw}There is no saved bad teleport locations'
      info:
        InventorySave:
          NextInventory: '{gcp}Next inventory'
      feedback: '{gcp}Teleported to unsafe location'
  tpdeny:
    help:
      info: Deny teleport request
      args: (playerName)
    info:
      noRequest: '{gcp}You have no active teleportation requests!'
      info:
        vanishSymbolOn: '{gcs}[{gcn}H{gcs}]&r'
        vanishSymbolOff: ''
      youDenied: '{gcp}Your teleportation request was denied!'
      denied: '{gcs}[senderDisplayName] {gcp}denied your request.'
  tphere:
    help:
      info: Teleports player to your location
      args: '[playerName] (playerName) (-s)'
    info:
      feedback:
        offline: '{gcp}You have set ({gcs}[world],[x],[y],[z]{gcp}) spawn location
          for {gcs}[playerDisplayName]{gcp}.'
        online: '{gcp}You have teleported {gcs}[playerDisplayName] {gcp}to your location'
        player: '{gcp}You got teleported to {gcs}[sourceDisplayName] {gcp}location'
      info:
        decoratedpotinfo: '!actionbar!{gcp}Contents: {gcs}[items]'
        pvp:
          noGodDamage: '!actionbar!{gcw}You can''t damage players while being immortal'
        pve:
          noGodDamage: '!actionbar!{gcw}You can''t damage mobs while being immortal'
      notAllowed: '{gcp}Can''t teleport this player'
  tpo:
    help:
      info: Teleports to player's location by force
      args: '[playerName] (playerName)'
  tpohere:
    help:
      info: Teleports player to your location by force
      args: '[playerName] (playerName)'
  tpopos:
    help:
      info: Teleports to location by force
      args: (-p:playerName) [x] [y] [z] (world) (pitch) (yaw) (-rng:[range])
    info:
      feedback: '{gcp}You have been teleported ({gcs}[world],[x],[y],[z]{gcp}).'
      info:
        IncorrectColor: '{gcw}Color defined incorrectly!'
        IncorrectFile: '{gcw}File name defined incorrectly!'
      feedbackOther: '{gcs}[playerDisplayName] {gcp}have been teleported ({gcs}[world],[x],[y],[z]{gcp}).'
  tppos:
    help:
      info: Teleports to location
      args: (-p:playerName) [x] [y] [z] (world) (pitch) (yaw) (-rng:[range])
    info:
      feedback: '{gcp}You have been teleported ({gcs}[world],[x],[y],[z]{gcp}).'
      info:
        time:
          minutes: '{gcn}[m]{gcn}m '
          seconds: '{gcn}[s]{gcn}s'
      feedbackOther: '{gcs}[playerDisplayName] {gcp}have been teleported ({gcs}[world],[x],[y],[z]{gcp}).'
  tps:
    help:
      info: Check servers tps status
      args: (-spikes)
    info:
      tps: '{gcp}TPS: '
      dialog:
        line: Line [line]
      # Custom tps range can be defined and you can have as many of them as you want
      tpsList: '{gcs}[3] [10] [30] [60] [600]'
      explanation: '{gcp}One block {gcs}60 {gcp}seconds. Max {gcs}600 {gcp}seconds'
      warp:
        list: '{gcs}[pos]{gcp}. {gcs}[warpName] {gcn}- {gcs}[worldName] ([x]:[y]:[z])'
      minMax: '{gcp}Max: {gcs}[max] {gcp}Min: {gcs}[min]'
      hover:
      - '[tpscolor][tps]'
      - '{gcs}[time]'
      afk:
        'off': '{gcs}Playing'
  tree:
    help:
      info: Spawn tree where you are looking
      args: (TreeType) (-p:[playerName])
    info:
      feedback: '{gcs}[tree] {gcp}spawned.'
      BossBar:
        playerhpBar: '{gcs}%cmi_user_display_name% {gcs}[current]{gcs}/{gcs}[max]
          {gcs}({gcw}-[damage]{gcs})'
      cantSpawn: '{gcw}Cant spawn ({gcs}[tree]{gcw}) on this block.'
      Potion:
        Effects: '{gcp}Potion effects'
  trim:
    help:
      info: Modify trim on armor
      args: (playerName) (-s) (clear)
    info:
      title: '{gcp}Modify trim on armor'
      Information:
        Hunger: '{gcp}Hunger: {gcs}[Hunger]'
  unban:
    help:
      info: Unban player or ip
      args: '[playerName/ip] (-s)'
    info:
      unBaned: '!broadcast!{gcs}[playerDisplayName] {gcp}unbanned'
      Information:
        NotEnoughExp: '{gcp}Not enough exp: {gcs}[Exp]'
        NotEnoughExpNeed: '{gcp}Not enough exp: {gcs}[Exp]/[need]'
      unBanedSilent: '&7[&8Silent&7]{gcs}[playerDisplayName] {gcp}unbanned'
      notBanned: '{gcs}[playerDisplayName] {gcp}not banned'
  unbreakable:
    help:
      info: Makes item unbreakable
      args: (playerName) (true/false) (-o)
    info:
      feedback: '{gcp}You made item [state] {gcp}for {gcs}[playerDisplayName]{gcp}.'
      Information:
        Group: '{gcp}Group: {gcs}[group]'
      breakable: '{gcd}breakable'
      unbreakable: '{gcu}unbreakable'
      econ:
        commandCost: '{gcp}This command cost is {gcs}[cost] {gcp}repeat it or click
          here to confirm'
  uncondense:
    help:
      info: Uncondense items into smaller parts
      args: (itemName) (playerName) (-s)
    info:
      converted: '{gcp}Converted {gcs}[blocks] {gcp}blocks into {gcs}[items] {gcp}items'
      Elytra:
        SpeedSuperBoost: ' {gcn}+ '
      nothing: '{gcw}There is nothing in your inventory that can be uncondensed.'
  unjail:
    help:
      info: Release player from jail
      args: '[playerName] (-s)'
    info:
      notInJail: '{gcw}Target player is not in jail'
      NetherPortal:
        ToWide: '{gcw}Portal is to wide, max width is {gcs}[max]{gcw}!'
        Creation: '!actionbar!{gcp}Created [height]x[width] nether portal!'
      unjailed: '{gcp}You have released {gcs}[playerDisplayName] {gcp}from jail'
      unjailedTarget: '{gcp}You have been released from jail!'
  unloadchunks:
    help:
      info: Unloads chunks from server memory
      args: (-f)
      explanation:
      - -f variable will force for all chunks to be unloaded in one go.
    info:
      removed: '{gcp}Removed -{gcs}[list]'
      Chat:
        shoutPrefix: '{gcn}[S]&r'
        LocalNoOne: '!actionbar!{gcw}Nobody hear you, write ! before message for global
          chat'
      startScanning: '{gcp}Found &6[amount] {gcp}chunks to unload. Starting!'
      InfoShow: '{gcp}TPS: {gcs}[tps] {gcp}Left {gcs}[left] {gcp}({gcs}[min]m:[sec]s{gcp})
        Speed: {gcs}[speed] {gcp}Unloaded: {gcs}[found]'
      Finished: '{gcp}Finished!!! Unloaded: {gcs}[amount] {gcp}chunks! In {gcs}[minutes]
        {gcp}min {gcs}[seconds] {gcp}sec.'
  unmute:
    help:
      info: Unmute player
      args: '[playerName] (-s)'
    info:
      notMuted: '{gcp}Player is not muted'
      Chat:
        staffHover: '{gcp}Sent time: {gcs}%server_time_hh:mm:ss%'
        helpopHover: '{gcp}Sent time: {gcs}%server_time_hh:mm:ss%'
      unmuted: '{gcp}Player can talk now'
      unmutedTarget: '{gcp}You can talk now'
  unmutechat:
    help:
      info: Unmute public chat
      args: (-s)
    info:
      unmuted: '{gcp}Unmuted public chat'
      Chat:
        itemAmount: ' x[amount]'
  usermeta:
    help:
      info: Manage players meta data
      args: '[playerName] [add/remove/clear/list/increment] (key) (value) (-s)'
      explanation:
      - Any set meta can be displayed with %cmi_user_meta_[key]% placeholder around
        plugin
    info:
      added: '{gcp}Added meta for {gcs}[playerDisplayName] {gcp}with key as {gcs}[key]
        {gcp}and value as {gcs}[value]'
      cleared: '{gcp}Cleared meta from {gcs}[playerDisplayName]'
      command:
        help:
          output:
            cmdFormat: '{gcp}/[command]{gcn}[arguments]'
            helpPageDescription: '{gcs}* [description]'
      removed: '{gcp}Removed {gcs}[key] {gcp}meta from {gcs}[playerDisplayName]'
      changed: '{gcp}Changed {gcs}[key] {gcp}meta from {gcs}[oldValue] {gcp}to new
        value of {gcs}[newValue]'
      ls: '{gcs}[key]{gcp}: [value]'
  help:
    output:
      usage: '{gcp}Usage: {gcs}%usage%'
      cmdInfoFormat: '{gcp}[command] {gcp}- {gcs}[description]'
      explanation: '{gcs} * [explanation]'
      title: '{gcs}------ ======= {gcp}Help {gcs}======= ------'
  util:
    help:
      info: Administration tools
      args: (removeseats/testtarget/convertitems)
    info:
      removedSits: '{gcp}Removed {gcs}[count] {gcp}empty sits from all worlds.'
  nocmd:
    help:
      info: '{gcp}Shows all available commands'
      args: ''
  actionbarmsg:
    help:
      info: Sends action bar message to player
      args: '[playerName/all] (-s:[seconds]) [message]'
    info:
      message: '[message]'
  vanish:
    help:
      info: Vanish player
      args: (playerName/list) (on/off) (-s)
    info:
      vanished: '{gcp}You have vanished'
  afk:
    help:
      info: Toggle afk mode. Reason could be provided
      args: (-p:playerName) (reason) (-s)
    info:
      # This only determines message in title message and not message shown in chat. For chat message check config.yml file
      afkTitle: '{gcp}You are now AFK'
      afkSubTitle:
      - '{gcu}Don''t eat to much cookies!'
      - '{gcu}Nice day for fishing'
      - '{gcu}Afk, again?'
      - '{gcu}Where are you?'
  vanishedit:
    help:
      info: Edit vanish mode for player
      args: (playerName) (action) (true/false)
    info:
      isVanished: '&eVanished'
  afkcheck:
    help:
      info: Check players afk status
      args: '[playerName/all]'
