creator_v2_open_main:
 Conditions:
 Comparator{value1="%mmocore_class%";operator="=";value2="Origin"} true
 Mechanics:
 variable{action="set";variable="creator_intro_seen";value="true";profile=true} @Self
 variable{action="set";variable="character_stage";value="CREATOR_MAIN";profile=true} @Self
 openmenu{name="foundation_creator_intro";permission=false} @Self

creator_v2_reset_selection:
 Conditions: []
 Mechanics:
 variable{action="set";variable="pending_race_id";value="UNSET";profile=true} @Self
 variable{action="set";variable="pending_class_id";value="UNSET";profile=true} @Self
 variable{action="set";variable="recommended_class_id";value="UNSET";profile=true} @Self
 variable{action="set";variable="character_stage";value="CREATOR_MAIN";profile=true} @Self
 message{m="<yellow>Wyczyszczono wybor. Zacznij jeszcze raz na glownym ekranie kreatora."} @Self
 playsound{sound="minecraft:ui.button.click";volume=1;pitch=0.8} @Self
 openmenu{name="foundation_creator_intro";permission=false} @Self

