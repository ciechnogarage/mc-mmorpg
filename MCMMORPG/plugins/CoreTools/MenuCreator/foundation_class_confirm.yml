foundation_class_confirm:
  permission: ''
  bottom_inventory: false
  name: '<dark_gray>Księga Rodu - Potwierdzenie'
  size: 3
  fill_material: 'BLACK_STAINED_GLASS_PANE'
  enable_animation: false

  buttons:
    border:
      location: top
      slots: [ 0,1,2,3,5,6,7,8,9,17,18,19,20,21,23,24,25,26 ]
      source: vanilla
      material: BLACK_STAINED_GLASS_PANE
      name: ' '

    summary:
      location: top
      slots: [ 4 ]
      source: vanilla
      material: WRITABLE_BOOK
      name: '<gold><bold>Ostatni podpis'
      lore:
        - '<gray>Rodowód: <white>{pending_race_id}'
        - '<gray>Archetyp: <white>{pending_class_id}'
        - ''
        - '<yellow>Po potwierdzeniu zapiszesz tożsamość'
        - '<yellow>i wejdziesz do Galerii Mentorów.'
        - ''
        - '<dark_gray>Zmiana później wymaga osobnej'
        - '<dark_gray>polityki respec, nie przypadkowego kliknięcia.'

    confirm:
      location: top
      slots: [ 12 ]
      source: vanilla
      material: EMERALD
      name: '<green><bold>Potwierdź postać'
      lore:
        - '<gray>Zapisz pieczęć i archetyp.'
        - '<gray>Nie rozdaje gearu z powietrza.'
      left_click:
        Scripts:
          - creator_confirm_character
      click:
        Scripts:
          - creator_confirm_character

    back:
      location: top
      slots: [ 14 ]
      source: vanilla
      material: REDSTONE
      name: '<red><bold>Wróć do archetypu'
      lore:
        - '<gray>Cofnij tylko wybór klasy.'
        - '<gray>Rodowód zostaje jako pending.'
      left_click:
        Scripts:
          - creator_cancel_class_choice
      click:
        Scripts:
          - creator_cancel_class_choice

    close:
      location: top
      slots: [ 22 ]
      source: vanilla
      material: BARRIER
      name: '<red><bold>Zamknij'
      lore:
        - '<gray>Zamknij bez finalizacji.'
      left_click:
        Scripts:
          - creator_close_menu
      click:
        Scripts:
          - creator_close_menu
