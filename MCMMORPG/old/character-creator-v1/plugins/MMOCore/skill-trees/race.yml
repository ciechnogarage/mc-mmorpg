type: CUSTOM
lore:
  - '&dPlaceholder race buffs, gated by LuckPerms race permission.'
  - '&7See docs/character-sector-contract.md Race Passive Matrix for the canon design this stands in for.'
max-point-spent: 10

icon:
  material: PLAYER_HEAD
  item_flags: [HIDE_ATTRIBUTES]

# Every node below is a PLACEHOLDER stat buff gated by permission-required
# on the LuckPerms permission granted at character finalize (race.<id>).
# Values are not balanced; swap for the real Race Passive Matrix triggers
# (economy/combat event hooks) when those are implemented.

