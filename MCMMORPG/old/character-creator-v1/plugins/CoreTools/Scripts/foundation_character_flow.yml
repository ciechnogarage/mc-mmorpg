    - Comparator{value1="{pending_race_id}";operator="=";value2="UNSET"} falseElse creator_pick_race_first
  Mechanics:
    - Script{script=creator_open_class_spotlight_marksman} @Self

creator_select_class_mage:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="UNSET"} falseElse creator_pick_race_first
  Mechanics:
    - Script{script=creator_open_class_spotlight_mage} @Self

creator_select_class_paladin:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="UNSET"} falseElse creator_pick_race_first
  Mechanics:
    - Script{script=creator_open_class_spotlight_paladin} @Self

creator_confirm_character:
  Conditions:
    - Comparator{value1="%mmocore_class%";operator="=";value2="Origin"} true
  Mechanics:
    - Script{script=creator_finalize_character} @Self

creator_cancel_class_choice:
  Conditions:
    - Comparator{value1="%mmocore_class%";operator="=";value2="Origin"} true
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="UNSET";profile=true} @Self
    - variable{action="set";variable="class_id";value="UNSET";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_READY";profile=true} @Self
    - message{m="<yellow>Przysięga cofnięta. Wybierz archetyp ponownie."} @Self
    - playsound{sound="minecraft:ui.button.click";volume=1;pitch=0.8} @Self
    - openmenu{name="foundation_class_selector";permission=false} @Self

creator_confirm_warrior:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="WARRIOR";profile=true} @Self
    - variable{action="set";variable="class_id";value="WARRIOR";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_SELECTED";profile=true} @Self
    - command{c="mmocore admin force-class {caster_name} warrior";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_confirm_rogue:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="ROGUE";profile=true} @Self
    - variable{action="set";variable="class_id";value="ROGUE";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_SELECTED";profile=true} @Self
    - command{c="mmocore admin force-class {caster_name} rogue";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_confirm_marksman:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="MARKSMAN";profile=true} @Self
    - variable{action="set";variable="class_id";value="MARKSMAN";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_SELECTED";profile=true} @Self
    - command{c="mmocore admin force-class {caster_name} marksman";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_confirm_mage:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="MAGE";profile=true} @Self
    - variable{action="set";variable="class_id";value="MAGE";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_SELECTED";profile=true} @Self
    - command{c="mmocore admin force-class {caster_name} mage";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_confirm_paladin:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="pending_class_id";value="PALADIN";profile=true} @Self
    - variable{action="set";variable="class_id";value="PALADIN";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CLASS_SELECTED";profile=true} @Self
    - command{c="mmocore admin force-class {caster_name} paladin";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_character:
  Conditions:
    - Comparator{value1="%mmocore_class%";operator="=";value2="Origin"} falseElse creator_already_finalized
    - Comparator{value1="{pending_race_id}";operator="=";value2="UNSET"} falseElse creator_finalize_check_class
  Mechanics:
    - Script{script=creator_pick_race_first} @Self

creator_finalize_check_class:
  Conditions:
    - Comparator{value1="{pending_class_id}";operator="=";value2="UNSET"} falseElse creator_finalize_race_dispatch
  Mechanics:
    - Script{script=creator_pick_class_first} @Self

creator_already_finalized:
  Conditions: []
  Mechanics:
    - message{m="<red>Ta postać ma już zapisaną pieczęć i przysięgę. Nowy los wymaga nowego profilu."} @Self
    - playsound{sound="minecraft:block.note_block.bass";volume=1;pitch=0.6} @Self

creator_pick_race_first:
  Conditions: []
  Mechanics:
    - message{m="<red>Najpierw wybierz pieczęć rodu. Bez pochodzenia nie ma przysięgi."} @Self
    - playsound{sound="minecraft:block.note_block.bass";volume=1;pitch=0.8} @Self

creator_pick_class_first:
  Conditions: []
  Mechanics:
    - message{m="<red>Najpierw wybierz archetyp. Bez roli nie ma pierwszego kontraktu."} @Self
    - playsound{sound="minecraft:block.note_block.bass";volume=1;pitch=0.8} @Self

creator_finalize_race_dispatch:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="CZLOWIEK"} falseElse creator_finalize_race_ork
  Mechanics:
    - variable{action="set";variable="race_id";value="CZLOWIEK";profile=true} @Self
    - Script{script=creator_finalize_class_dispatch} @Self

creator_finalize_race_ork:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="ORK"} falseElse creator_finalize_race_elf
  Mechanics:
    - variable{action="set";variable="race_id";value="ORK";profile=true} @Self
    - Script{script=creator_finalize_class_dispatch} @Self

creator_finalize_race_elf:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="ELF"} falseElse creator_finalize_race_krasnolud
  Mechanics:
    - variable{action="set";variable="race_id";value="ELF";profile=true} @Self
    - Script{script=creator_finalize_class_dispatch} @Self

creator_finalize_race_krasnolud:
  Conditions:
    - Comparator{value1="{pending_race_id}";operator="=";value2="KRASNOLUD"} falseElse creator_finalize_race_nieumarly
  Mechanics:
    - variable{action="set";variable="race_id";value="KRASNOLUD";profile=true} @Self
    - Script{script=creator_finalize_class_dispatch} @Self

creator_finalize_race_nieumarly:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="race_id";value="NIEUMARLY";profile=true} @Self
    - Script{script=creator_finalize_class_dispatch} @Self

creator_finalize_class_dispatch:
  Conditions:
    - Comparator{value1="{pending_class_id}";operator="=";value2="WARRIOR"} falseElse creator_finalize_class_rogue
  Mechanics:
    - command{c="mmocore admin force-class {caster_name} warrior";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_class_rogue:
  Conditions:
    - Comparator{value1="{pending_class_id}";operator="=";value2="ROGUE"} falseElse creator_finalize_class_marksman
  Mechanics:
    - command{c="mmocore admin force-class {caster_name} rogue";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_class_marksman:
  Conditions:
    - Comparator{value1="{pending_class_id}";operator="=";value2="MARKSMAN"} falseElse creator_finalize_class_mage
  Mechanics:
    - command{c="mmocore admin force-class {caster_name} marksman";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_class_mage:
  Conditions:
    - Comparator{value1="{pending_class_id}";operator="=";value2="MAGE"} falseElse creator_finalize_class_paladin
  Mechanics:
    - command{c="mmocore admin force-class {caster_name} mage";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_class_paladin:
  Conditions: []
  Mechanics:
    - command{c="mmocore admin force-class {caster_name} paladin";runas=console} @Self
    - Script{script=creator_finalize_common} @Self

creator_finalize_common:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="race_selected";value="true";profile=true} @Self
    - variable{action="set";variable="class_selected";value="true";profile=true} @Self
    - variable{action="set";variable="character_stage";value="CITY_ONBOARDING";profile=true} @Self
    - variable{action="set";variable="pending_race_id";value="UNSET";profile=true} @Self
    - variable{action="set";variable="pending_class_id";value="UNSET";profile=true} @Self
    - 'message{m="<green>Pieczęć i przysięga zapisane. Zanim wejdziesz do miasta, przejdź przez Galerię Mentorów i zobacz live loop klasy, słabość i subclass path."} @Self'
    - message{m="<dark_aqua>Komnata Mentorów &8> &fTo jest twój pierwszy payoff po wyborze. Anchor set czeka później u Kwatermistrza, nie w próżni po kliknięciu."} @Self
    - playsound{sound="minecraft:entity.player.levelup";volume=1;pitch=1.2} @Self
    - openmenu{name="foundation_class_mentor_roster";permission=false} @Self

npc_quartermaster_claim_warrior:
  Conditions:
    - Comparator{value1="{first_weapon_claimed}";operator="=";value2="false"} falseElse npc_quartermaster_already_claimed
    - Comparator{value1="%mmocore_class%";operator="=";value2="warrior"} falseElse npc_quartermaster_wrong_class
  Mechanics:
    - command{c="mi give SWORD WOJOWNIK_INITIATE_BLADE {caster_name} 1";runas=console} @Self
    - command{c="mi give SHIELD WOJOWNIK_INITIATE_SHIELD {caster_name} 1";runas=console} @Self
    - command{c="mi give ARMOR WOJOWNIK_INITIATE_CHESTPLATE {caster_name} 1";runas=console} @Self
    - command{c="mi give RING PIERSCIEN_ZELAZNEJ_WYPRAWY {caster_name} 1";runas=console} @Self
    - Script{script=npc_quartermaster_claim_common} @Self

npc_quartermaster_claim_rogue:
  Conditions:
    - Comparator{value1="{first_weapon_claimed}";operator="=";value2="false"} falseElse npc_quartermaster_already_claimed
    - Comparator{value1="%mmocore_class%";operator="=";value2="rogue"} falseElse npc_quartermaster_wrong_class
  Mechanics:
    - command{c="mi give DAGGER LOTRZYK_INITIATE_DAGGER {caster_name} 1";runas=console} @Self
    - command{c="mi give ARMOR LOTRZYK_INITIATE_CHESTPIECE {caster_name} 1";runas=console} @Self
    - command{c="mi give RING PIERSCIEN_RUNICZNEJ_WYPRAWY {caster_name} 1";runas=console} @Self
    - Script{script=npc_quartermaster_claim_common} @Self

npc_quartermaster_claim_marksman:
  Conditions:
    - Comparator{value1="{first_weapon_claimed}";operator="=";value2="false"} falseElse npc_quartermaster_already_claimed
    - Comparator{value1="%mmocore_class%";operator="=";value2="marksman"} falseElse npc_quartermaster_wrong_class
  Mechanics:
    - command{c="mi give BOW LOWCA_INITIATE_BOW {caster_name} 1";runas=console} @Self
    - command{c="mi give ARMOR LOWCA_INITIATE_CHESTPIECE {caster_name} 1";runas=console} @Self
    - command{c="mi give OFF_CATALYST LOWCA_INITIATE_SCOPE {caster_name} 1";runas=console} @Self
    - Script{script=npc_quartermaster_claim_common} @Self

npc_quartermaster_claim_mage:
  Conditions:
    - Comparator{value1="{first_weapon_claimed}";operator="=";value2="false"} falseElse npc_quartermaster_already_claimed
    - Comparator{value1="%mmocore_class%";operator="=";value2="mage"} falseElse npc_quartermaster_wrong_class
  Mechanics:
    - command{c="mi give WAND MAG_INITIATE_WAND {caster_name} 1";runas=console} @Self
    - command{c="mi give ARMOR MAG_INITIATE_ROBE {caster_name} 1";runas=console} @Self
    - command{c="mi give OFF_CATALYST MAG_INITIATE_FOCUS {caster_name} 1";runas=console} @Self
    - Script{script=npc_quartermaster_claim_common} @Self

npc_quartermaster_claim_paladin:
  Conditions:
    - Comparator{value1="{first_weapon_claimed}";operator="=";value2="false"} falseElse npc_quartermaster_already_claimed
    - Comparator{value1="%mmocore_class%";operator="=";value2="paladin"} falseElse npc_quartermaster_wrong_class
  Mechanics:
    - command{c="mi give STAFF AKOLITA_INITIATE_STAFF {caster_name} 1";runas=console} @Self
    - command{c="mi give ARMOR AKOLITA_INITIATE_VESTMENT {caster_name} 1";runas=console} @Self
    - command{c="mi give OFF_CATALYST AKOLITA_INITIATE_RELIC {caster_name} 1";runas=console} @Self
    - Script{script=npc_quartermaster_claim_common} @Self

npc_quartermaster_claim_common:
  Conditions: []
  Mechanics:
    - variable{action="set";variable="first_weapon_claimed";value="true";profile=true} @Self
    - variable{action="set";variable="first_contract_completed";value="true";profile=true} @Self
    - Script{script=npc_quartermaster_race_bonus_dispatch} @Self
    - message{m="<green>Kwatermistrz &8> &fPierwszy zestaw wydany przez miasto. To twój anchor loadout. Następne ulepszenia zdobywasz przez forge, profesje i łup."} @Self
    - playsound{sound="minecraft:entity.villager.yes";volume=1;pitch=1.0} @Self
    - openmenu{name="foundation_city_roster";permission=false} @Self

npc_quartermaster_race_bonus_dispatch:
  Conditions:
    - Comparator{value1="{race_id}";operator="=";value2="CZLOWIEK"} falseElse npc_quartermaster_race_bonus_ork
  Mechanics:
    - command{c="mi give MATERIAL SILVER_COIN {caster_name} 3";runas=console} @Self
    - message{m="<white>Pieczęć Człowieka &8> &fMiasto dorzuca kontraktowy start: 3 Srebrne Monety na pierwszą drogę."} @Self

npc_quartermaster_race_bonus_ork:
  Conditions:
    - Comparator{value1="{race_id}";operator="=";value2="ORK"} falseElse npc_quartermaster_race_bonus_elf
  Mechanics:
    - command{c="mi give MATERIAL MALA_KOSC {caster_name} 2";runas=console} @Self
    - message{m="<red>Pieczęć Orka &8> &fDostajesz surowy bonus wyprawowy: 2 Małe Kości pod pierwsze brutalne ulepszenia."} @Self

npc_quartermaster_race_bonus_elf:
  Conditions:
    - Comparator{value1="{race_id}";operator="=";value2="ELF"} falseElse npc_quartermaster_race_bonus_krasnolud
  Mechanics:
    - command{c="mi give MATERIAL DZIKIE_ZIOLO {caster_name} 2";runas=console} @Self
    - message{m="<aqua>Pieczęć Elfa &8> &fDostajesz zwiadowczy bonus startowy: 2 Dzikie Zioła pod pierwszy utility loop."} @Self

npc_quartermaster_race_bonus_krasnolud:
  Conditions:
    - Comparator{value1="{race_id}";operator="=";value2="KRASNOLUD"} falseElse npc_quartermaster_race_bonus_nieumarly
  Mechanics:
    - command{c="mi give MATERIAL ZLOM_ZELAZNY {caster_name} 2";runas=console} @Self
    - message{m="<gold>Pieczęć Krasnoluda &8> &fDostajesz kuźniczy bonus startowy: 2 Żelazne Złomy pod forge i pierwszy odzysk."} @Self

npc_quartermaster_race_bonus_nieumarly:
  Conditions: []
  Mechanics:
    - command{c="mi give MATERIAL SLABA_ESENCJA {caster_name} 1";runas=console} @Self
    - message{m="<dark_gray>Pieczęć Nieumarłego &8> &fDostajesz mroczny bonus startowy: 1 Słaba Esencja pod pierwszy loop reliktów i rytuału."} @Self

npc_quartermaster_wrong_class:
  Conditions: []
  Mechanics:
    - message{m="<red>Kwatermistrz &8> &fTo nie jest zestaw twojej klasy. Wybierz sprzęt zgodny z zapisaną przysięgą."} @Self
    - playsound{sound="minecraft:entity.villager.no";volume=1;pitch=0.8} @Self
    - openmenu{name="foundation_first_contract";permission=false} @Self

npc_quartermaster_already_claimed:
  Conditions: []
  Mechanics:
    - message{m="<red>Kwatermistrz &8> &fPierwszy zestaw został już wydany. Dalszy postęp idzie przez forge, profesje i łup."} @Self
    - playsound{sound="minecraft:entity.villager.no";volume=1;pitch=0.7} @Self
    - openmenu{name="foundation_city_roster";permission=false} @Self
