foundation_creator_intro:
  permission: ''
  bottom_inventory: false
  name: '<dark_gray>Kompania Bohaterow - Wybor Postaci'
  size: 6
  fill_material: 'BLACK_STAINED_GLASS_PANE'
  enable_animation: false

  buttons:
    border:
      location: top
      slots: [0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,42,43,44,45,46,47,48,52,53]
      source: vanilla
      material: BLACK_STAINED_GLASS_PANE
      name: ''

    race_title:
      location: top
      slots: [10]
      source: vanilla
      material: NETHER_STAR
      name: '<aqua><bold>Rody'
      lore:
        - '<gray>Wybierz pochodzenie bohatera.'
        - '<dark_gray>Pending: {pending_race_id}'

    class_title:
      location: top
      slots: [16]
      source: vanilla
      material: IRON_SWORD
      name: '<red><bold>Archetypy'
      lore:
        - '<gray>Wybierz styl walki.'
        - '<dark_gray>Pending: {pending_class_id}'

    player_card:
      location: top
      slots: [4]
      source: vanilla
      material: player_head
      texture: player
      name: '<white><bold>{caster_name}'
      lore:
        - '<gray>Ród: <white>{pending_race_id}'
        - '<gray>Archetyp: <white>{pending_class_id}'
        - '<gray>Etap: <white>{character_stage}'

    creator_status:
