foundation_profession_roster:
  permission: ''
  bottom_inventory: false
  name: '<dark_gray>Dzielnica Profesji'
  size: 6
  fill_material: 'BLACK_STAINED_GLASS_PANE'
  enable_animation: false

  buttons:
    border:
      location: top
      slots: [ 0,1,2,3,5,6,7,8,9,17,18,26,27,35,36,44,45,46,47,48,50,51,52,53 ]
      source: vanilla
      material: BLACK_STAINED_GLASS_PANE
      name: ' '

    title:
      location: top
      slots: [ 4 ]
      source: vanilla
      material: CRAFTING_TABLE
      name: '<green><bold>Profesje'
      lore:
        - '<gray>Gathering, rzemiosło i usługi.'
        - '<gray>Rosną przez używanie.'
        - '<red>Status: intro + source contract.'
        - '<dark_gray>Runtime XP: pending.'
        - ''
        - '<dark_gray>Intro: {profession_intro_completed}'

    gathering:
      location: top
      slots: [ 19 ]
      source: vanilla
      material: IRON_PICKAXE
      name: '<green><bold>Gathering'
      lore:
        - '<gray>Górnictwo, Zielarstwo, Łowiectwo.'
        - '<gray>Źródło materiałów, nie pełny build.'
        - '<dark_gray>Runtime gathering XP: pending.'

    crafting:
      location: top
      slots: [ 21 ]
      source: vanilla
      material: SMITHING_TABLE
      name: '<gold><bold>Rzemiosło'
      lore:
        - '<gray>Kowalstwo, Krawiectwo, Jubilerstwo,'
        - '<gray>Alchemia, Runotwórstwo, Inżynieria, Gotowanie.'
        - '<gray>Mocne receptury wymagają progresu.'
        - '<dark_gray>Runtime recipe XP: pending.'

    profession_skills:
      location: top
      slots: [ 23 ]
      source: vanilla
      material: REDSTONE_TORCH
      name: '<yellow><bold>Skille Profesji'
      lore:
        - '<gray>Utility, preparation, craft support.'
        - '<red>Nie mogą zastąpić class kitów.'
        - '<dark_gray>Lock: profession level + source.'
        - '<dark_gray>Runtime unlock: pending.'

    economy:
      location: top
      slots: [ 25 ]
      source: vanilla
      material: EMERALD
      name: '<aqua><bold>Rynek i Item Sink'
      lore:
        - '<gray>Salvage, repair, market, upgrade.'
        - '<gray>Profesje mają tworzyć potrzeby,'
        - '<gray>nie samowystarczalnego boga.'

    complete_intro:
      location: top
      slots: [ 40 ]
      source: vanilla
      material: LIME_DYE
      name: '<green><bold>Zapisz Intro Profesji'
      lore:
        - '<gray>Zaznacza, że gracz poznał'
        - '<gray>profesje jako osobny filar.'
      left_click:
        Scripts:
          - creator_profession_intro_complete
      click:
        Scripts:
          - creator_profession_intro_complete

    back:
      location: top
      slots: [ 49 ]
      source: vanilla
      material: ARROW
      name: '<yellow><bold>Wróć do miasta'
      left_click:
        Scripts:
          - creator_open_city_roster
      click:
        Scripts:
          - creator_open_city_roster
