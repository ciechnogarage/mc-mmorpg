name: Napady
version: '${version}'
main: pl.mcmmorpg.napady.Napady
api-version: '1.21'
softdepend: [MythicMobs, LibsDisguises]
description: Napady - jednostki MythicMobs walcza na serwerze, dowodzi plugin (etap 2, klon)
commands:
  napad:
    description: Napady - start/stan/dolacz/stop/limit/ruch
    usage: /napad start [n] | stan | dolacz <id> atak|obrona | opusc | stop [id] | limit <n> | ruch predkosc|teleport | cialo mm|manekin | przebrania true|false | pomiar [s] | ai <napad> <jednostka>
permissions:
  napady.admin:
    default: op
  napady.dolacz:
    default: true
