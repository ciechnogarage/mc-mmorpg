# Ciala napadow (plugin Napady, cialo: mm). Kopiuj do plugins/MythicMobs/mobs/ (+ items/Napady.yml) i `mm reload`.
# Cele wybiera plugin (Mob#setTarget), dlatego AITargetSelectors: clear - mob sam nikogo nie namierza.
# Despawn CHUNK: znika przy restarcie i wyladowaniu chunka (NORMAL = znika bez graczy w poblizu,
# a napad trwa bez graczy); mobs-options.md "Despawn".
# Wyposazenie (przedmioty MMOItems i ich liczby) zaklada plugin tik po spawnie (config wyposazenie, Wyposazenie.java):
# MM przy spawnie nadpisuje sprzet nadany z pluginu. Tu zostaje tylko luk szkieletow: bez niego w chwili spawnu
# szkielet dostaje skeleton_melee i nie strzela (25.10 klon napady). Health/Damage nadpisuje plugin.
# PreventRandomEquipment: false, bo true czysci sprzet 3-5 tikow po spawnie, takze nadany z pluginu (25.10 klon:
# +2 tiki topor i helm sa, +5 pusto; z false zostaja). Losowy sprzet vanilla nie wchodzi: plugin ustawia kazdy slot.
NAP_ATAK_WOJOWNIK:
  Type: ZOMBIE
  Display: 'NAP_ATAK_WOJOWNIK'
  Health: 20
  Damage: 3
  Options:
    Despawn: CHUNK
    PreventSunburn: true
    PreventItemPickup: true
    PreventOtherDrops: true
    PreventRandomEquipment: false   # true = MM czysci sprzet 3-5 tikow po spawnie (i przedmioty z pluginu)
    MovementSpeed: 0.25
    FollowRange: 20
    KnockbackResistance: 0.3
  AIGoalSelectors:
  - clear
  - float
  - meleeattack{s=1.2;fu=true}
  AITargetSelectors:
  - clear

NAP_ATAK_LUCZNIK:
  Type: SKELETON
  Display: 'NAP_ATAK_LUCZNIK'
  Health: 20
  Damage: 2
  Options:
    Despawn: CHUNK
    PreventSunburn: true
    PreventItemPickup: true
    PreventOtherDrops: true
    PreventRandomEquipment: false   # true = MM czysci sprzet 3-5 tikow po spawnie (i przedmioty z pluginu)
    MovementSpeed: 0.25
    FollowRange: 24
    KnockbackResistance: 0.3
  Equipment:
  - bow HAND
  AIGoalSelectors:
  - clear
  - float
  - bowattack{s=1;r=20;smax=40}
  AITargetSelectors:
  - clear

