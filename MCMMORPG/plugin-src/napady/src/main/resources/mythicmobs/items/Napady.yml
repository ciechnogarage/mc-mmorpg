# Format: items-attributes.md (MM wiki Items/Attributes).
NAP_TOPOR:
  Id: iron_axe
  Display: '<red>Topór najeźdźcy'
  Attributes:
    MainHand:
      ATTACK_DAMAGE: 0 ADD
NAP_MIECZ:
