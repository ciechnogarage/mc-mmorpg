name: AnimacjeBroni
main: pl.mcmmorpg.animacjebroni.AnimacjeBroni
version: '${version}'
api-version: '1.21'
description: Zamach (swing_animation) i model trzymania broni MMOItems wg typu przedmiotu.
depend: [MMOItems, MythicLib]
softdepend: [MMOCore]
commands:
  animacjebroni:
    description: reload | sprawdz <gracz> | stamina [<zestaw> | gracz <nick>]
    usage: /animacjebroni <reload|sprawdz <gracz>|stamina [<zestaw>|gracz <nick>]>
    permission: animacjebroni.admin
permissions:
  animacjebroni.admin:
    default: op
