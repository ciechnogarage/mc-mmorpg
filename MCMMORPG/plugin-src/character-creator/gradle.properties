# Wersja bazowa. Pelna wersja to <ccVersion>-<rewizja git>, sklejana w build.gradle.kts —
# patrz build.sh. Chodzi o to, zeby z dzialajacego serwera dalo sie odczytac, KTORE zrodla
# na nim stoja; zaszyte na sztywno "0.1.0-SNAPSHOT" nie odpowiadalo na to pytanie.
ccVersion=0.2.0

# Katalog z jarami pluginow, przeciwko ktorym kompilujemy. Jawna lista plikow siedzi
# w build.gradle.kts — tu jest tylko sciezka bazowa.
ccServerPlugins=../../plugins

org.gradle.console=plain
