# POKRETLA (2026-09-30). Zmiana + /cc reload. Ticki: 20 = 1 s. Brak wpisu = wartosc z kodu.
#  wybor.kafelek-szerokosc   szerokosc kafelka listy postaci (2 kolumny; >200 wyjezdza przy GUI 3-4)
#  wybor.scena-po-ticki      po ilu tickach od ostatniego A/D dochodzi sceneria i podglad
#  wybor.lista-sama-po-ticki opoznienie automatycznej listy po wejsciu (od wybor-postaci.lista-od postaci)
#  wybor.ad-nowa-postac / ad-usun-postacie  pozycje "+ Nowa postac" / "Usun postacie" pod A/D
#  kreator.scena-po-ticki    to samo dla zmiany rasy w kreatorze
#  scena.panel-szerokosc / panel-skala  panele z tekstem w scenie (karta i lista)
#  scena.podpowiedz-co-ticki  odswiezanie podpowiedzi na pasku akcji
#  scena.cisza-na-czacie     czat wyciszony w wyborze postaci i kreatorze
ustawienia:
  kreator:
    scena-po-ticki: 6
  scena:
    cisza-na-czacie: true
    panel-skala: 0.5
    panel-szerokosc: 230
    podpowiedz-co-ticki: 30
  wybor:
    ad-nowa-postac: true
    ad-usun-postacie: true
    kafelek-szerokosc: 150
    lista-sama-po-ticki: 30
    scena-po-ticki: 6
    schowaj-podglad-bloki: 6.0
