# CharacterCreator configuration.
# See docs at repo root: character-sector-contract.md and character-stage-architecture.md
# are ARCHIVED (old/character-creator-v1) — this plugin does not follow them.

creator-room:
  world: 'creator_limbo'
  # pitch 6: lekko w dol. Podnosi postac w kadrze (nogi przestaja wpadac pod przycisk
  # "Stworz") i pokazuje mniej pustego sufitu — ten zajmowal 20% ekranu.
  spawn: { x: 0.5, y: 100.0, z: 0.5, yaw: 180.0, pitch: 6.0 }
  # 2.7 bloku od gracza — STALE. Zoomu nie ma celowo: kadr ma byc zawsze taki sam
  # i bliski. Klaster sterowania to teraz jeden rzad u dolu, wiec model ma na siebie
  # caly pas miedzy paskiem imienia u gory a sterowaniem u dolu.
  dummy-anchor: { x: 0.5, y: 100.0, z: -2.2 }
  # 'confirm-anchor' USUNIETY. Byl czytany, walidowany jako FATAL (jego brak wylaczal caly
  # plugin) i nieuzywany przez ani jedna linie kodu poza wlasnym getterem. Klucz zostawiony
  # w istniejacych plikach jest od teraz ignorowany — mozna go skasowac.

  # DOKAD wychodzi gracz po utworzeniu postaci.
  #
  # Wczesniej bylo to na sztywno Bukkit.getWorlds().get(0).getSpawnLocation(), czyli surowy
  # spawn swiata — konto testowe zginelo tam od zombie w DWOCH niezaleznych sesjach QA
  # (world1: 36 s po zatwierdzeniu, world3: 9 s). Wartosci ponizej to celowo TE SAME
  # wspolrzedne co 'new-profile-spawn-point' w plugins/MMOProfiles/config.yml: nowa postac
  # ma ladowac tam, gdzie MMOProfiles juz obiecuje ja postawic, zamiast w trzecim z kolei
  # miejscu zdefiniowanym niezaleznie. Przy zmianie jednego poprawic i drugie.
  #
  # Brak sekcji 'exit' = zachowanie sprzed poprawki (spawn swiata glownego).
  exit:
    world: 'world'
    # 2026-09-20: przeniesione z 239.5 / 63 / 208.5, bo TAMTO MIEJSCE JEST POD WODA — konto
    # QA utonelo tam kilkanascie sekund po utworzeniu postaci, a boty evali wychodzily stamtad
    # z ubytkiem zycia. Nowe wspolrzedne to najblizszy PLASKI, suchy kawalek ladu (kamienny
    # plaskowyz ~88 m na zachod): sprawdzone w heightmapach regionu (najwyzszy blok nie jest
    # ciecza, deniwelacja 5x5 <= 1) i potwierdzone w grze — blok 149/98/197 to kamien,
    # a 99..101 nad nim to powietrze w calym kwadracie 3x3.
    # Te same wspolrzedne siedza w 'new-profile-spawn-point' i 'profile-selection-location'
    # w plugins/MMOProfiles/config.yml. Przy zmianie poprawic OBA pliki.
    x: 149.5
    y: 99.0
    z: 197.5
    yaw: -90.0
    pitch: 0.0

  # Nietykalnosc po wyjsciu z kreatora, w tickach. Gracz laduje w swiecie bez ekwipunku
  # bojowego, czesto w nocy i przy wlaczonym spawnie mobow — te kilka sekund to roznica
  # miedzy "postac utworzona" a ekranem smierci. MMOProfiles robi to samo na czas wyboru
  # profilu ('profile-selection-invulnerability: true'), wiec gracz nie zauwazy szwu.
  # 0 = wylaczone.
  exit-invulnerability-ticks: 100

  # SPRZATANIE SALI PRZY STARCIE SERWERA.
  #
  # Podglad postaci nalezy do sesji i powstaje dopiero, gdy gracz wejdzie do kreatora.
  # Cokolwiek innego stoi w tej sali, stoi w kadrze: na produkcji byl to recznie
  # wsummonowany armor stand i mannequin DOKLADNIE w punkcie 'dummy-anchor' (pozostalosc
  # po porownywaniu tej wersji z prototypem config-only) — armor stand wystawal zza ramion
  # postaci, a mannequin bylo widac przez ulamek sekundy przy kazdej zmianie rasy.
  #
  # true = przy kazdym starcie plugin usuwa z tego swiata WSZYSTKIE encje poza graczami
  # i melduje w logu, co usunal. false = nie rusza niczego (wtedy sprzatanie recznie:
  # /execute in minecraft:creator_limbo run minecraft:kill @e[type=!player] — uwaga,
  # samo 'kill' przechwytuje CMI i po cichu nic nie robi).
  sweep-stray-entities: true

  # RESPONSYWNOSC WEJSCIA DO SALI.
  #
  # Sala jest osobnym swiatem, wiec wejscie to zmiana wymiaru i klient zawsze pokaze
  # "Loading terrain..." — tego sie nie obejdzie. Mozna za to skrocic czekanie:
  #
  # view-distance: ile chunkow sali wysylac. Sala ma kilkanascie blokow, a globalny zasieg
  #   (server.properties, view-distance=10) kazal klientowi czekac na 21x21 = 441 chunkow
  #   pustki. 4 daje 81. 0 = nie ruszaj, zostaje globalny.
  # keep-loaded: trzymaj chunki sali w pamieci na stale (3x3 wokol 'spawn' i 'dummy-anchor').
  #   Bez tego serwer wczytuje je z dysku przy KAZDYM wejsciu, bo po wyjsciu ostatniego
  #   gracza sala sie wyladowuje.
  view-distance: 4
  keep-loaded: true

# Interfejs kreatora nie ma juz sekcji 'creator-menu'. Trzymala ona przesuniecia glifu
# ramy okna (title-shift / name-shift) i tryb pomiarowy probe-advance — a ramy nie ma:
# minimalistyczne UI rysuje wylacznie ikony i imie, zeby odslonic postac. Grafika ramy
# nadal da sie wygenerowac (tools/gen_creator_art.py), ale plugin jej nie czyta.
# Wartosci przesuniec zostaly w jarze 0.2.0 (deploy-backups/) — zrodla pluginu nie sa
# w gicie, wiec to jedyna kopia starego ukladu.

# SCENA W STYLU WYNNCRAFTA (etap 1: szkielet, projekt: claude.ai/artifact/7Le7N9VeAKLc2JfdjZYwWq).
#
# Gracz patrzy przez nieruchoma kamere (SPECTATOR na encji). Jeden ekran wyboru:
# A/D = rasa (pod sciemnieniem), W/S = klasa, LPM = dalej, PPM = wyjdz. Q/E nie wchodza
# w gre: w spectatorze serwer ich nie dostaje (E jest w ogole po stronie klienta).
# Na razie wchodzi sie tu tylko komenda admina '/cc scena' — stary kreator dziala dalej.
#
# points: kadry. 'default' jest obowiazkowy; kadr o id rasy (np. 'ork') przenosi kamere
#   w scenerie tej rasy — bez niego rasa pokazuje sie w kadrze domyslnym.
#   camera  — oko kamery (katy liczone same: kamera patrzy na 'look'),
#   subject — gdzie stoi postac (obraca sie przodem do kamery),
#   card    — karta klasy po prawej (tekst na scenie, widoczny tylko dla gracza; rosnie w gore
#             od punktu, wiec dlugie karty stawiac nizej),
#   list    — opcjonalnie: panel listy klas po lewej; bez klucza = lustro karty wzgledem postaci,
#   look    — opcjonalnie: punkt, w ktory patrzy kamera (domyslnie piers postaci);
#             przesuniety w bok ustawia postac poza srodkiem kadru.
#   KLIMAT kadru (tylko dla patrzacego gracza, opcjonalnie):
#   time      — pora dnia 0..24000 (1000 ranek, 6000 poludnie, 12300 zachod, 18000 polnoc),
#   rain      — deszcz,
#   particles — lista { type, at?, dx, dy, dz, y, count, speed, every }; bez 'at' wokol postaci
#               (y = wysokosc nad stopami), every = co ile tickow; tylko czastki bez danych,
#   idle      — { swing-every: ticki, look-every: ticki, look-yaw: stopnie } — machniecie bronia,
#               obrot glowy na boki (tulow zostaje przodem do kamery).
#   Kadry ras + klimat na klonie: patrz tools/scenerie-ras.sh (buduje scenerie).
# fade.glyph: pelnoekranowy czarny glif Nexo (font minecraft:default). Pusty = bez sciemnien.
scene:
  # true = nowa postac (MMOProfiles "utworz") przechodzi przez scene zamiast sali kreatora.
  # false = scena tylko pod /cc scena (podglad dla admina), gracze ida stara droga.
  replace-creator: false
  # true = po wejsciu na serwer (i z "Zmien postac") scena wyboru postaci zamiast okna MMOProfiles.
  # WYMAGA w plugins/MMOProfiles/config.yml 'no-gui-on-login: true', inaczej wyskocza oba ekrany.
  # Przycisk "Zmien postac" w DeluxeMenus: '[console] cc wybor %player_name%'.
  replace-selector: false
  world: 'creator_limbo'
  shield-distance: 1.4
  target-delay-ticks: 5
  fade:
    glyph: ''
    in-ticks: 5
    stay-ticks: 5
    out-ticks: 10
  # HUD innych pluginow na czas sceny (komendy z konsoli, %player% = gracz).
  # Spectator chowa vanillowy HUD, ale nie paski MythicHUD ani action bara MMOCore
  # (zycie/mana), ktory nadpisywal podpowiedz sterowania. Po zamknieciu — on-close.
  hud:
    on-open:
      - 'hud layout %player% remove default-layout -s'
      - 'hud layout %player% remove sword-layout -s'
      - 'hud layout %player% remove chowance-layout -s'
    repeat:
      - 'mmocore admin hideab %player% 60'
    repeat-ticks: 40
    on-close:
      - 'hud layout %player% add default-layout -s'
      - 'hud layout %player% add sword-layout -s'
      - 'hud layout %player% add chowance-layout -s'
  points:
    default:
      camera:  { x: 0.5, y: 101.62, z: 0.5 }
      subject: { x: 0.5, y: 100.0, z: -2.2 }
      card:    { x: 2.0, y: 100.9, z: -2.0 }
      look:    { x: 1.0, y: 101.0, z: -2.2 }

preview:
  rotation-interval-ticks: 2

  # ROZGRZEWKA SKOREK ZNIKNELA razem z kluczem 'skin-warmup-ticks' i to jest zmiana
  # zachowania, a nie porzadkowa. Podglad to teraz STAJNIA nosicieli: po jednym na skorke,
  # wszyscy stoja od poczatku sesji 20 blokow pod sala, a klikniecie rasy albo klasy tylko
  # wystawia wlasciwego na kotwice. Nie ma wiec czego rozgrzewac ani na co czekac — i, co
  # wazniejsze, klient nie dostaje przy kliknieciu NOWEJ encji, wiec nie ma tez chwili,
  # w ktorej rysuje skorke domyslna. Szczegoly: javadoc PreviewDummyManager.

# WYMUSZENIE WYBORU POSTACI PRZY WEJSCIU.
#
# Dotad nikt tego nie pilnowal: MMOProfiles otwiera ekran profili po zalogowaniu
# ('no-gui-on-login: false'), ale gracz mogl go zamknac Escape'em i grac bez postaci —
# bez rasy, bez klasy MMOCore, bez rekordu. Widac to w logu: KreatorQA zalogowal sie
# o 11:50:03, a kreator otworzyl sie dopiero 19 s pozniej, po recznym kliknieciu.
#
# Nie budujemy wlasnej pulapki. MMOProfiles ma na to wlasna, wspierana droge:
# '/mmoprofiles open <gracz>' — a jego argument 'force-select' ma fallback ustawiony
# na !hasChosenProfile(), wiec dla gracza BEZ wybranego profilu wymuszenie wlacza sie
# samo (sprawdzone w bajtkodzie OpenCommandNode). Wolamy to z konsoli, wiec permisja
# 'mmoprofiles.command' (default: op) nie ma tu nic do rzeczy.
profile-selection:
  # false = plugin nie pilnuje wejscia i zapisuje to w logu przy starcie.
  enforce: true
  # Ile czekac po wejsciu gracza, zanim sprawdzimy, czy ma wybrany profil. Musi byc
  # DLUZSZE niz 'resource-pack-load-delay: 40' z configu MMOProfiles, inaczej sprawdzimy
  # gracza, ktoremu MMOProfiles jeszcze nie zdazyl pokazac ekranu.
  first-check-delay-ticks: 100
  # Co ile ticków ponawiac dla graczy, ktorzy nadal nie wybrali. 0 = jednorazowo.
  recheck-interval-ticks: 200

# UWAGA co do 'description' i 'bonus':
# Oba pola sa WYLACZNIE OPISOWE — ladują w podpowiedzi (lore) ikony i nigdzie indziej.
# NIE WOLNO wpisywac tu obietnic mechanicznych
# ("+10% dosw.", "+2 Sila"), dopoki nie stoi za nimi realny efekt w grze — wczesniejsza
# wersja to robila i interfejs klamal graczowi.
# Teksty ponizej sa placeholderem napisanym przez asystenta — do zastapienia wlasnym lore.
# Limitu dlugosci nie ma: od czasu minimalistycznego UI tekst rysuje vanillowy font
# w tooltipie, a nie generator wypalajacy go w teksture panelu.
# UWAGA co do 'permission': flaga race.* jest DZIŚ WRITE-ONLY — grep po wszystkich
# pluginach w tym stacku pokazuje, że jedynym plikiem zawierającym np. 'race.czlowiek' jest
# ten config. Ustawiamy ją mimo to (tanio, idempotentnie) jako punkt zaczepienia dla
# przyszłych warunków LuckPerms. Jeśli po jakimś czasie nadal nikt jej nie czyta, usunąć
# razem z gałęzią w ConfirmService — nie pojedynczo.
races:
  czlowiek:
    icon: 'cc:race_czlowiek'
    description: 'Wszechstronni i ambitni.'
    bonus: 'Ludzie Przymierza'
    helmet-color: '#C8B48C'
    display: '&fCzłowiek'
    permission: 'race.czlowiek'
    # 'none' = rasa ŚWIADOMIE bez modelu 3D i tak zostaje dla wszystkich ras: rasę pokazuje
    # SKÓRKA, nie ModelEngine. Którą skórkę — skins.yml, klucz '<rasa>_<klasa>' (patrz sekcja
    # 'skins' na końcu pliku). Podgląd w kreatorze nosi dokładnie tę samą teksturę, którą
    # gracz dostanie po zatwierdzeniu.
    model-id: 'none'
  ork:
    icon: 'cc:race_ork'
    description: 'Siła ponad wszystko.'
    bonus: 'Klany Stepu'
    helmet-color: '#6E9B4E'
    display: '&2Ork'
    permission: 'race.ork'
    # Patrz komentarz przy rasie 'czlowiek'.
    model-id: 'none'
  elf:
    icon: 'cc:race_elf'
    description: 'Celni łucznicy i magowie.'
    bonus: 'Dzieci Świtu'
    helmet-color: '#E8DCA8'
    display: '&bElf'
    permission: 'race.elf'
    # Patrz komentarz przy rasie 'czlowiek'.
    model-id: 'none'
  nieumarly:
    icon: 'cc:race_nieumarly'
    description: 'Nie znają bólu ni strachu.'
    bonus: 'Powstali z grobu'
    helmet-color: '#8FA0A0'
    display: '&8Nieumarły'
    permission: 'race.nieumarly'
    # Blueprint race_nieumarly leży w plugins/ModelEngine/blueprints/, ale NIE jest używany:
    # rasę pokazuje skórka. Model wróciłby tu tylko wtedy, gdyby powstał komplet blueprintów
    # dla wszystkich ras — jedna rasa z modelem i trzy bez wyglądały w kadrze jak błąd.
    model-id: 'none'

# UWAGA co do 'gear': to jest WYŁĄCZNIE strój dummy'ego w podglądzie. Gracz po utworzeniu
# postaci NIE dostaje z tego ani jednego przedmiotu; ekwipunku startowego w tym pluginie nie ma
# (README kiedyś twierdził inaczej).
#
# Odkąd para rasa+klasa ma własną skórkę, z tej sekcji używany jest tylko 'hand': zbroja
# zakrywała strój klasy wypalony w skórce, a barwiony helm rasy — głowę. Pozostałe sloty
# wracają do gry tylko dla par BEZ skórki w skins.yml (podgląd używa wtedy skórki gracza).
classes:
  wojownik:
    icon: 'cc:class_wojownik'
    description: 'Ciężka zbroja i tarcza.'
    bonus: 'Obrońca'
    gear: { chest: IRON_CHESTPLATE, legs: IRON_LEGGINGS, boots: IRON_BOOTS, hand: IRON_SWORD }
    display: '&cWojownik'
    mmocore-id: 'warrior'
  mag:
    icon: 'cc:class_mag'
    description: 'Wielka moc, kruche ciało.'
    bonus: 'Zaklinacz'
    gear: { chest: LEATHER_CHESTPLATE, legs: LEATHER_LEGGINGS, boots: LEATHER_BOOTS, hand: BLAZE_ROD }
    display: '&dMag'
    mmocore-id: 'mage'
  akolita:
    icon: 'cc:class_akolita'
    description: 'Leczy i chroni drużynę.'
    bonus: 'Wsparcie'
    gear: { chest: GOLDEN_CHESTPLATE, legs: GOLDEN_LEGGINGS, boots: GOLDEN_BOOTS, hand: GOLDEN_SHOVEL }
    display: '&eAkolita'
    mmocore-id: 'paladin'
  ninja:
    icon: 'cc:class_ninja'
    description: 'Szybkie ciosy zza pleców.'
    bonus: 'Zabójca'
    gear: { chest: CHAINMAIL_CHESTPLATE, legs: CHAINMAIL_LEGGINGS, boots: LEATHER_BOOTS, hand: IRON_SWORD }
    display: '&7Ninja'
    mmocore-id: 'rogue'

# HISTORIA (zostaje, żeby nikt nie wrócił tą drogą): poprzednia wersja miała sekcję 'skin'
# odsyłającą do klasy SkinProvider, której NIGDY nie było w źródłach — cała "abstrakcja"
# sprowadzała się do `cmi skin <gracz> <gracz> -s`, czyli nakładania graczowi jego WŁASNEJ
# skórki przy każdym wyborze profilu. Dzisiejsze skórki nie pytają Mojanga o nic: gotowe,
# podpisane tekstury leżą w skins.yml i idą prosto do profilu gracza.
# SKÓRKI POSTACI
#
# Skórka jest JEDNĄ teksturą na parę RASA x KLASA — protokół nie ma drugiej warstwy, którą
# serwer mógłby podmienić osobno, więc "podskin klasy" jest wypalony w tę samą teksturę:
# rasa trzyma głowę i karnację, klasa tors, ręce, nogi i warstwę zewnętrzną (kaptur, maska,
# naramienniki, tabard). Same tekstury leżą w skins.yml (obok tego pliku) i są czytane
# Z DYSKU — poprawka skórki to podmiana tamtego pliku i '/cc reload', bez przebudowy jara.
#
# Skąd biorą się pliki: tools/gen_race_skins.py generuje 16 PNG, tools/upload_skins.sh wgrywa
# je na mineskin.org (wprost przez jego API) i zapisuje stamtąd podpisane tekstury do
# skins.yml. Własny hosting PNG odpada: klient Javy pobiera skórki wyłącznie
# z textures.minecraft.net, także przy online-mode=false.
skins:
  # false = kreator nadal pokazuje skórkę rasy i klasy na podglądzie, ale gracz zostaje
  # w skórce swojego konta. To JEDYNA rzecz w tym pluginie, która zmienia profil gracza —
  # wyłącznik jest po to, żeby przy sporze z innym pluginem od skórek (CMI, SkinsRestorer)
  # dało się to rozdzielić bez przebudowy jara.
  apply-to-player: true

  # SKORKA JUZ PRZY WEJSCIU, a nie dopiero przy wyborze postaci.
  #
  # Bez tego gracz od wejscia do kliknięcia postaci chodzi w skorce swojego KONTA —
  # kilkanascie sekund, w ktorych patrzy na ekran wyboru i widzi za nim siebie. Z tym
  # wlacznikiem plugin naklada mu skorke postaci granej OSTATNIO (pole 'last-used'
  # w characters.yml), a po wyborze i tak poprawia ja na skorke wybranej postaci.
  # Najgorszy mozliwy skutek pomylki: skorka poprzedniej postaci przez chwile.
  #
  # Nakladamy dwa razy (10 i 40 tickow po wejsciu), bo plugin od skorek moze nalozyc swoja
  # PO nas — CMI robilo to ~1 s po wejsciu. Nalozenie jest idempotentne, wiec drugie
  # podejscie przy niezmienionej skorce nie kosztuje nic.
  #
  # false = zachowanie sprzed 2026-09-20: skorka wchodzi dopiero przy wyborze postaci.
  apply-on-join: true

  # Głowy na ekranie wyboru postaci (MMOProfiles) — bez tego każda postać ma tam głowę
  # Steve'a, bo MMOProfiles rysuje PLAYER_HEAD bez tekstury i nie ma placeholdera, którym
  # dałoby się to ustawić z jego configu. Dopisujemy je już po zbudowaniu okna, czyli
  # wchodzimy w CUDZE okno — dlatego osobny wyłącznik. Mapowanie slot -> postać bierzemy
  # z jego własnego pliku language/gui/profile-list.yml; przy stronicowaniu (więcej postaci
  # niż slotów) nie ruszamy niczego, żeby nie wstawić komuś cudzej głowy.
  profile-heads: true

