name: Wyscigi
version: '${version}'
main: pl.mcmmorpg.wyscigi.WyscigiPlugin
api-version: '1.21'
depend: [ModelEngine, MythicLib]
softdepend: [MMOProfiles, Multiverse-Core]
commands:
  wyscigi:
    description: Wyścigi Chowańców — sterowanie z menu (konsola).
    usage: /wyscigi <czasowka|wyscig|wyjdz|rekordy|zbuduj|stan> ...
    permission: wyscigi.console
permissions:
  wyscigi.console:
    default: op
