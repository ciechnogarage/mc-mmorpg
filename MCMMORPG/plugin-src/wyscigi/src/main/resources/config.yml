# Wyścigi Chowańców. Jednostki prędkości: bloki na tick (0.55 = 11 bloków/s).
# Statystyki gatunków różnią się o kilka procent: charakter, nie przewaga. Wierzchowiec jest z wypożyczalni,
# więc nikt nie wygrywa poziomem ani lupem.

swiat: wyscigi
debug: false              # true = zdarzenia jazdy w logu (klon testowy)
# Gdzie wyrzucić gracza, który znalazł się w świecie wyścigów bez zapisanego punktu powrotu.
swiaty-awaryjne: [stolica_odnowa, stolica, world]
# Z tych światów można wyruszyć na wyścig (nie z areny, lochu ani kreatora).
swiaty-wejscia: [world, stolica_odnowa, stolica]

gatunki:
  wilkor:     {nazwa: 'Wilkor',       model: chw_wilkor,       ikona: chw_wilkor,       predkosc: 0.54, przyspieszenie: 0.034, skret: 9.0,  opis: 'Zrywny: najszybciej rusza i wychodzi z zakrętów.'}
  pozogar:    {nazwa: 'Pożogar',      model: chw_pozogar,      ikona: chw_pozogar,      predkosc: 0.575, przyspieszenie: 0.024, skret: 8.0, opis: 'Najszybszy na prostej, ale długo się rozpędza.'}
  glebiniec:  {nazwa: 'Głębiniec',    model: chw_glebiniec,    ikona: chw_glebiniec,    predkosc: 0.555, przyspieszenie: 0.028, skret: 8.6, opis: 'Wszechstronny: bez słabych stron.'}
  puszczorog: {nazwa: 'Puszczoróg',   model: chw_puszczorog,   ikona: chw_puszczorog,   predkosc: 0.545, przyspieszenie: 0.027, skret: 10.0, opis: 'Zwrotny: najciaśniej bierze zakręty.'}
  glazogrzbiet: {nazwa: 'Głazogrzbiet', model: chw_glazogrzbiet, ikona: chw_glazogrzbiet, predkosc: 0.57, przyspieszenie: 0.022, skret: 7.6, opis: 'Ciężki: wolno rusza, rozpycha innych.'}
  zelaznorog: {nazwa: 'Żelaznoróg',   model: chw_zelaznorog,   ikona: chw_zelaznorog,   predkosc: 0.56, przyspieszenie: 0.026, skret: 8.4, opis: 'Pewny: krótszy poślizg ładuje turbo szybciej.'}

jazda:
  hamowanie: 0.05          # S przy jeździe do przodu
  wybieg: 0.012            # bez gazu
  wsteczny: 0.14           # maks. prędkość na wstecznym
  poza-torem: 0.55         # mnożnik prędkości maks. na poboczu
  skret-przy-predkosci: 0.4  # o ile mniej skręca przy pełnej prędkości
  przesuniecie-boczne: 0.07  # A/D lekko przesuwa w bok
  poslizg:
    min-predkosc: 0.55     # część prędkości maks. potrzebna do wejścia w poślizg
    min-kat: 6             # o tyle stopni trzeba celować w zakręt
    skret: 1.45            # mnożnik skrętu w poślizgu
    kat-uslizgu: 16        # ruch odchylony od kierunku głowy (stopnie)
    turbo-1: 30            # ticki ładowania do niebieskiego turbo
    turbo-2: 65            # ...do pomarańczowego
    turbo-1-czas: 16
    turbo-2-czas: 30
    turbo-mnoznik: 1.22
  pole-przyspieszenia: {czas: 26, mnoznik: 1.38}
  start-turbo: {okno: 10, czas: 30, mnoznik: 1.3, za-wczesnie: 32, kara: 24}
  zderzenie-sciana: 0.45   # mnożnik prędkości po uderzeniu w płot

wyscig:
  poczekalnia-sekundy: 20      # ile czekamy na innych graczy
  poczekalnia-dokladka: 5      # kolejny gracz wydłuża czekanie (do limitu)
  poczekalnia-max: 40
  max-graczy: 8
  po-zwyciezcy-sekundy: 30     # po tylu sekundach od mety zwycięzcy wyścig się kończy
  limit-sekundy: 420
  po-mecie-sekundy: 6          # ile stoi się na mecie przed powrotem
  wyjscie-shift-ticki: 40      # przytrzymaj Shift na postoju, żeby opuścić wyścig

tor: sad
tory:
  sad:
    nazwa: 'Sadowy Krąg'
    y: 64                     # poziom, na którym stoi wierzchowiec (jezdnia to blok y-1)
    polszerokosc: 5.5
    pobocze: 3.5
    okrazenia: 3
    # Linia środkowa (x, z), pętla zamknięta, kolejność = kierunek jazdy. Start/meta w pierwszym punkcie.
    punkty:
      - [0, 0]
      - [36, 0]
      - [68, 2]
      - [90, 13]
      - [99, 35]
      - [91, 57]
      - [70, 67]
      - [50, 62]
      - [36, 47]
      - [16, 42]
      - [0, 52]
      - [-6, 72]
      - [-24, 86]
      - [-46, 80]
      - [-54, 58]
      - [-47, 34]
      - [-35, 15]
      - [-19, 3]
    # Pola przyspieszenia: odległość od startu wzdłuż toru (bloki) i przesunięcie w bok (+ = prawa).
    przyspieszenia:
      - {s: 40, bok: 0}       # prosta startowa
      - {s: 228, bok: 2}      # wyjście z esa, wewnętrzna linia
      - {s: 322, bok: 0}      # wyjście z nawrotu
