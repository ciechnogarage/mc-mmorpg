# SKUP NPC world1 — WYGENEROWANE przez tools/handel/generuj.py z tools/handel/ceny.json.
# Ceny = 40% wartosci liczonej z czasu zdobycia (model: tools/handel/ekonomia.py).
# Skup TYLKO kupuje od gracza (options.sell: false) — surowcow PROF_* nie sprzedajemy za pieniadze.
# Otwiera go konsola z menu Handel:  core-shops skup <gracz>   (komenda ma permission OP).
# Kliki (Shops$ShopConfig.items_click): LPM = sprzedaj 1, SHIFT+LPM = sprzedaj wszystkie takie,
# PPM = okno ilosci. Obsluga klikniec w trybie normalnym idzie na watku glownym i ZABIERA
# przedmioty przed wyplata (Check_Buy/BuyAll), pas szybkiego dostepu jest pomijany.
