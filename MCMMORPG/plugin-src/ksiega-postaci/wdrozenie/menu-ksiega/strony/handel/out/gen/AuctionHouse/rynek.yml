# DOM AUKCYJNY world1 — WYGENEROWANE przez tools/handel/generuj.py. Nie poprawiac recznie.
# Otwiera go konsola z menu Handel (DeluxeMenus hub_ekonomia):  ah mmoitems_example stolica <gracz>
# Komenda /ah ma w commands.yml permission OP — gracz nie otwiera okna z czatu (i nie otworzy go
# INNEMU graczowi, bo AuctionHouseCommand bierze nick z 3. argumentu bez sprawdzenia nadawcy).
#
# DECYZJE BEZPIECZENSTWA (dowody: bajtkod CoreTools 1.4.2, patrz raport w tools/handel/README.md):
#  disable_partial_purchase: true — PurchaseItem sprawdza ilosc tylko dla statusu "" (a oferta ma
#    status "active"), wiec przy zakupach czesciowych dwoch kupcow moglo kupic wiecej niz bylo.
#  default_sales_mode: fixed, brak przyciskow licytacji — odbior wygranej licytacji nie ma locka.
#  delivery.purchase_mode: 1, playervault: [] — pelny plecak = zakup odrzucony i zwrot pieniedzy
#    (skarbcow graczy nie ma; tryb 3 szukalby nieistniejacego skarbca).
#  kategorie = BIALA LISTA: przedmiot spoza list nie wejdzie w slot wystawiania (vanilla, ikony
#    GUI Nexo, przedmioty Chowancow, esencje, questowe) — AuctionUtils.restriction().
#
# ID "mmoitems_example" JEST CELOWE (nazwa techniczna, gracz jej nie widzi). CoreTools 1.4.2 zaklada
# tabele SQL, laduje oferty do pamieci i uruchamia harmonogram wygasania TYLKO przy starcie pluginu
# (AuctionHouse.enableAuctionHouse) — dla ID dopisanego po starcie /ct reload wczytuje sam config i
# pierwsze otwarcie konczy sie NPE. Ten dom aukcyjny wszedl bez restartu, wiec dostal ID, ktore
# istnialo przy starcie. Zmiana ID po restarcie jest mozliwa, ale PORZUCA aktywne oferty w starych
# tabelach — nie zmieniac, gdy sa oferty. Pliki przykladow producenta sa w backups (katalog
# AuctionHouse/ istnieje, wiec CoreTools ich nie odtworzy — FileFolder.saveDefaultFile).
mmoitems_example:
  permission: ''
  multi_server: single
  bottom_inventory: false
  fill_material: 'AIR'
  name: "<white>䩰䩱䩲䩳<white>Dom aukcyjny"
