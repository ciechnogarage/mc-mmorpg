  default_category: all
  default_regions: [stolica]
  default_minimum_bid_increment: 5
  default_sales_mode: 'fixed'
  default_currency: 'dollar'
  # Domyslnie 3 dni: dzieki temu przycisk potwierdzenia liczy oplaty na zywo od pierwszej cyfry.
  default_days: 3
  # Limit aktywnych ofert na postac.
  player_max_item:
    default: 12
  disable_partial_purchase: true
  start_script: []
  close_script: []
  player_input:
