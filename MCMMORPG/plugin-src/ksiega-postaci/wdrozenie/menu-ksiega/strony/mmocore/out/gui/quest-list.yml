# GUI display name
name: '&f䪌䪍䪎䪏&f'

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 54

items:
  skill:
    slots: [ 14, 15, 16, 17, 23, 24, 25, 26, 32, 33, 34, 35, 41, 42, 43, 50, 51, 52, 45, 46, 47 ]
    function: quest

    # When quest is locked
    locked:
      item: PAPER
      name: '&c- Niedostępne -'

    # When there is no quest to display
    no-quest:
      item: GRAY_STAINED_GLASS_PANE
      name: '&a'

    level-requirement:
      main:
        hit: '&a  ✔ Wymaga poziomu {level}'
        not-hit: '&c  ✖ Wymaga poziomu {level}'
      profession:
        hit: '&a  ✔ Wymaga {profession} na poziomie {level}'
        not-hit: '&c  ✖ Wymaga {profession} na poziomie {level}'

    # Date format used in the {date} placeholder
    date-format: 'dd.MM.yyyy'

    #custom_model_data_float: 0.45        # 1.20.4+ Float custom model data. Either this, or string option above works completely fine
    #custom_model_data: 0                 # 1.14-1.20.3 Custom model data. Prefer using custom_model_data_string on 1.20.4+
    #tooltip: 'myplugin:tooltip_asset_id' # You can edit the slot icon tooltip that way
    #custom_model_data_string: 'test'     # 1.20.4+ string custom model data
    #item_model: 'minecraft:dirt'         # 1.21.2+ item model
    #skull_texture: '......'              # SKull texture value or URL
    #hide_tooltip: false                  # True or false, for vanilla tooltip
    #unbreakable: false                   # Is it unbreakable or not?
    #fake_attribute: false                # Should MythicLib add a fake attribute modifier? Useful for 1.20 or lower to hide vanilla attributes from the item
    #item_flags: [HIDE_ENCHANTS, ....]    # Add item flags to your items. https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/inventory/ItemFlag.html

    item: BOOK
    name: '&a{name}'
    lore:
      - '{lore}'
      - ''
      - '{started}&8Zadanie rozpoczęte!'
      - '{started}&7► Postęp: &e{progress}%'
      - '{started}&7► &o{objective}'
      - '{started}'
      - '{level_req}&7Wymagany poziom ({current_level_req}/{total_level_req}):'
      - '{level_req}{level_requirements}'
      - '{level_req}'
      - '{completed}&8Ukończono zadanie dnia {date}.'
      - '{completed_cannot_redo}&8Tego zadania nie można powtórzyć.'
      - '{completed_delay}&8Zadanie dostępne za {delay}.'
      - '{completed_can_redo}&8Możesz rozpocząć to zadanie.'
      - '{completed}'
      - '{started}&c► Prawy klik: anuluj.'
      - '{!started}&e► Lewy klik: rozpocznij.'
  next:
    slots: [ 29 ]
    function: next
    item: PLAYER_HEAD
