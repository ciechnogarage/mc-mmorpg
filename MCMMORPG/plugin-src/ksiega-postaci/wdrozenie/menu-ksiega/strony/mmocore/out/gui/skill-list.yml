# GUI display name
name: '&f䪈䪉䪊䪋'

# Number of slots in your inventory. Must be
# between 9 and 54 and must be a multiple of 9.
slots: 54

items:
  skill:
    slots: [ 14, 15, 16, 17, 23, 24, 25, 26, 32, 33, 34, 35 ]
    function: skill

    #custom_model_data_float: 0.45        # 1.20.4+ Float custom model data. Either this, or string option above works completely fine
    #custom_model_data: 0                 # 1.14-1.20.3 Custom model data. Prefer using custom_model_data_string on 1.20.4+
    #tooltip: 'myplugin:tooltip_asset_id' # You can edit the slot icon tooltip that way
    #custom_model_data_string: 'test'     # 1.20.4+ string custom model data
    #item_model: 'minecraft:dirt'         # 1.21.2+ item model
    #skull_texture: '......'              # SKull texture value or URL
    #hide_tooltip: false                  # True or false, for vanilla tooltip
    #unbreakable: false                   # Is it unbreakable or not?
    #fake_attribute: false                # Should MythicLib add a fake attribute modifier? Useful for 1.20 or lower to hide vanilla attributes from the item
    #item_flags: [HIDE_ENCHANTS, ....]    # Add item flags to your items. https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/inventory/ItemFlag.html

    # If true, clicking the skill item will attempt to upgrade it if possible
    # This is usually enabled when hard-binding slots to specific skills. In that
    # case, you don't need the "skill binding" part of the GUI, and clicking
    # skills can be used to upgrade them.
    upgrade_on_click: false

    # Disable clicks altogether
    disable_click: false

    name: '&a{skill} &6[{level}]'
    item-flags: [ 'HIDE_ATTRIBUTES' ]
    lore:
      - ''
      - '{unlocked}&a✔ Wymaga poziomu {unlock}'
      - '{locked}&c✖ Wymaga poziomu {unlock}'
      - '{max_level}&e✔ Osiągnięto maksymalny poziom!'
      - ''
      - '{lore}'
  next:
    slots: [ 48 ]
    function: next
    item: PLAYER_HEAD
    texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTliZjMyOTJlMTI2YTEwNWI1NGViYTcxM2FhMWIxNTJkNTQxYTFkODkzODgyOWM1NjM2NGQxNzhlZDIyYmYifX19
    name: '&aNastępna strona'
    lore: { }
  previous:
    slots: [ 47 ]
    function: previous
    item: PLAYER_HEAD
    texture: eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYmQ2OWUwNmU1ZGFkZmQ4NGU1ZjNkMWMyMTA2M2YyNTUzYjJmYTk0NWVlMWQ0ZDcxNTJmZGM1NDI1YmMxMmE5In19fQ==
    name: '&aPoprzednia strona'
    lore: { }
  reallocate:
    slots: [ 29 ]
    function: reallocation
    item: PAPER
    item_model: 'nexo:mmo_icon_blank'
    hide-flags: true
    name: '&aRozdziel punkty umiejętności od nowa'
    lore:
      - ''
      - 'Wydano łącznie &6{total}&7 punktów umiejętności.'
      - '&7Prawy klik: rozdziel punkty od nowa.'
      - ''
      - '&eKoszt: 1 punkt zmiany umiejętności.'
      - '&e◆ Punkty zmiany umiejętności: &6{points}'
  slot:
    slots: [ 27, 28, 36, 37, 45, 46 ]
    function: slot
    item: GRAY_DYE

    name: '&aMiejsce umiejętności {slot}'
    no-skill: '&cBrak'

    #If this is filled, the item shown in the GUI when a slot is filled will be the item specified here.
    #Else it will be the display item of the bound skill.
    #filled-item:
    #filled-custom-model-data:
    lore:
      - '&7Przypisana umiejętność: &6{skill}'
      - ''
      - '{slot-lore}'
      - '&7&oUżyj: naciśnij [F], a potem'
      - '&7&oklawisz pokazany na pasku akcji.'
      - ''
      - '&e► Lewy klik: przypisz {selected}.'
      - '&e► Prawy klik: usuń przypisanie.'
      - '&e► Shift + lewy klik: wybierz.'
  skill-level:
    slots: [ 41, 42, 43, 50, 51, 52 ]
    function: level

    # Skill level offset, should be changed
    # according to the amount of inventory
    # slots the skill-level item occupies.
    offset: 2

    # Item displayed if the skill level is
    # too low to display a level item in the GUI
    too-low:
      item: AIR

    item: LIME_DYE
    name: '&a{skill} Poziom {roman}'
    lore:
      - ''
      - '{lore}'
  upgrade:
    slots: [ 53 ]
    function: upgrade
    item: GREEN_STAINED_GLASS_PANE
    name: '&a&lULEPSZ {skill_caps}'
    lore:
      - '&7Wybrana umiejętność: &6{skill}'
      - '&7Koszt: 1 punkt umiejętności.'
      - ''
      - '&eDostępne punkty umiejętności: {skill_points}'
