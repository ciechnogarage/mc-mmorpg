name: 'Warsztat: Farmera'
max-queue-size: 10
command:
  name: 'warsztat-farming'
  description: 'Otwiera warsztat profesji farming'
  usage: '/warsztat-farming'
  permission: ''
  aliases: []
recipes:
  'prof_quality_grain':
    output: 'mmoitems{type=MATERIAL,id=PROF_QUALITY_GRAIN}'
    crafting-time: 1
    conditions:
      - 'profession{profession=farming,level=1}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_FRESH_HARVEST,amount=12}'
    triggers:
      - 'exp{profession=farming,amount=12}'
  'prof_flax_fiber':
    output: 'mmoitems{type=MATERIAL,id=PROF_FLAX_FIBER}'
    crafting-time: 2
    conditions:
      - 'profession{profession=farming,level=15}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_FRESH_HARVEST,amount=6}'
    triggers:
      - 'exp{profession=farming,amount=28}'
  'prof_fine_wool':
    output: 'mmoitems{type=MATERIAL,id=PROF_FINE_WOOL}'
    crafting-time: 3
    conditions:
      - 'profession{profession=farming,level=30}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_RAW_FLEECE,amount=4}'
    triggers:
      - 'exp{profession=farming,amount=55}'
  'prof_bait_mix':
    output: 'mmoitems{type=MATERIAL,id=PROF_BAIT_MIX}'
    crafting-time: 4
    conditions:
      - 'profession{profession=farming,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_FRESH_HARVEST,amount=10}'
    triggers:
      - 'exp{profession=farming,amount=95}'
  'prof_alchemical_crop':
    output: 'mmoitems{type=MATERIAL,id=PROF_ALCHEMICAL_CROP}'
    crafting-time: 5
    conditions:
      - 'profession{profession=farming,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_FRESH_HARVEST,amount=8}'
    triggers:
      - 'exp{profession=farming,amount=120}'
gui-layout:
  name: '&f䬠䬡䬢䬣'
  slots: 54
  enable_right_click_preview: false
  items:
    previous_queue_item:
      function: previous_queue_item
      item: ARROW
      name: '&6Poprzednie wyroby'
      slots: [46]

    next_queue_item:
      function: next_queue_item
      item: ARROW
      name: '&6Następne wyroby'
      slots: [47]

    queued_item:
      slots: [36, 37, 38, 39]
      existing:
        name: '&6Kolejka:&f {name}'
        delay_format: 'smhdMy'
        lore:
          - '{ready}&7&oWyrob gotowy.'
          - '{queue}&7Pozostalo: &c{time_left}'
          - ''
          - '{ready}&e> Kliknij, aby odebrac!'
          - '{queue}&e> Kliknij, aby anulowac'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Kolejka pusta'

    recipe:
      function: recipe
      delay_format: smhdMy
      craft:
        name: '&aWytwórz &f{name}'
        name_multiple: '&aWytwórz &f{amount}x {name}'
        lore:
          - '{conditions}'
          - '{conditions}&8Wymagania:'
          - '{crafting_time}'
          - '{crafting_time}&7Czas: &c{crafting_time}'
          - '{ingredients}'
          - '{ingredients}&8Składniki:'
          - '{lore}'
          - ''
          - '&eKliknij, aby wytworzyć.'
      upgrade:
        name: '&eUlepsz &f{name}'
        lore:
          - '{conditions}'
          - '{ingredients}'
          - '{lore}'
      none:
        item: AIR
        name: '&7Brak receptury'
      slots: [14, 15, 16, 17, 23, 24, 25, 26]
