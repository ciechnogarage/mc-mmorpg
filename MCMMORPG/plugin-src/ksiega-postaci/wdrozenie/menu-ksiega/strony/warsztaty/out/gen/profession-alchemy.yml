name: 'Warsztat: Alchemika'
max-queue-size: 10
command:
  name: 'warsztat-alchemy'
  description: 'Otwiera warsztat profesji alchemy'
  usage: '/warsztat-alchemy'
  permission: ''
  aliases: []
recipes:
  'prof_alchemical_base':
    output: 'mmoitems{type=MATERIAL,id=PROF_ALCHEMICAL_BASE}'
    crafting-time: 1
    conditions:
      - 'profession{profession=alchemy,level=1}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_HERBAL_EXTRACT,amount=1}'
    triggers:
      - 'exp{profession=alchemy,amount=12}'
  'prof_antidote':
    output: 'mmoitems{type=MATERIAL,id=PROF_ANTIDOTE}'
    crafting-time: 2
    conditions:
      - 'profession{profession=alchemy,level=15}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_MEDICINAL_HERB,amount=3}'
    triggers:
      - 'exp{profession=alchemy,amount=28}'
  'prof_weapon_oil':
    output: 'mmoitems{type=MATERIAL,id=PROF_WEAPON_OIL}'
    crafting-time: 3
    conditions:
      - 'profession{profession=alchemy,level=30}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_FISH_OIL,amount=2}'
    triggers:
      - 'exp{profession=alchemy,amount=55}'
  'prof_combat_tonic':
    output: 'mmoitems{type=MATERIAL,id=PROF_COMBAT_TONIC}'
    crafting-time: 4
    conditions:
      - 'profession{profession=alchemy,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_VENOM_SAC,amount=1}'
    triggers:
      - 'exp{profession=alchemy,amount=95}'
  'prof_alchemical_solvent':
    output: 'mmoitems{type=MATERIAL,id=PROF_ALCHEMICAL_SOLVENT}'
    crafting-time: 5
    conditions:
      - 'profession{profession=alchemy,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_ALCHEMICAL_CROP,amount=2}'
    triggers:
      - 'exp{profession=alchemy,amount=120}'
gui-layout:
  name: '&f䬐䬑䬒䬓'
  slots: 54
  enable_right_click_preview: false
  items:
    previous_page:
      function: previous_page
      item: ARROW
      name: '&6Poprzednia strona'
      slots: [5]
      hide_if_no_page: true
      no_page:
        item: AIR

    next_page:
      function: next_page
      item: ARROW
      name: '&6Następna strona'
      slots: [8]
      hide_if_no_page: true
      no_page:
        item: AIR

    previous_queue_item:
      function: previous_queue_item
      item: ARROW
      name: '&6Poprzednie wyroby'
      slots: [27]

    next_queue_item:
      function: next_queue_item
      item: ARROW
      name: '&6Następne wyroby'
      slots: [30]

    queued_item:
      slots: [36, 37, 38, 45, 46]
      existing:
        name: '&6Kolejka:&f {name}'
        delay_format: 'smhdMy'
        lore:
          - '{ready}&7&oWyrob gotowy.'
          - '{queue}&7Pozostalo: &c{time_left}'
          - ''
          - '{ready}&e> Kliknij, aby odebrac!'
          - '{queue}&e> Kliknij, aby anulowac'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Kolejka pusta'

    recipe:
      function: recipe
      delay_format: smhdMy
      craft:
        name: '&aWytwórz &f{name}'
        name_multiple: '&aWytwórz &f{amount}x {name}'
        lore:
          - '{conditions}'
          - '{conditions}&8Wymagania:'
          - '{crafting_time}'
          - '{crafting_time}&7Czas: &c{crafting_time}'
          - '{ingredients}'
          - '{ingredients}&8Składniki:'
          - '{lore}'
          - ''
          - '&eKliknij, aby wytworzyć.'
      upgrade:
        name: '&eUlepsz &f{name}'
        lore:
          - '{conditions}'
          - '{ingredients}'
          - '{lore}'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Brak receptury'
      slots: [14, 15, 16, 24, 25]
