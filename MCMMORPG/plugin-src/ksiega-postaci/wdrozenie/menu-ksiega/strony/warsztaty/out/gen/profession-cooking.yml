name: 'Warsztat: Kucharza'
max-queue-size: 10
command:
  name: 'warsztat-cooking'
  description: 'Otwiera warsztat profesji cooking'
  usage: '/warsztat-cooking'
  permission: ''
  aliases: []
recipes:
  'prof_trail_ration':
    output: 'mmoitems{type=CONSUMABLE,id=PROF_TRAIL_RATION}'
    crafting-time: 1
    conditions:
      - 'profession{profession=cooking,level=0}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_WILD_SPICE,amount=2}'
    triggers:
      - 'exp{profession=cooking,amount=12}'
  'prof_fisher_stew':
    output: 'mmoitems{type=CONSUMABLE,id=PROF_FISHER_STEW}'
    crafting-time: 2
    conditions:
      - 'profession{profession=cooking,level=15}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_RARE_FISH,amount=1}'
      - 'mmoitem{type=MATERIAL,id=PROF_WILD_SPICE,amount=1}'
    triggers:
      - 'exp{profession=cooking,amount=28}'
  'prof_hunter_roast':
    output: 'mmoitems{type=CONSUMABLE,id=PROF_HUNTER_ROAST}'
    crafting-time: 3
    conditions:
      - 'profession{profession=cooking,level=30}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_CURED_HIDE,amount=1}'
    triggers:
      - 'exp{profession=cooking,amount=55}'
  'prof_harvest_feast':
    output: 'mmoitems{type=CONSUMABLE,id=PROF_HARVEST_FEAST}'
    crafting-time: 4
    conditions:
      - 'profession{profession=cooking,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_ALCHEMICAL_CROP,amount=1}'
    triggers:
      - 'exp{profession=cooking,amount=95}'
  'prof_master_banquet':
    output: 'mmoitems{type=CONSUMABLE,id=PROF_MASTER_BANQUET}'
    crafting-time: 5
    conditions:
      - 'profession{profession=cooking,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_COMBAT_TONIC,amount=1}'
    triggers:
      - 'exp{profession=cooking,amount=120}'
gui-layout:
  name: '&f䬘䬙䬚䬛'
  slots: 54
  enable_right_click_preview: false
  items:
    previous_queue_item:
      function: previous_queue_item
      item: ARROW
      name: '&6Poprzednie wyroby'
      slots: [46]

    next_queue_item:
      function: next_queue_item
      item: ARROW
      name: '&6Następne wyroby'
      slots: [47]

    queued_item:
      slots: [36, 37, 38, 39]
      existing:
        name: '&6Kolejka:&f {name}'
        delay_format: 'smhdMy'
        lore:
          - '{ready}&7&oWyrob gotowy.'
          - '{queue}&7Pozostalo: &c{time_left}'
          - ''
          - '{ready}&e> Kliknij, aby odebrac!'
          - '{queue}&e> Kliknij, aby anulowac'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Kolejka pusta'

    recipe:
      function: recipe
      delay_format: smhdMy
      craft:
        name: '&aWytwórz &f{name}'
        name_multiple: '&aWytwórz &f{amount}x {name}'
        lore:
          - '{conditions}'
          - '{conditions}&8Wymagania:'
          - '{crafting_time}'
          - '{crafting_time}&7Czas: &c{crafting_time}'
          - '{ingredients}'
          - '{ingredients}&8Składniki:'
          - '{lore}'
          - ''
          - '&eKliknij, aby wytworzyć.'
      upgrade:
        name: '&eUlepsz &f{name}'
        lore:
          - '{conditions}'
          - '{ingredients}'
          - '{lore}'
      none:
        item: AIR
        name: '&7Brak receptury'
      slots: [14, 15, 16, 17, 23, 24, 25, 26]
