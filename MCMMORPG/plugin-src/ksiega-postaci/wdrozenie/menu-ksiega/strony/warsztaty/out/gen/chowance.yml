gui-layout:
  name: '&f䭄䭅䭆䭇&f {page}/{max_page}'
  slots: 54
  enable_right_click_preview: false
  items:
    previous_page:
      function: previous_page
      item: ARROW
      name: '&ePoprzednia strona'
      slots: [5]
      hide_if_no_page: true
      no_page:
        item: GRAY_STAINED_GLASS_PANE
        name: ' '

    next_page:
      function: next_page
      item: ARROW
      name: '&eNastępna strona'
      slots: [8]
      hide_if_no_page: true
      no_page:
        item: GRAY_STAINED_GLASS_PANE
        name: ' '

    previous_queue_item:
      function: previous_queue_item
      item: ARROW
      name: '&6Poprzednie wyroby'
      slots: [27]

    next_queue_item:
      function: next_queue_item
      item: ARROW
      name: '&6Następne wyroby'
      slots: [30]

    queued_item:
      slots: [36, 37, 38, 45, 46]
      existing:
        name: '&6Kolejka:&f {name}'
        delay_format: 'smhdMy'
        lore:
          - '{ready}&7&oWyrób gotowy.'
          - '{queue}&7Pozostało: &c{time_left}'
          - ''
          - '{ready}&e> Kliknij, aby odebrać!'
          - '{queue}&e> Kliknij, aby anulować'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Kolejka pusta'

    recipe:
      function: recipe
      delay_format: smhdMy
      craft:
        name: '&aWytwórz &f{name}'
        name_multiple: '&aWytwórz &f{amount}x {name}'
        lore:
          - '{conditions}'
          - '{conditions}&8Wymagania:'
          - '{crafting_time}'
          - '{crafting_time}&7Czas: &c{crafting_time}'
          - '{ingredients}'
          - '{ingredients}&8Składniki:'
          - '{lore}'
          - ''
          - '&eKliknij, aby wytworzyć.'
      upgrade:
        name: '&eUlepsz &f{name}'
        lore:
          - '{conditions}'
          - '{ingredients}'
          - '{lore}'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Brak receptury'
      slots: [14, 15, 16, 17, 23, 24, 25, 26, 32, 33, 34, 35, 41, 42, 43, 44, 50, 51, 52, 53]
