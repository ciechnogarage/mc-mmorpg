name: 'Warsztat: Myśliwego'
max-queue-size: 10
command:
  name: 'warsztat-hunting'
  description: 'Otwiera warsztat profesji hunting'
  usage: '/warsztat-hunting'
  permission: ''
  aliases: []
recipes:
  'prof_cured_hide':
    output: 'mmoitems{type=MATERIAL,id=PROF_CURED_HIDE}'
    crafting-time: 1
    conditions:
      - 'profession{profession=hunting,level=1}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_BEAST_SCRAP,amount=5}'
    triggers:
      - 'exp{profession=hunting,amount=12}'
  'prof_sinew':
    output: 'mmoitems{type=MATERIAL,id=PROF_SINEW}'
    crafting-time: 2
    conditions:
      - 'profession{profession=hunting,level=15}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_BEAST_SCRAP,amount=8}'
    triggers:
      - 'exp{profession=hunting,amount=28}'
  'prof_beast_bone':
    output: 'mmoitems{type=MATERIAL,id=PROF_BEAST_BONE}'
    crafting-time: 3
    conditions:
      - 'profession{profession=hunting,level=30}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_BEAST_SCRAP,amount=10}'
    triggers:
      - 'exp{profession=hunting,amount=55}'
  'prof_monster_trophy':
    output: 'mmoitems{type=MATERIAL,id=PROF_MONSTER_TROPHY}'
    crafting-time: 4
    conditions:
      - 'profession{profession=hunting,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_BEAST_BONE,amount=4}'
    triggers:
      - 'exp{profession=hunting,amount=95}'
  'prof_venom_sac':
    output: 'mmoitems{type=MATERIAL,id=PROF_VENOM_SAC}'
    crafting-time: 5
    conditions:
      - 'profession{profession=hunting,level=45}'
    ingredients:
      - 'mmoitem{type=MATERIAL,id=PROF_BEAST_SCRAP,amount=12}'
    triggers:
      - 'exp{profession=hunting,amount=120}'
gui-layout:
  name: '&f䬬䬭䬮䬯'
  slots: 54
  enable_right_click_preview: false
  items:
    previous_queue_item:
      function: previous_queue_item
      item: ARROW
      name: '&6Poprzednie wyroby'
      slots: [46]

    next_queue_item:
      function: next_queue_item
      item: ARROW
      name: '&6Następne wyroby'
      slots: [47]

    queued_item:
      slots: [36, 37, 38, 39]
      existing:
        name: '&6Kolejka:&f {name}'
        delay_format: 'smhdMy'
        lore:
          - '{ready}&7&oWyrob gotowy.'
          - '{queue}&7Pozostalo: &c{time_left}'
          - ''
          - '{ready}&e> Kliknij, aby odebrac!'
          - '{queue}&e> Kliknij, aby anulowac'
      none:
        item: GRAY_STAINED_GLASS_PANE
        name: '&7Kolejka pusta'

    recipe:
      function: recipe
      delay_format: smhdMy
      craft:
        name: '&aWytwórz &f{name}'
        name_multiple: '&aWytwórz &f{amount}x {name}'
        lore:
          - '{conditions}'
          - '{conditions}&8Wymagania:'
          - '{crafting_time}'
          - '{crafting_time}&7Czas: &c{crafting_time}'
          - '{ingredients}'
          - '{ingredients}&8Składniki:'
          - '{lore}'
          - ''
          - '&eKliknij, aby wytworzyć.'
      upgrade:
        name: '&eUlepsz &f{name}'
        lore:
          - '{conditions}'
          - '{ingredients}'
          - '{lore}'
      none:
        item: AIR
        name: '&7Brak receptury'
      slots: [14, 15, 16, 17, 23, 24, 25, 26]
