# MENU GLOWNE — klawisz Q przechwytywany przez MenuKey.
# open_command to furtka dla gracza z pusta reka: Q nie wywoluje wtedy zdarzenia wyrzucenia.
# CoreTools otwiera menu przez konsolowe `dm open hub_glowne <gracz>`, bo open_command
# DeluxeMenus nie jest komenda zarejestrowana dla dispatchera konsoli.
# Kafelki 2x2 i pusty grzbiet: wdrozenie/menu-ksiega/k12/sloty.txt.
menu_title: '&f䅨䅩䅪䅫'
