# Zaklecia w dloni (Skyrim). Plugin prowadzi rzucanie i wyswietla strumien, MythicMobs odtwarza efekty oraz zadaje obrazenia.
#
# id zaklecia -> przedmiot MythicMobs (nosnik w dloni), koszt many za TIK (tik = 10 tickow = 0,5 s), nazwa.
zaklecia:
  plomienie:
    przedmiot: ZAKLECIE_PLOMIENIE
    mana-za-tik: 2.0
    nazwa: 'Płomienie'
    skille:
      obraz: ''
      dlon: ''
  odmrozenie:
    przedmiot: ZAKLECIE_ODMROZENIE
    mana-za-tik: 2.5
    nazwa: 'Odmrożenie'
    skille:
      obraz: ''
      dlon: ''

# Podwojne rzucanie (TO SAMO zaklecie w obu dloniach): koszt = koszt jednej reki x mnoznik.
# Dwie osobne rece kosztowalyby x2; podwojne jest drozsze, a MythicMobs daje mu ~2,2x obrazen (Traf2).
podwojne-mnoznik-many: 2.5

# Kazde zaklecie ma wlasne skille w MythicMobs/skills/zaklecia/<id>.yml.
# Domyslnie Zak_<Id>_Start/Stop/Tik/Traf/Uderzenie. Start, Stop, Traf i Uderzenie
# uzywaja odmian _P/_L; Traf i Start maja tez _Obie. Nadpisz baze w skille.<typ>.
# Opcjonalne skille obraz i dlon sa domyslnie puste.
skille:
  brak-many: Zak_BrakMany

# Stozek obrazen liczony przez plugin (od oczu gracza): zasieg w blokach, pol-kat w stopniach.
stozek:
  zasieg: 6
  pol-kat: 20
stozek-podwojny:
  zasieg: 7
  pol-kat: 22.5

# Klawisz Q (plugin MenuKey wola "zaklecia q <gracz>"): bez Shiftu hub, z Shiftem szybkie ulubione (jak Q w Skyrimie).
klawisz-q:
  zwykle: 'dm open hub_glowne %gracz%'
  z-shiftem: 'dm open ulubione_zaklec %gracz%'

# Wejscie przytrzymanych przyciskow i atrybuty trybu zaklec.
ppm-tolerancja: 7
rowno: 4
zasieg-blokow: 0
kotwica:
  wlaczona: false
  min: 3
  max: 16
  wyprzedzenie: 1.0
spowolnienie: -0.5
