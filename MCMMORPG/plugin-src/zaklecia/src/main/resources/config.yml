# Zaklecia w dloni (Skyrim). Plugin prowadzi rzucanie (obie rece), MythicMobs rysuje i zadaje obrazenia.
#
# id zaklecia -> przedmiot MythicMobs (nosnik w dloni), koszt many za TIK (tik = 10 tickow = 0,5 s), nazwa.
zaklecia:
  plomienie:
    przedmiot: ZAKLECIE_PLOMIENIE
    mana-za-tik: 2.0
    nazwa: 'Płomienie'
  odmrozenie:
    przedmiot: ZAKLECIE_ODMROZENIE
    mana-za-tik: 2.5
    nazwa: 'Odmrożenie'

# Podwojne rzucanie (TO SAMO zaklecie w obu dloniach): koszt = koszt jednej reki x mnoznik.
# Dwie osobne rece kosztowalyby x2; podwojne jest drozsze, a MythicMobs daje mu ~2,2x obrazen (Traf2).
podwojne-mnoznik-many: 2.5

# Skille MythicMobs wolane przez plugin (plik MythicMobs/skills/Zaklecia.yml).
skille:
  start: Zak_Start
  stop: Zak_Stop
  obraz: ''               # stary strumien z pociskow MM (Zak_Obraz); pusto = strumien jako obiekt wyswietlany
  tik: Zak_Tik            # co 10 tickow, po pobraniu many (dzwieki)
  trafienia: Zak_Trafienia  # co 10 tickow, z celami stozka jako celami skilla
  brak-many: Zak_BrakMany
  dlon: ''                # czasteczki przy dloni co 4 ticki (Zak_Dlon); pusto = tylko animowany model dloni

# Stozek obrazen liczony przez plugin (od oczu gracza): zasieg w blokach, pol-kat w stopniach.
stozek:
  zasieg: 6
  pol-kat: 20
stozek-podwojny:
  zasieg: 7
  pol-kat: 22.5

# Klawisz Q (plugin MenuKey wola "zaklecia q <gracz>"): bez Shiftu hub, z Shiftem szybkie ulubione (jak Q w Skyrimie).
klawisz-q:
  zwykle: 'dm open hub_glowne %gracz%'
  z-shiftem: 'dm open ulubione_zaklec %gracz%'

# Wejscie przytrzymanych przyciskow i atrybuty trybu zaklec.
ppm-tolerancja: 6
lpm-tolerancja: 3
lpm-impuls: 10
lpm-zasieg-blokow: 24
spowolnienie: -0.5
