name: Zaklecia
version: '${version}'
main: pl.mcmmorpg.zaklecia.Zaklecia
api-version: '1.21'
depend: [MythicMobs, MMOCore, packetevents]
softdepend: [PlaceholderAPI]
description: Ciche mechaniki zasobow MMOCore dla zaklec MythicMobs/Crucible (Plomienie, Odmrozenie).
commands:
  zaklecia:
    description: Przypisanie zaklecia do dloni (wolane z Ksiegi zaklec jako konsola)
    usage: /zaklecia przypisz <gracz> <zaklecie|nic> <prawa|lewa> | /zaklecia ulubione <gracz> <zaklecie> | /zaklecia q <gracz> | /zaklecia pasek <gracz> ciecie <liczba> <razem>
    permission: zaklecia.admin
permissions:
  zaklecia.admin:
    default: op
