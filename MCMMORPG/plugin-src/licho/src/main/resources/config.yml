# Licho nie śpi — prop hunt w Zagrodzie Zielarki. Czasy w sekundach. Bez łupu i EXP: punkty tylko do rankingu.
swiat: licho
debug: false
# Gdzie wyrzucić gracza, który znalazł się w świecie gry bez zapisanego punktu powrotu.
swiaty-awaryjne: [stolica_odnowa, stolica, world]
# Z tych światów można wyruszyć do gry (nie z areny, lochu ani kreatora).
swiaty-wejscia: [world, stolica_odnowa, stolica]

gracze:
  min: 2
  max: 12
  na-zamawiacza: 4          # 1 Zamawiacz na każdych 4 graczy (min. 1)

czasy:
  poczekalnia: 25           # odliczanie od chwili, gdy jest 2 graczy
  poczekalnia-za-gracza: 5  # każdy kolejny gracz przedłuża odliczanie...
  poczekalnia-max: 45       # ...ale nie ponad tyle
  rozproszenie: 30
  lowy: 180
  podsumowanie: 8

licho:
  iskry: 3
  zastygniecie: 1.5         # tyle s bez ruchu = sprzęt wskakuje w siatkę i staje się blokiem
  zasieg-wcielenia: 5
  wcielenie-co: 20          # w łowach; w rozproszeniu bez ograniczeń
  psota-co: 15
  psota-sluch: 12           # psota daje punkty tylko, gdy Zamawiacz jest bliżej niż tyle bloków
  szept-co: 40
  szept-co-koniec: 15       # w ostatnich 30 s
  szept-zasieg: 12

zamawiacz:
  tchu: 6
  tchu-co: 10               # +1 tchu co tyle s
  zadyszka: 4
  cios-co: 0.5
  zasieg-ciosu: 4.5
  okadzanie-co: 25
  okadzanie-promien: 5

punkty:
  licho-co-10s: 1
  psota: 5
  przetrwanie: 15
  trafienie: 3
  zlapanie: 10

mapa:
  nazwa: 'Zagroda Zielarki'
  obszar: [-23, 60, -21, 23, 70, 21]   # x1 y1 z1 x2 y2 z2 — poza nim gracz wraca do bramy
  poczekalnia: [0.5, 64, 8.5, 180]
  brama: [0.5, 64, 18.5, 180]
  komora: [0.5, 41, 0.5, 0]

# Sprzęty, w które Licho może się wcielić (tylko pełne bloki z modelem — BlockDisplay nie rysuje skrzyń ani dzbanów).
# Na każdym takim sprzęcie z mapy stoi w rundzie niewidzialna zaczepa (ten sam hitbox co Licho).
przebrania:
  barrel: Beczka
  hay_block: Snopek siana
  composter: Kompostownik
  cauldron: Kocioł
  pumpkin: Dynia
  carved_pumpkin: Wydrążona dynia
  stripped_oak_log: Pniak
  oak_log: Kłoda
  beehive: Ul
  smoker: Wędzarnia
  loom: Krosno
  chiseled_bookshelf: Półka z księgami
