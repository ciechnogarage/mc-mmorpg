name: LochyPoprawki
version: '${version}'
main: pl.mcmmorpg.lochypoprawki.LochyPoprawki
api-version: '1.21'
depend: [MythicDungeons]
description: Poprawki MythicDungeons 2.0.1 (zamykanie instancji gracza solo po rozlaczeniu; komenda konsoli lochy sygnal).
commands:
  lochy:
    description: lochy sygnal <gracz> <nazwa> [ticki] - sygnal MD do instancji gracza (TriggerRemote w functions.yml)
    permission: lochypoprawki.sygnal
permissions:
  lochypoprawki.sygnal:
    default: op
