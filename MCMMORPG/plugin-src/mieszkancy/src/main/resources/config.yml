# Mieszkancy — życie Stolicy (świat stolica_odnowa). Po zmianie: /mieszkancy przeladuj (bez restartu).
# Wszystkie encje są nieprzetrwałe: plugin stawia je, gdy chunk jest wczytany, i nic nie zapisuje do świata.
# Współrzędne: [x, y, z] albo [x, y, z, yaw]. Teksty: MiniMessage.
debug: false
swiat: stolica_odnowa
srodek: [0, 101, 0]
# Pętle (NPC, przechodnie, efekty) liczą się tylko, gdy w tym promieniu od środka jest gracz.
promien-aktywny: 120
# Ścieżka względem plugins/Mieszkancy/ — 16 podpisanych skórek kreatora (rasa_klasa).
skorki-plik: ../CharacterCreator/skins.yml
# Villagery bez AI w tym świecie (stare NPC MythicMobs ze Stolicy v2) są usuwane przy wczytaniu chunka.
# Spawnery stolica2_* trzeba zdjąć z MythicMobs, inaczej będą je odradzać co 60 s.
usun-stare-villagery: true

# Tabliczki ze Stolicy v2 (stary format, bez polskich znaków) — zdejmowane (setblock air), gdy ich chunk jest
# wczytany. Plugin sprawdza, że w tym miejscu NAPRAWDĘ stoi tabliczka; inny blok zostaje nietknięty.
usun-tabliczki:
  - [-9, 102, -52]
  - [9, 102, -52]
  - [0, 102, -52]
  - [0, 104, -38]
  - [-3, 102, -29]
  - [-9, 102, -31]
  - [9, 102, -31]
  - [3, 102, -29]
  - [-30, 104, -34]
  - [12, 102, 2]
  - [-12, 102, 2]
  - [37, 104, 20]
  - [0, 109, 51]
  - [28, 104, 48]
  - [32, 104, -35]
  - [-35, 104, 20]

