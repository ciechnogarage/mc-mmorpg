acceptance_criteria:
  silhouette_and_family:
    - id: AC-SIL-01
      criterion: Flat-black front, side, back, and three-quarter views read as one grounded quadruped predator without relying on texture.
      evidence: [front, side, back, three_quarter, black_three_quarter]
    - id: AC-SIL-02
      criterion: Side silhouette length is at least 1.8 times total visual height and retains visible belly clearance.
      evidence: [side]
    - id: AC-SIL-03
      criterion: Head wedge, shoulder shelf, rib taper, hip drive, and rear counterweight form a descending readable mass sequence.
      evidence: [side, three_quarter]
  role_and_distance:
    - id: AC-ROLE-01
      criterion: At 15 to 30 blocks, a reviewer identifies a fast chase or flank predator and the single forward threat origin without reading the asset name.
      evidence: [player_scale, three_quarter]
    - id: AC-ROLE-02
      criterion: The mob reads subordinate to a player-scale miniboss profile; shoulder height stays between 45 and 65 percent of player height and no permanent feature exceeds 80 percent.
      evidence: [player_scale]
  construction_and_negative_space:
    - id: AC-CON-01
      criterion: Belly, inner-leg, head-neck, and tail-body negative spaces remain visible in neutral, idle extreme, lunge contact, and recovery.
      evidence: [side, three_quarter, idle_peak, lunge_contact, lunge_recovery]
    - id: AC-CON-02
      criterion: All four upper-lower-foot chains support the center of mass with no floating contacts, uniform bamboo limbs, or accidental intersections.
      evidence: [front, side, back, lunge_recovery]
    - id: AC-CON-03
      criterion: Bark, root, moss, and corruption treatment reinforces the five-mass hierarchy; no detail rescues or obscures a failed shell.
      evidence: [front, side, three_quarter, black_three_quarter]
  rig_and_animation:
    - id: AC-ANIM-01
      criterion: Idle is a closed 1.5 to 3.0 second loop on the 0.05-second grid with four planted feet and no visible pop.
      evidence: [idle_start, idle_peak, idle_end]
    - id: AC-ANIM-02
      criterion: Lunge is a non-looping 0.8 to 1.4 second action with distinct anticipation, chest-led action, contact, follow-through, and stable recovery.
      evidence: [lunge_anticipation, lunge_contact, lunge_follow_through, lunge_recovery]
    - id: AC-ANIM-03
      criterion: Lunge reads as root-mask or thorn-snout commitment rather than copied canine bite anatomy, and no gameplay impact tick is claimed.
      evidence: [lunge_anticipation, lunge_contact, lunge_follow_through]
  originality_and_scope:
    - id: AC-ORIG-01
      criterion: Independent visual QA finds no copied reference outline, anatomy, pose, texture, branded motif, bone transform, or keyframe sequence.
      evidence: [independent_visual_verdict]
    - id: AC-SCOPE-01
      criterion: Editable sources exist only under the pilot source root and all review evidence exists only under the pilot evidence root.
      evidence: [source_hash_record, render_manifest, independent_visual_verdict]

gate_separation:
  art_gate:
    gate: ART_PASS
    current_status: pending_independent_visual_qa
    authority: independent_visual_critic
    requires:
      - exact AssetSpec SHA-256
      - exact editable-source SHA-256
      - SHA-256 for every required render
      - every acceptance criterion satisfied with no known issue
    proves: exact hash-bound source and renders satisfy this AssetSpec
    does_not_prove:
      - plugin integration
      - ModelEngine or Nexo activation
      - runtime behavior
      - release readiness
  integration_gate:
    gate: INTEGRATION_PASS
    current_status: not_requested_for_direction_scope
    authority: "17"
    requires_before_future_evaluation:
      - exact source and configuration hashes
      - profile-aware static validator results
      - production job receipt from domain 18
    proves_if_later_granted: exact hashes pass declared static integration checks
    does_not_prove:
      - art quality
      - plugin activation
      - client delivery
      - runtime behavior
  runtime_gate:
    gate: RUNTIME_PASS
    current_status: not_authorized
    authority: "17"
    requires_before_future_evaluation:
      - separate explicit runtime approval
      - exact source, configuration, export, and pack hashes
      - isolated runtime and real-client evidence
    proves_if_later_granted: only the exact tested hashes behaved as recorded at runtime
    does_not_prove:
      - future builds
      - changed sources
      - changed configuration
  release:
    current_status: blocked_non_deploy_pilot
    deployment_or_pack_promotion_allowed: false
    note: ART_PASS, INTEGRATION_PASS, and RUNTIME_PASS are independent, non-transitive, and cannot be inferred from one another.

handoff:
  next_owner: domain_18_blockbench_authoring_job
  authoring_scope:
    - create only the declared editable source and its sibling texture source under the pilot source root
    - implement selected direction A, the declared rig, and only idle plus lunge
    - capture required evidence only under the pilot evidence root
  authoring_forbidden:
    - changing this AssetSpec to justify the built result
    - treating references as geometry or animation templates
    - issuing ART_PASS for builder output
    - touching plugins, staging, server state, generated packs, caches, or runtime data
  unresolved_for_any_future_deploy:
    - Domain 07 must separately bind lunge timing and gameplay events to a real encounter.
    - Domain 18 and Domain 17 must define and evaluate plugin integration evidence if deployment is later requested.
    - Runtime work remains forbidden without separate explicit approval.
