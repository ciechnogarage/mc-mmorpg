silhouette_directions:
  - id: A
    name: root_lurker_hound
    selected: true
    optimization: fastest low-long chase read with one clean forward threat
    dominant_masses:
      - root-mask head wedge
      - compressed shoulder shelf
      - narrow rib taper
      - compact propulsion hips
      - dragged-root rear counterweight
    negative_space_plan:
      - open belly channel between fore and rear contact zones
      - readable notch between head wedge and shoulder shelf
      - four separated limb chains with visible inner-leg gaps
      - rear gap before the counterweight leaves the hip mass
    falsifiable_checks:
      - front silhouette reads predator rather than pod, shrine, or humanoid
      - side silhouette keeps length-to-height ratio at or above 1.8
      - removing all texture and moss does not break family or role read
      - one forward threat origin remains identifiable at 15 to 30 blocks

  - id: B
    name: one_side_thorn_raptor
    selected: false
    optimization: strongest flank-pressure signal through a dominant attack side
    material_difference_from_A: threat-side forelimb, cheek, and shoulder create a hooked diagonal instead of A's balanced prow
    rejection_risk: full-body asymmetry fragments the organism and competes with locomotion mass
    allowed_borrow_into_A: one attack-side accent only

  - id: C
    name: burrow_stalker_mask_beast
    selected: false
    optimization: strongest frontal ambush menace through an oversized root mask and compressed rear
    material_difference_from_A: front mask dominates a shorter trunk and reduced counterweight instead of A's chase-length axis
    rejection_risk: shortened rear collapses into stump, shrine, turret, or furniture read
    allowed_borrow_into_A: one singular forward threat origin only

selected_silhouette_direction:
  id: A
  name: root_lurker_hound
  selection_basis:
    family_read: strongest low-long predator read after all texture is removed
    role_read: fastest chase-add and flank-pressure recognition at player distance
    scale_read: subordinate mob proportions remain below miniboss presence
    dominant_shape: root-mask wedge and shoulder shelf form one forward prow
    negative_space: best belly, limb-chain, head-neck, and rear-counterweight separation
    animation_support: preserves its identity in both loaded idle and chest-led lunge

required_animations:
  - name: idle
    loop: loop
    minimum_duration_seconds: 1.5
    maximum_duration_seconds: 3.0
    timing_grid_seconds: 0.05
    required_motion:
      - closed loop with no visible pop
      - subtle chest and head load shift while all four feet remain planted
      - restrained tail or rear-root counterbalance
      - silhouette remains low, forward-loaded, and asymmetrically focused
    forbidden_motion:
      - constant twitching
      - breathing that expands the body into one uniform log
      - foot sliding or floating contacts

  - name: lunge
    loop: once
    minimum_duration_seconds: 0.8
    maximum_duration_seconds: 1.4
    timing_grid_seconds: 0.05
    required_phases:
      - anticipation: rear compression and slight threat-block withdrawal
      - action: chest commits forward before the head threat reaches contact
      - contact: one readable forward threat origin without a bound gameplay event
      - follow_through: spine and rear counterweight continue the action path
      - recovery: stable low stance with readable foot contact
    forbidden_motion:
      - head-only jab
      - teleport-like translation without rear push
      - copied bite motion or jaw anatomy
      - recovery ending off-balance or above the intended scale envelope

