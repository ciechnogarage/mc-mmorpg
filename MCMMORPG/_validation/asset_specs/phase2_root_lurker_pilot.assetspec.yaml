schema_version: 1

asset_spec:
  asset_spec_id: phase2_root_lurker_pilot.assetspec
  asset_spec_version: 1.0.0
  asset_id: phase2_root_lurker_pilot
  asset_type: mob
  requesting_domain: "07"
  visual_contract_owner: "15"
  production_orchestration_owner: "18"
  evidence_and_release_owner: "17"
  contract_ref:
    path: docs/contracts/visual-asset-domain-handoff-contract.yaml
    contract_id: visual-asset-domain-handoff-v1
    contract_version: 1
  semantic_brief_ref:
    path: MCMMORPG/_validation/work_packets/level_1_moss_stalker_art_brief_packet.md
    sha256: f900ec05faae0aa25b45b0affc29ff5071c6cb2ca19a61fd2a71f80c0a53ac4d
    adaptation: local_non_deploy_phase2_pilot_with_a_new_asset_id
  status: direction_approved_ready_for_local_authoring
  deploy_asset: false

  domain_constraints:
    encounter_ref:
      kind: local_visual_pilot
      id: phase2_root_lurker_pilot
      source: MCMMORPG/_validation/work_packets/level_1_moss_stalker_art_brief_packet.md
      runtime_binding: none
    combat_role: fast_flank_pressure_chase_add
    encounter_intent:
      - subordinate mobile grove predator, never a boss or miniboss read
      - one clear forward attack side supports a readable lunge telegraph
      - visual mass must communicate pursuit speed before surface detail is read
    telegraph_and_timing_constraints:
      idle:
        intent: loaded crouch with restrained weight transfer
        gameplay_event_binding: none_for_local_pilot
      lunge:
        intent: chest-led forward commitment with visible anticipation, contact, and recovery
        gameplay_event_binding: deliberately_unset_by_domain_07
        note: Visual contact may be posed, but this AssetSpec does not define damage, skill timing, or encounter pacing.
    viewing_distance_blocks:
      minimum: 15
      maximum: 30
    locomotion_read: low_long_grounded_quadruped
    dominant_visual_promise: corrupted_grove_hunter
    must_read_as:
      - low prowling predator
      - forequarter-led chase add
      - rooted grove-corruption organism
    must_not_be_confused_with:
      - literal wolf reskin
      - humanoid druid or treant boss
      - plant turret or flower pod
      - shrine, furniture, or bark sculpture with legs
      - generic armored zombie with foliage

  profile_version_refs:
    asset_family_profile: phase2_local_mob.v1
    style_profile: level_1_grove_corruption_predator.v1
    rig_archetype_profile: quadruped_predator.v1
    delivery_profile: modelengine_entity.local_pilot.v1
    geometry_budget: phase2_root_lurker_geometry.v1
    texture_budget: phase2_root_lurker_texture.v1
    performance_budget: phase2_root_lurker_performance.v1
  style_profile: level_1_grove_corruption_predator.v1
  rig_archetype: quadruped
  delivery_profile: modelengine_entity

  path_policy:
    write_allowed_paths:
      - MCMMORPG/_validation/asset_specs/phase2_root_lurker_pilot.assetspec.yaml
      - MCMMORPG/_validation/pilots/phase2_root_lurker_pilot/
      - MCMMORPG/_validation/model_reviews/phase2_root_lurker_pilot/
    editable_source_root: MCMMORPG/_validation/pilots/phase2_root_lurker_pilot/
    evidence_root: MCMMORPG/_validation/model_reviews/phase2_root_lurker_pilot/
    forbidden_paths:
      - plugins/**
      - MCMMORPG/plugins/**
      - MCMMORPG/source/**
      - MCMMORPG/environments/**
      - MCMMORPG/runtime/**
      - MCMMORPG/world*/**
      - staging/**
    operational_prohibitions:
      - no server start, reload, stop, or runtime probe
      - no staging, live, Nexo pack, ModelEngine cache, or MythicMobs mutation
      - no world, player data, economy, permission, secret, or deployment change
      - no direct JSON generation or patching of a bbmodel
      - no source or evidence output outside the two declared pilot roots

  editable_source_ref:
    path: MCMMORPG/_validation/pilots/phase2_root_lurker_pilot/phase2_root_lurker_pilot.bbmodel
    state: planned_not_created_by_asset_direction
    format: bbmodel
    mutation_policy: approved_transactional_blockbench_mcp_only
    texture_policy: embedded_or_sibling_files_only_under_editable_source_root
    generated_exports_are_authoring_sources: false
  integration_targets:
    - id: local_modelengine_entity_source_compatibility
      mode: static_local_only
      deploy_target: none
    - id: nexo_merged_pack_contract
      mode: declaration_only
      merged_pack_owner: Nexo
      pack_build_authorized: false
  acceptance_criteria:
    details_ref: $.acceptance_criteria
    required_ids:
      - AC-SIL-01
      - AC-SIL-02
      - AC-SIL-03
      - AC-ROLE-01
      - AC-ROLE-02
      - AC-CON-01
      - AC-CON-02
      - AC-CON-03
      - AC-ANIM-01
      - AC-ANIM-02
      - AC-ANIM-03
      - AC-ORIG-01
      - AC-SCOPE-01

profiles:
  asset_family_profile:
    profile_id: phase2_local_mob
    version: 1
    asset_type: mob
    required_views:
      - front
      - side
      - back
      - three_quarter
      - player_scale
    required_states_or_animations:
      - idle
      - lunge
    geometry_budget_ref: phase2_root_lurker_geometry.v1
    texture_budget_ref: phase2_root_lurker_texture.v1
    performance_budget_ref: phase2_root_lurker_performance.v1
    allowed_delivery_profiles:
      - modelengine_entity

  style_profile:
    style_profile_id: level_1_grove_corruption_predator
    version: 1
    scope: asset_family
    shape_language:
      - low-long hunting axis
      - wedge-shaped root mask leading a compressed shoulder shelf
      - narrow rib taper into compact propulsion hips
      - dragged-root rear counterweight
      - one controlled attack-side break
    proportion_rules:
      - body-axis length must be at least 1.8 times total visual height in the side silhouette
      - shoulder line must sit above the abdomen and lead the mass hierarchy
      - abdomen must visibly narrow between forequarter and hindquarter masses
      - player-scale shoulder height must read between 45 and 65 percent of player height
      - no permanent feature may make the mob read taller than 80 percent of player height
    palette_and_material_rules:
      - dark low-saturation bark and root planes carry primary mass
      - moss is a secondary softening accent and cannot define the silhouette
      - one restrained corruption seam, node, or eye slit carries the highest focal contrast
      - surface direction follows root and bark flow instead of random pixel noise
    contrast_and_detail_density:
      - strongest contrast is reserved for the forward threat origin
      - tertiary detail is sparse and subordinate at 15 to 30 blocks
      - untextured silhouette must preserve family and role readability
    ornament_and_emissive_rules:
      - no ornamental armor, antlers, flowers, or equal-weight spikes
      - emissive treatment is optional and, if used, limited to one combat-relevant focal area
      - permanent VFX geometry is forbidden; future lash or root burst spectacle stays modular
    animation_language:
      - motion begins in rear compression and chest commitment, then travels into the head threat block
      - idle shows stored forward pressure without constant twitching
      - lunge has readable anticipation, action path, contact pose, follow-through, and stable recovery
      - all authored key times align to 0.05-second increments
    performance_budget_ref: phase2_root_lurker_performance.v1
    forbidden_traits:
      - literal naturalistic canine muzzle, ears, paws, rib cage, or fur breakup
      - upright humanoid torso or shoulder-waist-leg hierarchy
      - symmetric stalk, pod, flower-head, turret, shrine, or furniture read
      - one-thickness log body or bamboo-like uniform limbs
      - random bilateral mismatch presented as character
      - moss, spikes, glow, or texture noise used to rescue a failed shell
      - floating cubes, unsupported mass, paper-thin accidental surfaces, or hidden duplicate geometry
      - permanently fused attack FX that obscures the core organism
    approved_reference_ids:
      - moss_stalker_reference_study
      - moss_stalker_silhouette_candidates
      - direwolf_render_front
      - direwolf_render_side
      - direwolf_render_three_quarter
      - direwolf_render_player_scale
      - direwolf_motion_idle
      - direwolf_motion_attack_phases
    anti_reference_ids:
      - previous_moss_stalker_backup

  rig_archetype_profile:
    profile_id: quadruped_predator
    version: 1
    rig_archetype: quadruped
    hierarchy_rules:
      - root owns chest and lower-back body chains
      - chest owns head threat assembly and both front limb chains
      - lower_back owns both rear limb chains and the rear counterweight chain
      - visual cubes belong to exactly one intended bone
      - hitbox and helper bones remain separate from rendered anatomy
    required_bones_or_locators:
      - root
      - chest
      - lower_back
      - head
      - threat_tip
      - left_front_upper
      - left_front_lower
      - left_front_foot
      - right_front_upper
      - right_front_lower
      - right_front_foot
      - left_back_upper
      - left_back_lower
      - left_back_foot
      - right_back_upper
      - right_back_lower
      - right_back_foot
      - tail_base
      - tail_mid
      - tail_tip
      - hitbox
    required_states_or_animations:
      - idle
      - lunge
    pivot_and_deformation_rules:
      - pivots sit at anatomical rotation centers for head, legs, feet, and rear counterweight segments
      - mirrored bilateral chains are mechanically symmetric before the selected attack-side accent is introduced
      - feet preserve ground contact in neutral idle and lunge recovery
      - head and threat_tip remain independently poseable for anticipation and contact
      - belly, inner-leg, head-neck, and tail-body negative spaces survive animation extremes
    profile_specific_invalid_fixtures:
      - humanoid arm and leg naming substituted for quadruped limb chains
      - any missing upper-lower-foot segment in one of the four leg chains
      - hitbox parented inside a rendered limb or head chain
      - single rigid body chain with legs attached as decorative supports
      - idle without a closed loop
      - lunge without distinct anticipation, contact, and recovery poses

  delivery_profile:
    profile_id: modelengine_entity.local_pilot
    version: 1
    delivery_profile: modelengine_entity
    editable_source_policy: approved_transactional_blockbench_mcp_only
    presentation_owner: ModelEngine
    merged_pack_owner: Nexo
    integration_targets:
      - local_modelengine_entity_source_compatibility
      - nexo_merged_pack_contract_declaration_only
    static_validation_commands:
      - "node MCMMORPG/_validation/render_bbmodel_review.js --blueprint MCMMORPG/_validation/pilots/phase2_root_lurker_pilot/phase2_root_lurker_pilot.bbmodel --output MCMMORPG/_validation/model_reviews/phase2_root_lurker_pilot"
      - "sha256sum MCMMORPG/_validation/pilots/phase2_root_lurker_pilot/phase2_root_lurker_pilot.bbmodel"
    runtime_evidence_requirements:
      status: not_authorized_for_this_local_pilot
      required_before_any_future_runtime_pass:
        - explicit approval to use an isolated runtime
        - exact source, configuration, export, and merged-pack SHA-256 values
        - client-visible spawn and animation evidence for the exact hashes
        - collision, scale, orientation, ground-contact, and player-distance proof

  budgets:
    geometry:
      profile_id: phase2_root_lurker_geometry
      version: 1
      maximum_rendered_elements: 96
      maximum_visual_bones: 28
      maximum_hierarchy_depth: 6
      required_hidden_hitbox_cubes: 1
      note: These are pilot ceilings, not quality targets; unused budget must not be filled with decorative noise.
    texture:
      profile_id: phase2_root_lurker_texture
      version: 1
      maximum_canvas: 64x64
      diffuse_textures: 1
      optional_emissive_textures: 1
      uv_requirements:
        - every rendered face has an in-bounds mapping
        - no unintended overlap between unlike materials
        - coherent texel density across neighboring primary masses
    performance:
      profile_id: phase2_root_lurker_performance
      version: 1
      scope: local_single_entity_art_pilot
      maximum_concurrent_entity_claim: 1
      runtime_performance_claim_allowed: false
      constraints:
        - stay within geometry and rig ceilings
        - no permanent helper VFX model
        - no runtime, FPS, TPS, packet, or multi-entity claim from static evidence

