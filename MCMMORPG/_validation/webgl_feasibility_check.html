<!doctype html>
<html><body style="margin:0">
<script src="three.js"></script>
<script>
window.probeResult = 'not run';
try {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(480, 480);
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e1712);
  const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(60, 60, 60);
  camera.lookAt(0, 0, 0);
  const light = new THREE.DirectionalLight(0xffffff, 1.2);
  light.position.set(1, 2, 1);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0x445544, 0.6));
  const geo = new THREE.BoxGeometry(20, 20, 20);
  const mat = new THREE.MeshStandardMaterial({ color: 0x8a4a3a });
  const cube = new THREE.Mesh(geo, mat);
  scene.add(cube);
  renderer.render(scene, camera);
  window.probeResult = 'rendered:' + renderer.getContext().getParameter(renderer.getContext().VERSION);
} catch (e) {
  window.probeResult = 'error:' + e.message;
}
</script>
</body></html>
