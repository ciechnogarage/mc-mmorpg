<!doctype html>
<html><body style="margin:0">
<script src="three.js"></script>
<script>
function loadTexture(dataUri) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const tex = new THREE.Texture(img);
      tex.flipY = false;
      tex.wrapS = THREE.ClampToEdgeWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      tex.needsUpdate = true;
      resolve(tex);
    };
    img.onerror = reject;
    img.src = dataUri;
  });
}

window.renderSpec = async function renderSpec(spec) {
try {
  const width = spec.size;
  const height = spec.size;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(width, height);
  renderer.setClearColor(0x141a16, 1);
  document.body.appendChild(renderer.domElement);
  console.log('renderer created');

  const scene = new THREE.Scene();

  const loaded = await Promise.all(spec.textures.map(async (t) => [t.index, await loadTexture(t.dataUri)]));
  const textures = new Map(loaded);
  console.log('loaded', textures.size, 'textures');

  const box = { min: [Infinity, Infinity, Infinity], max: [-Infinity, -Infinity, -Infinity] };
  for (const g of spec.groups) {
    for (let i = 0; i < g.positions.length; i += 3) {
      for (let k = 0; k < 3; k++) {
        box.min[k] = Math.min(box.min[k], g.positions[i + k]);
        box.max[k] = Math.max(box.max[k], g.positions[i + k]);
      }
    }
  }
  const center = box.min.map((v, i) => (v + box.max[i]) / 2);
  const size = Math.max(...box.max.map((v, i) => v - box.min[i]), 1);

  for (const g of spec.groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(g.uvs, 2));
    geo.setIndex(g.indices);
    geo.computeVertexNormals();
    let material;
    if (g.textureIndex !== null && textures.has(g.textureIndex)) {
      material = new THREE.MeshStandardMaterial({
        map: textures.get(g.textureIndex),
        side: THREE.DoubleSide,
        roughness: 0.9,
        metalness: 0,
      });
    } else {
      material = new THREE.MeshStandardMaterial({
        color: g.fallbackColor || 0x70766f,
        side: THREE.DoubleSide,
        roughness: 0.9,
        metalness: 0,
      });
    }
    scene.add(new THREE.Mesh(geo, material));
  }

  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(size, size * 1.3, size);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xaad0ff, 0.4);
  fill.position.set(-size, size * 0.4, -size * 0.6);
  scene.add(fill);

  const camera = new THREE.PerspectiveCamera(35, width / height, 0.1, size * 20);
  const yaw = (spec.yaw || 0) * Math.PI / 180;
  const pitch = (spec.pitch || 0) * Math.PI / 180;
  const distance = size * 2.1;
  const cx = center[0] + distance * Math.cos(pitch) * Math.sin(yaw);
  const cy = center[1] - distance * Math.sin(pitch);
  const cz = center[2] + distance * Math.cos(pitch) * Math.cos(yaw);
  camera.position.set(cx, cy, cz);
  camera.lookAt(center[0], center[1], center[2]);

  console.log('about to render', spec.groups.length, 'groups');
  renderer.render(scene, camera);
  console.log('rendered');
  window.renderDone = true;
  return 'ok';
} catch (e) {
  console.log('ERROR', e.message, e.stack);
  return 'error:' + e.message;
}
};
</script>
</body></html>
